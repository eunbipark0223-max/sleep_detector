<!--
═══════════════════════════════════════════════════════════════
static/admin_login.html — 관리자 로그인 화면
담당: D   |   우선: P0

[이 파일이 하는 일]
  - 이메일 · 비밀번호로 POST /users/login → 관리자(role admin)면 토큰 저장 후 admin.html 로 이동
  - 기사 계정이면 "관리자 계정이 아닙니다"
  - 로고: img/logo.png (졸음 가드 올빼미, 팀 확정 이미지) · 탭 아이콘 img/favicon.png
  - 구글 계정 로그인 (11/16): [Google로 계속하기] → 서버 GET /users/google/config 의 Firebase 설정으로 구글 창 → id_token 을 POST /users/google 로 보냄.
    관리자 계정(role admin)만 들어올 수 있고 서버가 id_token 을 검증한다 (services/firebase_verify.py). 모의 서버(mock=true)는 구글 창 없이 시험용 관리자로 바로 로그인
  - 화면 모양 (11/16): 관리자 화면(admin.html)과 같은 Readdy 시안 값 — 연한 회색 바탕 · 흰 둥근 카드(22px) · 입력 칸 10px · 남색 알약 버튼.
    색 · 글자 · 모서리 값은 admin.html 맨 위 :root 와 같다 (글자 22 · 13 · 12 세 단계만, 굵기 400 · 500 · 600)
═══════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 졸음 가드 관리자</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {   /* 관리자 화면(admin.html)과 같은 값 */
      --fg-400: #8A90A5; --fg-500: #666C85; --fg-700: #3A4157; --fg-950: #1F2430;     /* 앱 theme.dart 와 같은 색 */
      --bg-50: #FFFFFF; --bg-100: #F3F5FA; --bg-200: #E1E5F0;
      --pr-50: #F1F3FA; --pr-300: #A9B3DE; --pr-700: #1F2A5C; --pr-800: #141C42; --rd-600: #B3261E;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      --fs-headline: 22px; --fs-body: 13px; --fs-cap: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg-100); color: var(--fg-950);
           font-family: var(--font); font-size: var(--fs-body); line-height: 1.5; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; word-break: keep-all; }
    form { width: min(380px, 100%); padding: 40px 32px 32px; background: var(--bg-50); border-radius: 22px; box-shadow: 0 1px 2px rgba(16, 19, 25, .03); }
    .logo { display: block; width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px; }
    .pill { display: block; width: fit-content; margin: 0 auto 12px; padding: 4px 10px; border-radius: 999px; background: var(--pr-50); color: var(--pr-700); font-size: var(--fs-cap); font-weight: 500; }
    h1 { margin-bottom: 4px; font-size: var(--fs-headline); font-weight: 600; letter-spacing: -.035em; line-height: 1.2; text-align: center; }
    p.sub { margin-bottom: 28px; color: var(--fg-500); text-align: center; }
    label { display: block; margin: 16px 0 6px; font-size: var(--fs-cap); font-weight: 500; color: var(--fg-700); }
    input { width: 100%; height: 40px; padding: 0 14px; border: 1px solid transparent; border-radius: 10px; background: var(--bg-100); font: inherit; letter-spacing: inherit; color: inherit; outline: none; transition: box-shadow .25s cubic-bezier(.32, .72, 0, 1), background .2s; }
    /* 선택했을 때 (11/17, 애플 느낌): 테두리를 굵게 바꾸거나 바깥선을 또 두지 않고, 흰 바탕 + 바깥으로 번지는 부드러운 빛무리 한 겹만 */
    input:focus { background: var(--bg-50); box-shadow: 0 0 0 3.5px rgba(112, 145, 214, .26), 0 0 0 1px rgba(112, 145, 214, .95); }
    button { display: block; width: 100%; height: 40px; margin-top: 24px; border: 0; border-radius: 999px; background: var(--pr-700); color: #fff; font: inherit; font-weight: 500; letter-spacing: inherit; cursor: pointer; transition: background .15s; }
    button:hover:not(:disabled) { background: var(--pr-800); }
    button:focus-visible { outline: 2px solid #7091D6; outline-offset: 2px; }      /* 입력칸은 위의 빛무리가 선택 표시를 대신함 (바깥선 없음) */
    button:disabled { opacity: .6; cursor: default; }
    .or { display: flex; align-items: center; gap: 12px; margin-top: 16px; color: var(--fg-400); font-size: var(--fs-cap); }
    .or::before, .or::after { content: ''; flex: 1; height: .5px; background: var(--bg-200); }
    button.google { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; background: var(--bg-50); color: var(--fg-950); box-shadow: inset 0 0 0 1px var(--bg-200); }
    button.google:hover:not(:disabled) { background: var(--bg-100); }
    #msg { min-height: 20px; margin-top: 14px; font-size: var(--fs-cap); font-weight: 500; color: var(--rd-600); text-align: center; }
    #msg.ok { color: #17653A; }
    .alt { margin-top: 6px; font-size: var(--fs-cap); color: var(--fg-500); text-align: center; }
    .alt a { color: var(--pr-700); font-weight: 500; text-decoration: none; }
    .alt a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <form id="loginForm">
    <img class="logo" src="img/logo.png" alt="졸음 가드 로고 (올빼미)" width="48" height="48">
    <span class="pill">관리자 전용</span>
    <h1>졸음 가드 관리자</h1>
    <p class="sub">졸음 경고 확인 · 조치완료</p>
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">로그인</button>
    <div class="or" aria-hidden="true">또는</div>
    <button id="googleBtn" class="google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Google로 계속하기</span></button>
    <div id="msg" role="alert"></div>
    <p class="alt">관리자 계정이 없나요? <a href="admin_signup.html">사번으로 가입하기</a></p>
  </form>

  <script src="js/api.js?v=20261117c"></script>
  <script>
    // 관리자 화면에서 '관리자만 사용할 수 있어요(403)'로 돌아온 경우 이유를 알려 준다 (api.js 가 ?denied=1 을 붙여 보냄)
    if (new URLSearchParams(location.search).has('denied')) {
      document.getElementById('msg').textContent = '관리자 권한이 없는 계정이에요. 관리자 계정으로 다시 로그인해 주세요.';
    }
    if (new URLSearchParams(location.search).has('joined')) {                  // 가입을 마치고 돌아온 경우 (admin_signup.html)
      const m = document.getElementById('msg'); m.textContent = '가입이 완료됐어요. 이메일과 비밀번호로 로그인해 주세요.'; m.className = 'ok';
    }
    // 구글 로그인: 서버가 알려 주는 Firebase 웹 설정으로 구글 창을 띄우고, 받은 id_token 을 서버로 보내 확인받는다
    const FIREBASE_SDK = '10.14.1';
    function googleErrorText(err) {
      const code = err && err.code;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return '구글 로그인 창을 닫았어요.';
      if (code === 'auth/popup-blocked') return '팝업이 막혔어요. 이 사이트의 팝업을 허용해 주세요.';
      if (code === 'auth/unauthorized-domain') return '이 주소는 구글 로그인에 등록되지 않았어요. Firebase 콘솔의 승인된 도메인에 추가해 주세요.';
      return (err && err.message) || '구글 로그인에 실패했어요.';
    }
    document.getElementById('googleBtn').addEventListener('click', async () => {
      const btn = document.getElementById('googleBtn'), msg = document.getElementById('msg'), label = btn.querySelector('span');
      btn.disabled = true; label.textContent = '구글 창 여는 중…'; msg.textContent = '';
      try {
        const cfg = await fetchGoogleConfig();
        if (!cfg.enabled) throw new Error('구글 로그인 설정이 아직 없어요. 서버 .env 의 FIREBASE_PROJECT_ID · FIREBASE_API_KEY 를 채워 주세요.');
        let profile;
        if (cfg.mock) {                                           // 모의 서버: 구글 창 없이 시험용 관리자
          profile = { email: 'admin.google@test.com', name: '구글 관리자', firebase_uid: 'mock-admin', id_token: 'mock' };      // 이메일 계정(admin@test.com)과 따로, 구글로 만든 시험용 관리자 (설정에서 이메일 변경이 막히는지 보려고)
        } else {
          const [{ initializeApp }, { getAuth, GoogleAuthProvider, signInWithPopup }] = await Promise.all([
            import('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK + '/firebase-app.js'),
            import('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK + '/firebase-auth.js')]);
          const app = initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId, appId: cfg.appId || undefined });
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });   // 늘 구글 계정 선택 창을 띄움 — 브라우저에 구글 계정이 하나만 로그인돼 있어도 다른 계정을 고를 수 있게 (11/23)
          const cred = await signInWithPopup(getAuth(app), provider);
          const u = cred.user;
          profile = { email: u.email, name: u.displayName || String(u.email).split('@')[0], firebase_uid: u.uid, id_token: await u.getIdToken() };
        }
        await adminGoogleLogin(profile);
        location.href = 'admin.html';
      } catch (err) {
        msg.textContent = googleErrorText(err);
        btn.disabled = false; label.textContent = 'Google로 계속하기';
      }
    });
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = document.getElementById('submit');
      const msg = document.getElementById('msg');
      button.disabled = true;
      button.textContent = '로그인 중…';
      msg.textContent = ''; msg.className = '';
      try {
        await adminLogin(document.getElementById('email').value.trim(), document.getElementById('password').value);
        location.href = 'admin.html';
      } catch (err) {
        msg.textContent = err.message;
        button.disabled = false;
        button.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
