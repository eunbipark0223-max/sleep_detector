[이 파일이 하는 일]
  - 이메일 · 비밀번호로 POST /users/login → 관리자(role admin)면 토큰 저장 후 admin.html 로 이동
  - 기사 계정이면 "관리자 계정이 아닙니다"
  - 로고: img/logo.png (졸음 가드 올빼미, 팀 확정 이미지) · 탭 아이콘 img/favicon.png
  - 화면 모양 (11/12): 앱(졸음 가드)과 같은 테마 — navy 그라데이션 바탕 · 큰 둥근 흰 카드 · 큰 둥근 navy 버튼. 부엉이 캐릭터는 쓰지 않고 로고만 둠

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>졸음 가드 관리자 로그인</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
    :root { --navy: #1F2A5C; --navy-dark: #141C42; --bg: #F3F5FA; --red: #B3261E; --control-border: #6A7189; --tile: #E9EDF8; }   /* 관리자 화면(admin.html)과 같은 값 */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           background: radial-gradient(900px 520px at 12% 0%, #3B4DA3 0%, rgba(59, 77, 163, 0) 62%), linear-gradient(160deg, #2B3A82 0%, #1F2A5C 55%, #141C42 100%);
           font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: #1F2430; }
    form { width: min(420px, 100%); background: #fff; border-radius: 28px; padding: 40px 34px 34px; box-shadow: 0 24px 60px rgba(10, 16, 48, .45); }
    .logo { width: 72px; height: 72px; margin: 0 auto 14px; display: block; border-radius: 20px; }
    .pill { display: block; width: fit-content; margin: 0 auto 12px; padding: 6px 16px; border-radius: 999px; background: var(--tile); color: var(--navy); font-size: 14px; font-weight: 800; }
    h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; color: #1F2430; text-align: center; letter-spacing: -.02em; }
    p.sub { margin: 0 0 26px; font-size: 15px; color: #4A5068; text-align: center; }
    label { display: block; margin: 16px 0 8px; font-size: 14px; font-weight: 700; }
    input { width: 100%; height: 54px; padding: 0 18px; border: 1.5px solid var(--control-border); border-radius: 16px; font-size: 16px; font-family: inherit; background: var(--bg); }
    input:focus { outline: 3px solid #3B57D9; outline-offset: 2px; border-color: var(--navy); background: #fff; }
    button { width: 100%; height: 58px; margin-top: 28px; border: 0; border-radius: 18px; background: var(--navy); color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 0 6px 16px rgba(31, 42, 92, .3); }
    button:hover:not(:disabled) { background: var(--navy-dark); }
    button:focus-visible { outline: 3px solid #3B57D9; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: default; }
    #msg { min-height: 22px; margin-top: 14px; font-size: 14px; font-weight: 600; color: var(--red); text-align: center; }
  </style>
</head>
<body>
  <form id="loginForm">
    <img class="logo" src="img/logo.png" alt="졸음 가드 로고 (올빼미)" width="72" height="72">
    <span class="pill">관리자 전용</span>
    <h1>졸음 가드 관리자</h1>
    <p class="sub">졸음 경고 확인 · 조치완료</p>
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">로그인</button>
    <div id="msg" role="alert"></div>
  </form>

  <script src="js/api.js?v=20261110"></script>
  <script>
    // 관리자 화면에서 '관리자만 사용할 수 있어요(403)'로 돌아온 경우 이유를 알려 준다 (api.js 가 ?denied=1 을 붙여 보냄)
    if (new URLSearchParams(location.search).has('denied')) {
      document.getElementById('msg').textContent = '관리자 권한이 없는 계정이에요. 관리자 계정으로 다시 로그인해 주세요.';
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = document.getElementById('submit');
      const msg = document.getElementById('msg');
      button.disabled = true;
      button.textContent = '로그인 중…';
      msg.textContent = '';
      try {
        await adminLogin(document.getElementById('email').value.trim(), document.getElementById('password').value);
        location.href = 'admin.html';
      } catch (err) {
        msg.textContent = err.message;
        button.disabled = false;
        button.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
