    }
    // ── 이메일 변경 (11/17): 이메일로 가입한 계정만. [변경] → 새 이메일 + 지금 비밀번호 → [인증번호 받기] → 6자리 입력 → [이메일 바꾸기]. 구글 계정은 [변경] 이 없음 ──
    let ecTimer = null, ecLeft = 0, ecEmail = '';
    const EC_EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    function setReveal(id, open) { const el = $(id); if (!el) return; el.classList.toggle('open', open); if (open) el.removeAttribute('inert'); else el.setAttribute('inert', ''); }
    function ecStopTimer() { clearInterval(ecTimer); ecTimer = null; }
    function ecTick() {
      const m = $('ecCodeMatch'); if (!m) { ecStopTimer(); return; }
      if (ecLeft <= 0) { ecStopTimer(); m.textContent = '인증번호가 만료됐어요. 다시 받아 주세요'; m.className = 'match err'; return; }
      m.textContent = '남은 시간 ' + Math.floor(ecLeft / 60) + ':' + String(ecLeft % 60).padStart(2, '0'); m.className = 'match idle';
    }
    function ecUpdateBtns() {                            // 큰 버튼은 입력이 맞을 때만 켜짐 (애플처럼 회색 → 진한 남색)
      const send = $('ecSend'), conf = $('ecConfirm'); if (!send || !conf) return;
      const nv = $('ecNew').value.trim(), same = !!me && nv.toLowerCase() === String(me.email || '').toLowerCase();
      send.disabled = !(EC_EMAIL_RE.test(nv) && !same && $('ecPw').value);
      conf.disabled = !(/^\d{6}$/.test($('ecCode').value.trim()) && ecLeft > 0);
    }
    function ecReset() {                                 // 패널을 닫을 때 처음 상태로
      ecStopTimer(); ecEmail = ''; ecLeft = 0;
      ['ecNew', 'ecPw', 'ecCode'].forEach((id) => { const el = $(id); if (el) { el.value = ''; el.disabled = false; el.classList.remove('bad'); } });

      else if (!wideNav.matches && document.body.classList.contains('nav-open')) setNav(false);
    });

    // 종 = 알림 목록 열기 (보러 갔으니 알림음 · 깜빡임은 끈다). 알림 배너 [바로 보기] 는 긴급 경고가 모여 있는 홈으로
    $('bellBtn').addEventListener('click', () => { silenceAlert(); setNotif($('notifMenu').hidden); });
    $('ubView').addEventListener('click', () => { silenceAlert(); go('dashboard'); });
    $('ubClose').addEventListener('click', () => { silenceAlert(); $('bellBtn').focus(); });
    $('soundSwitch').addEventListener('click', () => {
      soundOn = !soundOn;
      try { localStorage.setItem('adminSound', soundOn ? 'on' : 'off'); } catch (e) { /* 저장 못 해도 이번 화면에서는 적용 */ }
      syncSoundBtn();
      if (soundOn) beep();                             // 켤 때 한 번 들려 줘서 소리가 나는지 알 수 있게
    });
    syncSoundBtn();
    $('logoutBtn').addEventListener('click', () => { clearToken(); location.href = 'admin_login.html'; });
    $('driverSearch').addEventListener('input', (ev) => { driverQuery = ev.target.value; renderAll(true); });
    // 정렬 고르기 (11/17): 애플 모양 선택 메뉴. 기본 <select> 의 팝업 대신 직접 그림 (알약 버튼 + 유리 같은 팝오버, 고른 항목에 체크, 키보드 ↑ ↓ Enter Esc)
    function dropdown(boxId, label, options, getValue, onPick) {
      const text = h('span', { class: 'dd-label' });
      const btn = h('button', { type: 'button', class: 'dd-btn', 'aria-haspopup': 'listbox', 'aria-expanded': 'false' }, text, icon('unfold', 16));
      const items = options.map(([v, t]) => h('li', { class: 'dd-item', role: 'option', 'data-value': v, tabindex: '-1' }, icon('check', 14), t));
      const menu = h('ul', { class: 'dd-menu', role: 'listbox', 'aria-label': label, hidden: true }, items);
      $(boxId).append(btn);
      document.body.append(menu);                                // 카드(overflow: hidden)에 잘리지 않게 body 에 붙임
      const sync = () => {
        const cur = getValue(), f = options.find((o) => o[0] === cur);
        text.textContent = f ? f[1] : '';
        btn.setAttribute('aria-label', label + ': ' + text.textContent);
        items.forEach((li) => li.setAttribute('aria-selected', String(li.dataset.value === cur)));
      };
      const outside = (ev) => { if (!menu.contains(ev.target) && !btn.contains(ev.target)) close(false); };
      const closeQuiet = () => close(false);
      function close(refocus) {
        if (menu.hidden) return;
        menu.hidden = true; btn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('pointerdown', outside, true); window.removeEventListener('resize', closeQuiet); window.removeEventListener('scroll', closeQuiet, true);
        if (refocus) btn.focus({ preventScroll: true });
      }
      function open() {
        sync();
        const r = btn.getBoundingClientRect();
        menu.style.minWidth = r.width + 'px';                // 버튼보다 좁아지지 않게 (글자가 길면 그만큼만 넓어짐)
        menu.hidden = false;
        menu.style.top = (r.bottom + 6) + 'px';
        menu.style.left = Math.max(8, Math.min(innerWidth - menu.offsetWidth - 8, r.right - menu.offsetWidth)) + 'px';      // 버튼 오른쪽 끝에 맞춤
        btn.setAttribute('aria-expanded', 'true');
        (items.find((li) => li.getAttribute('aria-selected') === 'true') || items[0]).focus({ preventScroll: true });
        document.addEventListener('pointerdown', outside, true); window.addEventListener('resize', closeQuiet); window.addEventListener('scroll', closeQuiet, true);
      }
      function pick(v) { close(true); if (v !== getValue()) { onPick(v); sync(); } }
      btn.addEventListener('click', () => { if (menu.hidden) open(); else close(true); });
      btn.addEventListener('keydown', (ev) => { if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); open(); } });
      items.forEach((li) => li.addEventListener('click', () => pick(li.dataset.value)));
      menu.addEventListener('keydown', (ev) => {
        const i = items.indexOf(document.activeElement), go = (n) => { ev.preventDefault(); items[(n + items.length) % items.length].focus({ preventScroll: true }); };
        if (ev.key === 'ArrowDown') go(i + 1);
        else if (ev.key === 'ArrowUp') go(i - 1);
        else if (ev.key === 'Home') go(0);
        else if (ev.key === 'End') go(items.length - 1);
        else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (i >= 0) pick(items[i].dataset.value); }
        else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); close(true); }
        else if (ev.key === 'Tab') close(false);
      });
      sync();
    }
    dropdown('driverSortBox', '기사 정렬 기준', [['danger', '위험 먼저'], ['name', '이름순'], ['join', '가입순']], () => driverSort, (v) => { driverSort = v; renderAll(true); });
    dropdown('hazardSortBox', '경고 정렬 기준', [['urgent', '긴급 먼저'], ['stage', '단계순'], ['time', '시간순']], () => hazardSort, (v) => { hazardSort = v; renderAll(true); });
    $('hazardSearch').addEventListener('input', (ev) => { hazardQuery = ev.target.value; renderAll(true); });
    document.addEventListener('keydown', (ev) => {   // 탭: 좌우 화살표 · Home · End (화면에 있는 모든 탭 막대에 한 번에)
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) return;
      const box = ev.target.closest && ev.target.closest('[role="tablist"]');
      if (!box) return;
      const tabs = [...box.querySelectorAll('[role="tab"]')], i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      ev.preventDefault();
      const next = tabs[ev.key === 'Home' ? 0 : ev.key === 'End' ? tabs.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
      next.click();
      const again = box.querySelector('[data-key="' + next.dataset.key + '"]'); if (again) again.focus();
    });
    showView(false);
    refreshAll(true);
    loadMe();
    setInterval(() => { if (!busy) refreshAll(false); }, 10000);
  </script>
</body>
</html>
