[11/16 디자인 전면 교체 — Readdy 시안과 똑같이]
  시안: https://readdy.cc/preview/689ad06e-de96-4ef9-8262-036363d1377e/15959345/  (사용자 지시: 원래 디자인은 버리고 로직만 두고, 시안과 똑같이, 애플 느낌)
  기능 · 서버 API · JSON 칸 이름 · 글은 11/12 판 그대로 (PATCH /events/{id}/status 등). 바뀐 것은 모양과 배치.
  · 틀: 흰 반투명 사이드바(홈 · 졸음 경고 · 기사 관리, 위쪽 아이콘으로 접고 펼침) + 위쪽 막대(졸음 가드 · LIVE · 종 · 관리자 프로필)
  · 홈: 4칸 요약 + 긴급 경고 카드 / 통계: 그래프 4개를 한 줄로 (메뉴: 홈 · 졸음 경고 · 기사 관리 · 통계)
  · 상세(경고 · 기사)는 새 화면이 아니라 오른쪽에서 밀려 나오는 패널(드로어). 주소 #event/번호 · #driver/번호 는 그대로라서 뒤로 가기 · 새 탭 · 링크 공유가 됨.
    패널 뒤에는 '그 상세를 열기 전에 보던 화면'이 남음 (직접 주소로 들어오면 경고 = 졸음 경고, 기사 = 기사 관리)
  · 이름은 어디서나 '이정자 기사님' 형식. 표는 맨 오른쪽 칸이 상태 배지. 실시간 시계 · '갱신 시각' 글자 없음
  · 서버 연결이 끊기면 배너 대신 위쪽 막대의 LIVE 가 '연결 끊김'(빨강)으로 바뀜. 새 긴급 경고가 오면 알림음 + 탭 제목 깜빡임 + 잠깐 뜨는 알림 띠(닫기 · 바로 보기)

[디자인 규칙 — 아래 CSS 맨 위 :root 가 전부. 시안의 값을 그대로 옮기되, 들쭉날쭉한 크기는 한 줄로 모았다]
  · 글자 6단계만: 34(큰 숫자) · 30(화면 제목) · 22(패널 이름 · 도넛 가운데) · 15(카드 제목) · 13(본문 · 표 · 메뉴 · 버튼) · 12(보조 글 · 표 머리 · 배지 · 탭). 굵기 400 · 500 · 600
    (시안은 9.5 · 10.5 · 11 · 11.5 · 12.5 · 13.5 처럼 0.5 단위로 흩어져 있어서 가까운 값으로 모음)

  · 모서리 10(메뉴 · 입력) · 14(패널 안 칸) · 22(카드) · 24(패널) · 알약. 그림자는 카드 한 가지 + 패널
  · 버튼은 알약: 작은 것 32(12px) · 보통 40(13px)

[이 파일이 하는 일]
  - 홈: 맨 위 '긴급' 카드(미처리 긴급 전부, 늘 펼쳐 둠) + 그 아래 3칸 요약(운행 중 기사 · 오늘 경고 · 휴게 미준수) + 칸을 누르면 아래에 이름 목록.
    (11/16 사용자 결정 — 기사 표는 기사 관리와 겹치고, 그래프는 통계로 뺌. 11/18 팀 의견 — 긴급은 바로 조치하게 4칸에서 빼서 맨 위 카드로)
  - 통계 #stats: 시간대별 경고 · 기사 상태 · 주간 경고 추이 · 경고 분석(단계별/종류별) 를 한 줄로. 이미 받은 경고 · 기사 목록 · 서버 /admin/stats/* 로 계산 (서버에 없는 값은 만들지 않음)
  - 긴급 알림: 새 3단계 · "음성 응답 없음"이 생기면 알림음(삐 3번) + 탭 제목 깜빡임 + 알림 띠. 알림음은 프로필 메뉴의 스위치로 켜고 끔. 종 배지는 안 읽은 긴급 건수 (11/18: 같은 숫자를 띄우던 사이드바 '졸음 경고' 배지는 뺌)
    (브라우저는 화면을 한 번 누르기 전에는 소리를 막아서, 그때는 알림 띠에 안내가 나옴)
  - 졸음 경고: 둥근 탭(전체 · 미확인 · 1단계 | 주의 · 2단계 | 휴식 권고 · 3단계 | 위험(3단계 전부) · 긴급(그중 조치완료 안 한 것만), 11/17 단계로 나눔) + 표 + 검색. 미처리 긴급이 있으면 '긴급' 탭으로 열림. 좌우 화살표로 탭 이동
    · 3단계 / "음성 응답 없음" 미처리 줄은 연한 빨강 + 그 줄에 [조치완료]. 줄을 누르면 경고 상세 패널
    · 경고 상세 패널: 기사님 이름 · 단계 배지 → 종류 · 시각 · 위치 · 차량번호 · 연락처 · 처리 상태 → 지금 할 일 · AI 분석 결과 · 음성 퀴즈 기록 · 사진 → [전화 연결] [조치완료]
      (눈 측정값 · 좌표 숫자는 보여 주지 않음. LLM · RAG · Agent 같은 용어는 쓰지 않음. 모의 값 표시 · 안내 문구는 11/16 사용자 지시로 모두 뺌)
    · 상세를 열면 미확인 → 확인 으로 자동으로 바뀜 (화면이 보일 때만. 서버는 '확인'을 미확인일 때만 받음 → 조치완료를 되돌리지 않음)
    · [조치완료] → PATCH /events/{id}/status → 3단계 해제 (패널에 그대로 머묾)
  - 기사 관리: 탭(전체 · 조치 필요 · 확인 필요 · 이상 없음 · 전화번호 미등록) + 표 + 검색. 조치 필요 기사는 맨 위 빨간 줄 + [전화]. 줄을 누르면 기사 상세 패널
    (차량번호 · 연락처 · 이메일 · 오늘 · 누적 · 마지막 경고 + 단계별 경고 + 최근 경고 목록). 서버 API 추가 없이 이미 받은 경고 · 기사 목록으로 계산
  - 내 정보 #profile: 이름 · 전화번호 수정(이메일은 고정) → PATCH /users/me · 비밀번호 변경 → PUT /users/me/password

[기사 연락 (전화번호 · 차량번호)]
  - 앱이 가입 · 로그인 직후 비어 있으면 입력 창을 띄워 필수로 받음 (팀장 11/12). '미등록'은 그 전에 만든 예전 계정에만 남고, 다시 로그인하면 채워짐
  - 번호 · 이메일은 누르면 복사. [전화 연결](tel:) · [문자](sms:) (번호가 없으면 [이메일 보내기])

[접근성 — 시안 크기를 따르면서 지킨 것]
  - 페이지가 바뀌면 제목(h1)으로, 패널이 열리면 패널 제목으로 포커스 이동. 패널이 열려 있는 동안 뒤 화면은 inert (키보드가 못 들어감), Esc · 바깥 누르기로 닫힘
  - 목록 · 상세는 진짜 링크(Enter · 새 탭 · 뒤로 가기). 단계 · 상태는 색과 함께 글자로도 표시
  - 10초마다 새로 불러와도 바뀐 게 없으면 다시 그리지 않고, 그릴 때도 포커스 유지. 알림은 aria-live. 오류 알림은 닫을 때까지 남음(Esc 로도 닫힘)
  - 주소를 못 찾으면 좌표와 지도 링크를 보여 줌. 주소 # (dashboard · hazards · drivers · profile · event/번호 · driver/번호) 로 화면을 기억
  - ※ 시안의 12~13px 글자는 이전(11/12) 판의 '14px 이상' 약속보다 작다. 키우려면 아래 :root 의 --fs-body · --fs-cap 두 줄만 바꾸면 전체가 같이 바뀐다

[주의]
  - 서버가 보낸 글(LLM 요약 · 보고서 · 이름)은 항상 textContent 로만 넣는다 (innerHTML 금지)
  - 글자가 화면에 그려지는 곳은 모두 h() 를 거치고, h() 가 'null' · 'None' 같은 값 없음 글자를 지운다 (clean)
  - 아이콘(SVG)은 아래 ICONS 의 고정 값만 쓴다

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>졸음 가드 관리자</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* ═══════════════════════════════════════════════════════════
       디자인 토큰 — Readdy 시안(readdy.cc)에서 읽은 값. 아래 화면 CSS 는 전부 이 값만 가져다 쓴다.
       ═══════════════════════════════════════════════════════════ */
    :root {
      /* 글자 · 바탕 · 선 (시안의 foreground · background 계열) */
      --fg-300: #B5BACB; --fg-400: #8A90A5; --fg-500: #666C85; --fg-600: #4A5068; --fg-700: #3A4157; --fg-800: #2B3144; --fg-900: #222838; --fg-950: #1F2430;     /* 글자: 앱 textPrimary · textSecondary · textMuted */
      --bg-50: #FFFFFF; --bg-100: #F3F5FA; --sep: rgba(31, 42, 92, .12); --bg-200: #E1E5F0; --bg-300: #D9DEEA;     /* 바탕 #F3F5FA · 테두리 #D9DEEA = 앱 background · cardBorder */
      /* 파랑(primary): 1단계 · 2단계 · 선택 표시 */
      --pr-50: #F1F3FA; --pr-100: #E3E7F5; --pr-200: #CFD5EE; --pr-300: #A9B3DE; --pr-400: #7A89C9; --pr-500: #3B4DA3; --pr-600: #2B3A82; --pr-700: #1F2A5C; --pr-800: #141C42;     /* 브랜드 남색: --pr-700 = 앱 navy #1F2A5C */
      /* 초록(정상) · 빨강(3단계 · 긴급) */
      /* 1 주의 노랑 · 2 휴식 권고 주황: 앱 caution #F2B01E · rest #F28C28 (-bg 옅은 바탕, -ink 그 위 글자) */
      --st1: #F2B01E; --st1-bg: #FEF5DC; --st1-ink: #5C3D00; --st2: #F28C28; --st2-bg: #FDEBD8; --st2-ink: #7C2D12;
      --ok-50: #E8F6EE; --ok-500: #2E9E5B; --ok-600: #1F7A45; --ok-700: #17653A; --ok-800: #14532D;     /* 0 정상: --ok-500 = 앱 normal #2E9E5B */
      --rd-50: #FDEEEC; --rd-100: #FAD9D5; --rd-400: #E8695F; --rd-500: #D93025; --rd-600: #B3261E; --rd-700: #8A1C14;     /* 3 긴급: --rd-500 = 앱 urgent #D93025 */
      /* 글자 6단계 · 굵기 3가지 · 자간 */
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;      /* 애플 기기는 SF · 애플산돌고딕, 그 밖에는 애플 글꼴과 가장 닮은 프리텐다드 */
      --fs-display: 34px; --fs-title: 30px; --fs-headline: 22px; --fs-sub: 15px; --fs-body: 13px; --fs-cap: 12px;
      --fw-r: 400; --fw-m: 500; --fw-sb: 600;
      --ls-display: -.055em; --ls-title: -.04em; --ls-headline: -.035em; --ls-sub: -.01em; --ls-body: -.005em;
      /* 모서리 · 그림자 */
      --r-sm: 10px; --r-md: 14px; --r-block: 20px; --r-card: 22px; --r-sheet: 24px; --r-pill: 999px;      /* --r-block: 상세 창 안의 덩어리(사진 · AI 분석 · 퀴즈 · 달력 바탕 · 지금 보는 경고 줄)는 모두 같은 둥글기 (11/17: 전에는 12 · 14 · 16 · 18 · 22 로 제각각이었음) */
      --shadow-card: 0 0 0 .5px rgba(0, 0, 0, .06), 0 2px 14px rgba(0, 0, 0, .045);       /* 애플 카드: 얇은 테두리 + 넓고 옅은 그림자 */
      --shadow-seg: 0 1px 3px rgba(16, 19, 25, .1);
      --shadow-sheet: -20px 0 60px -24px rgba(16, 19, 25, .35);
      --ease: cubic-bezier(.32, .72, 0, 1);                                                  /* iOS 스프링 느낌의 움직임 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font); font-size: var(--fs-body); font-weight: var(--fw-r); line-height: 1.5; letter-spacing: var(--ls-body); color: var(--fg-950); background: var(--bg-100);
           -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
    body.has-drawer { overflow: hidden; }
    svg { display: block; flex: none; }
    button, input { font: inherit; color: inherit; letter-spacing: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    ul, ol { list-style: none; }
    :focus-visible { outline: 3px solid rgba(31, 42, 92, .38); outline-offset: 1px; }          /* 포커스 링: 애플 파랑 대신 우리 남색 */
    ::selection { background: rgba(31, 42, 92, .18); }
    html { scroll-behavior: smooth; scrollbar-gutter: stable; }      /* 스크롤바 자리를 늘 비워 둠 (11/17): 목록이 길어져 스크롤바가 생기거나 짧아져 사라질 때마다 화면 전체 폭이 10px 줄었다 늘었다 하던 것 막음 */
    * { scrollbar-width: thin; scrollbar-color: rgba(60, 60, 67, .28) transparent; }
    /* 눌렀을 때 97% 로 살짝 줄어드는 효과는 '진짜 동작 버튼'(.btn · .sbtn · a.pill)에만 (11/17). 전에는 모든 버튼에 걸려서 달력 날짜 · 정렬 · 이전/다음 달 · 아이콘 · 스위치 · 메뉴 항목 · 복사 · 닫기까지 눌릴 때마다 작아졌음 */
    .btn:active:not(:disabled), .sbtn:active:not(:disabled), a.pill:active, a.sbtn:active { transform: scale(.97); }
    /* 상세 창 뒤의 어두운 바탕도 버튼이라, 위 '눌리는 효과'가 걸리면 바깥을 누르는 순간 화면 전체가 97% 로 줄어들며 가장자리에 균열(밝은 띠)이 생겼다. 절대 줄어들지 않게 막는다 */
    .drawer-scrim, .drawer-scrim:active { transform: none !important; }
    .pill, .btn, .sbtn, .seg-btn, .icon-btn, .profile-btn, .sheet-close { transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: 12px; top: -60px; z-index: 300; padding: 8px 16px; border-radius: var(--r-sm); background: #fff; color: var(--pr-700); font-weight: var(--fw-sb); }
    .skip:focus { top: 12px; }
    .tnum { font-variant-numeric: tabular-nums; }

    /* ── 틀: 사이드바 · 위쪽 막대 · 본문 ── */
    .app { display: flex; min-height: 100vh; min-height: 100dvh; }
    .sidebar { position: sticky; top: 0; align-self: flex-start; z-index: 70; display: flex; flex-direction: column; width: 248px; height: 100vh; height: 100dvh; flex: none;
               background: rgba(246, 246, 248, .72); -webkit-backdrop-filter: saturate(1.8) blur(30px); backdrop-filter: saturate(1.8) blur(30px); border-right: .5px solid var(--sep);
               transition: margin-left .25s var(--ease), visibility 0s; }
    body.nav-collapsed .sidebar { margin-left: -248px; visibility: hidden; transition: margin-left .25s var(--ease), visibility 0s .25s; }   /* 접히면 키보드로도 못 들어가게 */
    .brand-row { display: flex; align-items: center; justify-content: space-between; padding-right: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; text-decoration: none; }
    /* 사이드바 여닫는 버튼은 사이드바 안에 하나만. 사이드바가 닫혔을 때(또는 좁은 화면)만 위쪽 막대에 같은 버튼이 나타나 다시 열 수 있음 */
    @media (min-width: 1024px) { body:not(.nav-collapsed) #navToggle { display: none; } }
    .brand-box { width: 28px; height: 28px; flex: none; border-radius: 8px; overflow: hidden; background: var(--pr-700); }
    .brand-box img { display: block; width: 100%; height: 100%; }
    .brand .t { font-size: var(--fs-sub); font-weight: var(--fw-sb); letter-spacing: -.02em; }
    .menu { display: grid; gap: 2px; align-content: start; padding: 16px 12px 0; }
    .menu-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: var(--r-sm); color: var(--fg-600); text-decoration: none; transition: background .15s, color .15s; }
    .menu-item:hover { background: rgba(120, 124, 135, .1); color: var(--fg-950); }
    /* macOS 사이드바처럼: 고른 메뉴는 짙은 채움이 아니라 옅은 회색 바탕 + 파란 아이콘 */
    .menu-item[aria-current="page"] { background: rgba(120, 124, 135, .16); color: var(--fg-950); font-weight: var(--fw-m); }
    .menu-item[aria-current="page"] [data-icon] { color: var(--pr-500); }
    .scrim { display: none; }
    .main-wrap { flex: 1; min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 32px;
              background: rgba(245, 245, 247, .78); -webkit-backdrop-filter: saturate(1.8) blur(24px); backdrop-filter: saturate(1.8) blur(24px); border-bottom: .5px solid var(--sep); }
    .topbar-end { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .crumb-app { font-weight: var(--fw-m); color: var(--fg-700); }
    .crumb-sep { color: var(--fg-300); font-size: var(--fs-cap); }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--ok-700); }
    .live-dot { position: relative; width: 6px; height: 6px; border-radius: 50%; background: var(--ok-500); }
    .live-dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--ok-500); opacity: .6; animation: ping 1.4s cubic-bezier(0, 0, .2, 1) infinite; }
    .live.wait { color: var(--fg-500); } .live.wait .live-dot, .live.wait .live-dot::after { background: var(--fg-300); animation: none; }
    .live.partial { color: var(--pr-600); } .live.partial .live-dot, .live.partial .live-dot::after { background: var(--pr-400); }
    .live.lost { color: var(--rd-600); } .live.lost .live-dot, .live.lost .live-dot::after { background: var(--rd-500); animation: none; }
    @keyframes ping { 75%, 100% { transform: scale(2.4); opacity: 0; } }
    .icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--fg-600); transition: background .15s, color .15s; }
    .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: rgba(120, 124, 135, .14); color: var(--fg-950); }
    .bell-badge { position: absolute; top: 0; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rd-500); color: #fff; font-size: var(--fs-cap); font-weight: var(--fw-sb); line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg-100); }
    .bell-badge[hidden] { display: none; }
    .profile-wrap { position: relative; }      /* 팝오버는 각자 누른 버튼 바로 아래에 (버튼 높이를 36px 로 같게 해서 위 간격은 같음) */
    /* 애플 스타일 프로필 캡슐: 반투명 유리 + 얇은 테두리, 동그란 이니셜, 어두운 글자 */
    .profile-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 5px; border: 0; border-radius: var(--r-pill); background: rgba(255, 255, 255, .72); color: var(--fg-950); font-size: var(--fs-cap); font-weight: var(--fw-m);
                   -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); box-shadow: 0 0 0 .5px rgba(16, 19, 25, .12), 0 1px 3px rgba(16, 19, 25, .06); transition: background .15s, box-shadow .15s; }
    .profile-btn:hover, .profile-btn[aria-expanded="true"] { background: rgba(255, 255, 255, .95); }
    .profile-btn [data-icon] { display: inline-flex; color: var(--fg-400); transition: transform .25s var(--ease); }
    .profile-btn[aria-expanded="true"] [data-icon] { transform: rotate(180deg); }      /* 메뉴가 열리면 화살표가 위로 */
    .pname { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: none; border-radius: 50%; background: linear-gradient(160deg, var(--pr-500), var(--pr-700)) center / cover; color: #fff; font-size: var(--fs-cap); font-weight: var(--fw-sb); }
    .avatar.has-photo { background-size: cover; background-position: center; }
    .avatar.xl { width: 80px; height: 80px; font-size: var(--fs-title); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 6px 20px rgba(0, 0, 0, .12); }
    .set-photo { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: .5px solid var(--sep); }
    .set-photo-btns { display: flex; gap: 8px; }
    .set-photo .hint { margin-left: auto; text-align: right; }
    .btn[hidden] { display: none; }
    /* 애플 팝오버: 유리처럼 비치는 바탕 + 부드러운 그림자 + 살짝 커지며 나타남 */
    .menu-pop { position: absolute; right: 0; top: calc(100% + 10px); z-index: 80; width: 320px; padding: 6px; border-radius: 16px; background: #fff;
                 box-shadow: 0 16px 48px rgba(16, 19, 25, .18), 0 0 0 .5px rgba(16, 19, 25, .1); transform-origin: top right; animation: popIn .18s var(--ease) both; }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .notif-pop { padding: 0; overflow: hidden; }
    .np-head { padding: 14px 16px 10px; font-size: var(--fs-sub); letter-spacing: var(--ls-sub); }
    #notifList { max-height: 360px; overflow-y: auto; padding: 0 6px 6px; }
    .np-item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 12px 10px; border-radius: 10px; text-decoration: none; transition: background .12s; }
    .np-item:hover { background: rgba(120, 124, 135, .12); }
    .np-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pr-400); }
    .np-item.urgent:not(.read) .np-main b { color: var(--rd-600); }      /* 긴급 경고 글자는 빨강 (읽으면 옅은 회색으로) */
    .np-item.s1:not(.read) .np-dot { background: var(--st1); }      /* 단계 알림은 단계 색 (안 읽은 것만): 1단계 노랑 · 2단계 주황 · 3단계 빨강. 글자는 같은 색의 진한 쪽 */
    .np-item.s1:not(.read) .np-main b { color: var(--st1-ink); }
    .np-item.s2:not(.read) .np-dot { background: var(--st2); }
    .np-item.s2:not(.read) .np-main b { color: var(--st2-ink); }
    .np-item.s3:not(.read) .np-dot { background: var(--rd-500); }
    .np-item.s3:not(.read) .np-main b { color: var(--rd-700); }
    .np-item.urgent .np-dot { background: var(--rd-500); }
    /* 이미 열어 본 알림 (11/17): 색 점은 빈 동그라미로, 글자는 가볍고 옅게 */
    .np-item.read .np-dot, .np-item.urgent.read .np-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg-300); }
    .np-item.read .np-main b { font-weight: var(--fw-m); color: var(--fg-500); }
    .np-item.read .np-main small, .np-item.read .np-time { color: var(--fg-300); }
    .np-main { min-width: 0; display: flex; align-items: center; gap: 8px; }      /* 제목 + 작은 기사 이름을 같은 가운데 줄에 (11/17) */
    .np-main b { flex: none; font-weight: var(--fw-sb); white-space: nowrap; }
    .np-main small { min-width: 0; font-size: var(--fs-cap); font-weight: var(--fw-r); color: var(--fg-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .np-time { font-size: var(--fs-cap); color: var(--fg-400); white-space: nowrap; }
    .np-empty { padding: 28px 16px 32px; text-align: center; color: var(--fg-400); }
    .menu-pop[hidden] { display: none; }
    .mp-head { display: grid; min-width: 0; margin-bottom: 4px; padding: 10px 12px; border-bottom: .5px solid rgba(16, 19, 25, .12); }
    .mp-head b { font-weight: var(--fw-sb); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-head span { font-size: var(--fs-cap); color: var(--fg-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 12px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; text-decoration: none; }
    .mp-item:hover { background: rgba(120, 124, 135, .12); }
    .mp-item[aria-current="page"] { color: var(--pr-600); font-weight: var(--fw-m); }
    .mp-item.row { justify-content: space-between; cursor: default; }
    .mp-item.row:hover { background: none; }
    .mp-item.danger { color: var(--rd-600); }
    /* iOS 스위치: 켜짐 = 초록 + 오른쪽, 꺼짐 = 회색 + 왼쪽 */
    .switch { position: relative; flex: none; width: 46px; height: 28px; border: 0; border-radius: var(--r-pill); background: rgba(120, 120, 128, .32); transition: background .25s var(--ease); }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .28s var(--ease); }
    .switch[aria-checked="true"] { background: var(--ok-500); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }

    .content { max-width: 1440px; margin: 0 auto; padding: 40px 32px 64px; }
    .content:focus { outline: none; }
    .view { display: none; }
    .view.active { display: flex; flex-direction: column; gap: 24px; animation: viewIn .45s var(--ease) both; }     /* 화면이 바뀔 때 살짝 떠오르며 나타남 */
    @keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }
    .row-in { animation: rowIn .45s var(--ease) both; }      /* 새로 생긴 줄만 제자리에서 서서히 나타남 (11/17: 위로 튀어 오르던 움직임은 뺌) */
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .page-title { font-size: var(--fs-title); font-weight: var(--fw-sb); letter-spacing: var(--ls-title); line-height: 1; }
    .page-title:focus { outline: none; }
    .page-title:focus-visible { outline: 2px solid var(--pr-400); outline-offset: 6px; border-radius: 6px; }
    .head-stats { display: flex; align-items: center; font-size: var(--fs-cap); color: var(--fg-400); }
    .head-stat { display: flex; align-items: baseline; gap: 6px; padding: 0 12px; border-left: 1px solid rgba(212, 214, 218, .6); }
    .head-stat:first-child { padding-left: 0; border-left: 0; }
    .head-stat:last-child { padding-right: 0; }
    .head-stat .n { font-size: var(--fs-body); font-weight: var(--fw-sb); color: var(--fg-900); font-variant-numeric: tabular-nums; }

    /* 새 긴급 경고가 왔을 때만 잠깐 뜨는 알림 띠 (이미 알고 있는 긴급은 홈의 '긴급 경고' 카드 · 종 배지로) */
    /* 애플 알림 배너: 오른쪽 위에서 미끄러져 내려오는 유리 카드 [아이콘 · 제목 · 내용] + 아래 [닫기] [바로 보기] 글자 버튼 */
    .urgent-banner { position: fixed; top: 68px; right: 32px; z-index: 120; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; width: min(380px, calc(100vw - 32px)); padding: 14px 16px 10px; border-radius: 20px;
                     background: #fff; box-shadow: 0 18px 50px rgba(16, 19, 25, .22), 0 0 0 .5px rgba(16, 19, 25, .1); animation: bannerIn .45s var(--ease) both; }
    @keyframes bannerIn { from { opacity: 0; transform: translateY(-16px) scale(.97); } to { opacity: 1; transform: none; } }
    .urgent-banner[hidden] { display: none; }
    .ub-icon { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(160deg, var(--rd-400), var(--rd-500)); color: #fff; }
    .ub-text { min-width: 0; align-self: center; }
    .ub-text b { display: block; font-weight: var(--fw-sb); }
    .ub-text small { display: block; font-size: var(--fs-cap); color: var(--fg-600); }
    .ub-actions { grid-column: 2; display: flex; justify-content: flex-end; gap: 4px; border-top: .5px solid rgba(16, 19, 25, .12); margin-top: 6px; padding-top: 4px; }
    .urgent-banner button { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--fg-500); font-size: var(--fs-body); font-weight: var(--fw-m); }
    .urgent-banner button:hover { background: rgba(120, 124, 135, .12); }
    .urgent-banner button.primary { color: var(--pr-500); font-weight: var(--fw-sb); }
    @media (max-width: 767px) { .urgent-banner { right: 16px; } }

    /* ── 카드 · 목록 ── */
    .card { min-width: 0; border-radius: var(--r-card); background: var(--bg-50); box-shadow: var(--shadow-card); overflow: hidden; }
    .card.pad { padding: 24px; }
    /* 통계: 그래프 카드를 2열 2행으로 */
    #view-stats.active { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: stretch; }
    #view-stats .page-head { grid-column: 1 / -1; }
    @media (max-width: 1100px) { #view-stats.active { grid-template-columns: minmax(0, 1fr); } }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: .5px solid var(--sep); }
    .card-head.col { flex-direction: column; align-items: stretch; gap: 12px; }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sub); font-weight: var(--fw-sb); letter-spacing: var(--ls-sub); }
    .card-sub { margin-top: 4px; font-size: var(--fs-cap); color: var(--fg-400); }
    .card-meta { font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-400); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ping { position: relative; display: inline-flex; width: 6px; height: 6px; border-radius: 50%; background: var(--rd-500); }
    .ping::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--rd-500); opacity: .6; animation: ping 1s cubic-bezier(0, 0, .2, 1) infinite; }
    .empty-state { display: flex; align-items: center; gap: 10px; padding: 20px; color: var(--ok-700); font-weight: var(--fw-m); }
    .empty-note { padding: 20px; color: var(--fg-500); }

    /* 홈 맨 위 4칸 요약: 한 장의 둥근 카드 안에 가는 선으로 나눈 칸 (좁으면 2×2, 넓으면 1×4) */
    /* 4칸은 탭과 같은 한 줄 통: 옅은 회색 판 위에 칸이 붙어 있고, 고른 칸만 흰 조각이 되어 옆으로 미끄러져 옮겨 다님 (칸 사이 간격 없음) */
    /* 4칸 + 이름 목록은 카드 한 장, 겹겹이 넣지 않고 단순하게: 윗줄은 옅은 회색, 고른 칸만 흰색이라 아래 흰 목록과 곧바로 이어짐 (브라우저 탭처럼) */
    .stat-unit { border-radius: 26px; background: var(--bg-50); box-shadow: var(--shadow-card); overflow: hidden; }
    .stats { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-bottom: .5px solid var(--sep); }      /* 11/18: 4칸 → 3칸 ('긴급' 칸은 맨 위 카드로 뺌) */
    @media (max-width: 760px) { .stats .stat { padding: 18px 16px 20px; } }      /* 좁아도 3칸 한 줄 (2칸 + 1칸으로 깨지지 않게), 안쪽 여백만 줄임 */
    #statDetail .empty-note { padding: 18px 20px 20px; }
    .stat { position: relative; z-index: 1; display: block; width: 100%; padding: 22px 28px 24px; border: 0; background: transparent; text-align: left; transition: background .25s var(--ease); }
    .stat:hover { background: rgba(0, 0, 0, .025); }
    .stat[aria-pressed="true"]:hover { background: transparent; }
    .stat-ring { position: absolute; left: 0; top: 0; z-index: 0; background: transparent; pointer-events: none; transition: transform .5s var(--ease), width .5s var(--ease), height .5s var(--ease), opacity .35s ease; }
    /* 칸을 누르면 아래에 '누가 누군지' 목록이 펼쳐짐 (페이지 이동 없음) */
    /* 이름 목록은 위 4칸 판에 여백 없이 붙어서 한 덩어리 (위 칸 = 탭, 아래 = 그 탭의 내용) */
    #statDetail { background: var(--bg-50); }
    /* 고른 칸 표시는 칸 아래의 가는 남색 막대 하나. 칸을 바꾸면 이 막대가 옆으로 미끄러짐 (회색 판 · 흰 조각 없이 흰 카드 하나로) */
    .stat-ring::after { content: ''; position: absolute; left: 0; right: 0; bottom: -.5px; height: 3px; background: var(--pr-600); }
    .stat .stat-label { transition: color .3s var(--ease); }
    .stat[aria-pressed="true"] .stat-label { color: var(--fg-950); }
    /* 긴급 카드 머리 = 아래 요약 칸(.stat)과 같은 여백 · 글자 (11/18). 늘 펼쳐 둔 카드라 글자는 고른 칸처럼 진하게 */
    .uz-head { position: relative; padding: 22px 28px 24px; border-bottom: .5px solid var(--sep); background: var(--rd-50); }      /* 11/18: 머리 바탕 연한 빨강 (아래 목록은 흰색 그대로) */
    /* 아래 요약 칸에서 고른 칸 밑에 생기는 남색 막대(.stat-ring::after)와 같은 막대를 긴급 머리 밑에 늘 빨강으로 (11/18 사용자 요청). 폭은 긴급 칸(카드) 끝까지 */
    .uz-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: -.5px; height: 3px; background: var(--rd-500); }
    .uz-head .stat-label { display: flex; align-items: center; gap: 6px; color: var(--fg-950); }
    .uz-head .stat-value.alert { color: var(--rd-600); }      /* 1건 이상일 때만 빨강 (0건이면 검정) */
    @media (max-width: 760px) { .uz-head { padding: 18px 16px 20px; } }
    #urgentZone { border-radius: 26px; }      /* 바로 아래 요약 카드(.stat-unit)와 같은 둥글기 — 위아래로 붙은 두 카드 모서리가 다르지 않게 */
    #statDetail .sd-row:first-child, #urgentZone .sd-row:first-child { box-shadow: none; }      /* 첫 줄 위 선은 빼기 (카드 머리 아래 선과 겹치지 않게) */
    /* 줄 사이 선은 테두리 대신 안쪽 그림자로 (테두리는 첫 줄만 없어서 첫 줄이 1px 낮았음). 줄 높이는 44px 로 모두 같게 (11/17) */
    .sd-row { display: flex; align-items: center; gap: 12px; box-sizing: border-box; height: 44px; padding: 0 20px; box-shadow: inset 0 1px 0 rgba(16, 19, 25, .1); text-decoration: none; transition: background .12s; }      /* 홈의 목록 줄(운행 중 기사 · 오늘 경고 · 긴급 …)은 모두 높이 44px · 좌우 20px · 같은 선 (11/17) */
    .sd-row:hover { background: rgba(120, 124, 135, .08); }
    .sd-row > .who-dot { flex: none; margin-right: -4px; }      /* 이름 앞 상태 동그라미 (줄 간격 12px 에서 4px 당겨 8px) */
    .sd-main { flex: 1; min-width: 0; }
    .sd-main b { display: block; font-weight: var(--fw-m); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sd-main.sd-inline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 24px; }
    .sd-main.sd-inline b { display: block; min-width: 72px; }
    .sd-main.sd-inline > span { display: block; min-width: 120px; }
    .sd-main span { display: block; font-size: var(--fs-cap); color: var(--fg-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sd-time { font-size: var(--fs-cap); color: var(--fg-400); white-space: nowrap; }
    .sd-chev { color: var(--fg-300); display: flex; }
    .stat-label { display: block; font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-500); }
    .stat-value { display: flex; align-items: baseline; gap: 4px; margin-top: 10px; font-size: var(--fs-display); font-weight: 700; letter-spacing: var(--ls-display); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-value small { font-size: var(--fs-cap); font-weight: var(--fw-r); letter-spacing: 0; color: var(--fg-500); }
    .stat.alert .stat-value { color: var(--rd-600); }


    /* 홈 맨 위 '긴급' 카드 줄 오른쪽의 빨간 '몇 분 전' (줄 모양은 아래 .sd-row 와 같음, 11/18) */
    .u-flag { font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--rd-600); }
    .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px 0 12px; border: 0; border-radius: var(--r-pill); background: var(--bg-100); color: var(--fg-800); font-size: var(--fs-cap); font-weight: var(--fw-m); text-decoration: none; white-space: nowrap; transition: background .15s; }
    .pill:hover { background: var(--bg-200); }
    /* 애플의 '옅은 색 채움' 버튼: 색을 뺀 바탕 + 진한 글자 (너무 시끄럽지 않게) */
    .pill.call { background: rgba(217, 48, 37, .12); color: var(--rd-600); } .pill.call:hover { background: rgba(217, 48, 37, .2); }
    .pill.go { background: rgba(46, 158, 91, .16); color: var(--ok-800); } .pill.go:hover { background: rgba(46, 158, 91, .26); }

    /* ── 그래프 (오른쪽 열). 막대 · 선 · 도넛은 SVG · CSS 로 직접 그림, 글자는 HTML ── */
    .chart { padding: 24px; container-type: inline-size; }
    .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .chart-flag { font-size: var(--fs-cap); color: var(--fg-400); white-space: nowrap; }
    .chart-flag b { margin-left: 4px; font-weight: var(--fw-sb); color: var(--rd-600); font-variant-numeric: tabular-nums; }
    .chart-flag.dim b { font-weight: var(--fw-m); color: var(--fg-700); }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 148px; margin-top: 24px; }
    .bcol { position: relative; display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
    .bv { margin-bottom: 6px; font-size: var(--fs-cap); color: var(--fg-400); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .15s; }
    .bcol:hover .bv, .bv.peak { opacity: 1; }
    .bv.peak { font-weight: var(--fw-sb); color: var(--pr-700); }      /* 11/18: 최다 강조는 빨강 대신 앱 남색 (빨강은 3단계 · 긴급 뜻으로만) */
    .bar { display: block; width: 100%; max-width: 72px; min-height: 4px; border-radius: 5px; background: rgba(202, 218, 248, .7); transition: background .15s; }
    .bcol:hover .bar { background: var(--pr-300); }
    .bar.peak, .bcol:hover .bar.peak { background: var(--pr-700); }
    .bar-labels { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bg-100); font-size: var(--fs-cap); color: var(--fg-400); }
    .bar-labels span { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
    .donut-fig { position: relative; width: 132px; height: 132px; margin: 20px auto 0; }
    .donut-fig svg { width: 132px; height: 132px; transform: rotate(-90deg); }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .donut-center b { font-size: var(--fs-headline); font-weight: var(--fw-sb); letter-spacing: var(--ls-display); line-height: 1; font-variant-numeric: tabular-nums; }
    .donut-center span { margin-top: 4px; font-size: var(--fs-cap); color: var(--fg-400); }
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 20px; }
    .donut-body { display: block; }
    @container (min-width: 560px) { .donut-body { display: flex; align-items: center; justify-content: center; gap: 56px; } .donut-body .legend { width: 280px; margin-top: 0; grid-template-columns: 1fr; } .donut-body .donut-fig { margin: 20px 0 0; } }
    .legend li { display: flex; align-items: center; gap: 8px; font-size: var(--fs-cap); }
    .legend i { width: 7px; height: 7px; flex: none; border-radius: 50%; }
    .legend span { flex: 1; color: var(--fg-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .legend b { font-weight: var(--fw-m); color: var(--fg-900); font-variant-numeric: tabular-nums; }
    .week-svg { display: block; width: 100%; height: auto; margin-top: 20px; overflow: visible; }
    .week-labels { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 10px; text-align: center; font-size: var(--fs-cap); color: var(--fg-400); }
    .week-labels b { display: block; font-weight: var(--fw-m); color: var(--fg-700); font-variant-numeric: tabular-nums; }
    .hbars { display: grid; gap: 14px; margin-top: 20px; }
    .hbars li { display: grid; grid-template-columns: 96px minmax(0, 1fr) 28px; align-items: center; gap: 12px; font-size: var(--fs-cap); color: var(--fg-500); }
    .hb-track { height: 6px; border-radius: var(--r-pill); background: var(--bg-100); overflow: hidden; }
    .hb-track i { display: block; height: 100%; border-radius: var(--r-pill); }
    .hb-val { text-align: right; font-weight: var(--fw-m); color: var(--fg-900); font-variant-numeric: tabular-nums; }

    /* ── 탭(둥근 분할 막대) · 검색 · 표 ── */
    .seg { position: relative; display: flex; flex-wrap: wrap; gap: 2px; align-self: flex-start; padding: 4px; border-radius: var(--r-pill); background: var(--bg-100); }
    .seg-thumb { position: absolute; left: 0; top: 0; z-index: 0; border-radius: var(--r-pill); background: var(--bg-50); box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); pointer-events: none; transition: transform .45s var(--ease), width .45s var(--ease), height .45s var(--ease), opacity .3s ease; }   /* iOS 분할 막대의 흰 조각: 옆으로 미끄러짐 */
    .seg-btn { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--fg-500); font-size: var(--fs-cap); white-space: nowrap; transition: color .15s, background .15s; }
    .seg-btn:hover { color: var(--fg-800); }
    .seg-btn[aria-selected="true"] { color: var(--fg-950); font-weight: var(--fw-m); }
    .seg-n { font-weight: var(--fw-r); color: var(--fg-400); font-variant-numeric: tabular-nums; }
    .seg-n.alert { color: var(--rd-600); font-weight: var(--fw-m); }
    .search { position: relative; display: block; width: 190px; max-width: 100%; }
    .search [data-icon] { position: absolute; left: 12px; top: 50%; display: flex; color: var(--fg-400); transform: translateY(-50%); pointer-events: none; }
    .search input { width: 100%; height: 32px; padding: 0 12px 0 32px; border: 1px solid transparent; border-radius: var(--r-pill); background: var(--bg-100); font-size: var(--fs-cap); outline: none; transition: border-color .15s, background .15s; }
    .search input::placeholder { color: var(--fg-400); }
    .search input:focus { border-color: var(--pr-300); background: var(--bg-50); }
    /* 정렬 고르기 (11/17): 검색 칸 왼쪽의 알약 모양 선택 상자. 졸음 경고 · 기사 관리 두 표 위에 있음 */
    .head-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .sort { position: relative; display: block; }
    /* 애플 모양 선택 메뉴: 알약 버튼(위아래 화살표) + 유리처럼 비치는 팝오버(고른 항목에 체크, 살짝 커지며 나타남). 카드가 가장자리를 잘라서 메뉴는 body 에 붙임 */
    .dd-btn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px 0 14px; border: 1px solid transparent; border-radius: var(--r-pill); background: var(--bg-100); color: var(--fg-700); font: inherit; font-size: var(--fs-cap); font-weight: var(--fw-m); cursor: pointer; transition: background .15s, border-color .15s; }
    .dd-btn:hover { background: rgba(120, 124, 135, .16); }
    .dd-btn[aria-expanded="true"] { background: rgba(120, 124, 135, .24); color: var(--fg-950); }      /* 열려 있을 때: 파란 테두리 대신 한 단계 진한 회색 알약 (11/17) */
    .dd-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(16, 19, 25, .16); }      /* 키보드로 왔을 때만 옅은 회색 고리 */
    .dd-btn svg { color: var(--fg-400); }
    .dd-btn[aria-expanded="true"] svg { color: var(--fg-700); }
    .dd-menu { position: fixed; z-index: 90; margin: 0; padding: 4px; list-style: none; border-radius: 12px; font-size: var(--fs-cap);      /* 글자 크기 · 너비를 위 버튼과 맞춤 (11/17): 버튼과 같은 12px, 너비는 버튼 너비 이상으로만 (JS 가 버튼 너비를 넣음) */ background: rgba(255, 255, 255, .86); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
               box-shadow: 0 16px 48px rgba(16, 19, 25, .18), 0 0 0 .5px rgba(16, 19, 25, .1); transform-origin: top right; animation: popIn .18s var(--ease) both; }
    .dd-menu[hidden] { display: none; }
    .dd-item { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px 0 8px; border-radius: 8px; color: var(--fg-950); white-space: nowrap; cursor: pointer; outline: none; user-select: none; }
    .dd-item svg { flex: none; visibility: hidden; color: var(--pr-600); }
    .dd-item[aria-selected="true"] { font-weight: var(--fw-m); }
    .dd-item[aria-selected="true"] svg { visibility: visible; }
    .dd-item:hover, .dd-item:focus-visible { background: rgba(120, 124, 135, .12); }
    .result-count { padding: 10px 20px 0; font-size: var(--fs-cap); color: var(--fg-400); }
    .table-wrap { overflow-x: auto; }
    .tbl { width: 100%; min-width: calc(var(--cols, 5) * 150px); table-layout: fixed; border-collapse: collapse; text-align: left; }      /* 칸 폭을 모두 같게 (11/17): 내용 길이에 따라 칸이 들쭉날쭉하고 기사 관리의 두 표가 서로 안 맞던 것을 고정 배분으로. 좁아지면 칸당 150px 아래로는 안 줄고 옆으로 스크롤 */
    #view-hazards .tbl { --cols: 6; }
    #view-drivers .tbl { --cols: 5; }
    .tbl th { padding: 10px 12px; font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-500); white-space: nowrap; }          /* 애플 표 머리: 대문자 · 넓은 자간 없이 옅은 회색 */
    .tbl td { padding: 12px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
    .tbl tbody td { height: 52px; padding-top: 0; padding-bottom: 0; }      /* 졸음 경고 · 기사 관리 표의 줄 높이를 모두 52px 로 (11/17) */
    .tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
    .tbl th:last-child, .tbl td:last-child { padding-right: 20px; }
    .tbl th.end, .tbl td.end { text-align: right; }                 /* 맨 오른쪽 칸 = 상태 배지 */
    .tbl tbody tr { border-top: .5px solid var(--sep); transition: background .15s; }
    .tbl tbody tr:hover, .tbl tbody tr:focus-within { background: rgba(120, 124, 135, .07); }
    .tbl tbody tr.alert td:first-child { position: relative; }
    .tbl tbody tr.alert td:first-child::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--rd-500); }      /* 처리 안 된 긴급: 왼쪽 빨간 막대 (줄 높이를 꽉 채움) */
    .tbl td.dim { color: var(--fg-700); font-variant-numeric: tabular-nums; }
    .tbl td.loc { min-width: 180px; color: var(--fg-800); }
    .tbl .sub { display: block; margin-top: 2px; font-size: var(--fs-cap); color: var(--fg-400); font-variant-numeric: tabular-nums; }
    .tbl .empty-row td { padding: 48px; text-align: center; color: var(--fg-400); }
    tr.row-link { cursor: pointer; }
    a.row-id { font-weight: var(--fw-m); color: var(--fg-950); text-decoration: none; }
    a.row-id:hover, tr.row-link:focus-within a.row-id { text-decoration: underline; }
    .nowrap { white-space: nowrap; }
    .unset { color: var(--fg-400); }

    /* ── 배지 · 상태 글자 ── */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); font-size: var(--fs-cap); font-weight: var(--fw-m); white-space: nowrap; }
    .badge .bd { width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; }
    .badge.s0 { background: var(--ok-50); color: var(--ok-800); } .badge.s0 .bd { background: var(--ok-500); }
    .badge.s1 { background: var(--st1-bg); color: var(--st1-ink); } .badge.s1 .bd { background: var(--st1); }
    .badge.s2 { background: var(--st2-bg); color: var(--st2-ink); } .badge.s2 .bd { background: var(--st2); }
    .badge.s3 { background: var(--rd-50); color: var(--rd-700); } .badge.s3 .bd { background: var(--rd-500); }
    .badge.gray { background: var(--bg-100); color: var(--fg-600); } .badge.gray .bd { background: var(--fg-400); }
    .badge.wake-ok { background: var(--ok-50); color: var(--ok-800); }       /* 3단계 [깨어 있어요] 응답 */
    .badge.wake-no { background: var(--rd-500); color: #fff; }
    .st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-cap); font-weight: var(--fw-m); white-space: nowrap; }
    .st-urgent { color: var(--rd-600); } .st-wait { color: var(--pr-500); } .st-ok { color: var(--ok-700); } .st-info { color: var(--pr-600); }
    .tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: var(--r-pill); font-size: var(--fs-cap); font-weight: var(--fw-m); vertical-align: middle; }
    .tag.noreply { background: var(--rd-50); color: var(--rd-700); }

    /* ── 상세 패널(드로어): 오른쪽에서 밀려 나옴. 뒤 화면은 살짝 어둡게 ── */
    /* 상세는 옆 패널이 아니라 화면 가운데에 뜨는 창(center peek): 뒤 화면은 어둡게 흐려지고, 창은 살짝 커지며 나타났다가 닫을 때 작아지며 사라짐 */
    .drawer { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .drawer[hidden] { display: none; }
    .drawer-scrim { position: absolute; inset: 0; border: 0; background: rgba(16, 19, 25, .4); animation: fadeIn .35s ease-out both; }      /* 뒤 흐림(blur)은 뺌: 화면 가장자리에 밝은 테두리가 생기는 원인이었음 */
    .sheet { position: relative; width: 100%; max-width: 720px; height: min(90vh, 860px); max-height: min(90vh, 900px); display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; background: var(--bg-50); box-shadow: 0 30px 80px rgba(0, 0, 0, .28), 0 0 0 .5px rgba(0, 0, 0, .08); animation: sheetIn .42s var(--ease) both; }
    .drawer-scrim, .drawer-scrim:focus, .drawer-scrim:focus-visible { outline: none; -webkit-tap-highlight-color: transparent; }     /* 바깥을 눌렀을 때 화면 가장자리에 테두리(포커스 링)가 생기지 않게 */
    .drawer.leaving .drawer-scrim { animation: fadeOut .25s ease-in both; }
    .drawer.leaving .sheet { animation: sheetOut .25s var(--ease) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes sheetIn { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes sheetOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(8px) scale(.97); } }
    .sheet-photo { padding: 20px 24px 0; }
    .sheet-photo .photo { aspect-ratio: 16 / 9; border-radius: var(--r-block); }
    .sheet-photo .photo.empty { flex-direction: column; gap: 8px; color: var(--fg-400); }
    .sheet-photo .cap { text-align: center; }
    .sheet-photo .cap { margin-top: 8px; font-size: var(--fs-cap); color: var(--fg-400); }
    #sheetBody { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .sheet-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--bg-300) transparent; }      /* 스크롤은 머리와 아래 버튼 사이 몸통에만 */
    .sheet-head { position: relative; flex: none; padding: 28px 64px 18px; border-bottom: .5px solid var(--sep); background: var(--bg-50); }
    .sheet-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: var(--fs-headline); font-weight: var(--fw-sb); letter-spacing: var(--ls-headline); line-height: 1; }
    .sheet-title:focus { outline: none; }
    .sheet-title:focus-visible { outline: 2px solid var(--pr-400); outline-offset: 4px; border-radius: 6px; }
    .who-dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; vertical-align: 2px; background: var(--c); box-shadow: 0 0 0 3px var(--cs); }
    .who-dot.s0 { --c: var(--ok-500); --cs: rgba(46, 158, 91, .18); } .who-dot.s1 { --c: var(--st1); --cs: rgba(242, 176, 30, .22); }
    .who-dot.s2 { --c: var(--st2); --cs: rgba(242, 140, 40, .22); } .who-dot.s3 { --c: var(--rd-500); --cs: rgba(217, 48, 37, .2); }
    .who-dot.off { --c: var(--fg-300); --cs: rgba(138, 144, 165, .2); }
    .who-cell { display: inline-flex; align-items: center; }      /* 표에서 점 + 이름을 가운데 맞춤으로 나란히 */
    .tbl .who-dot, .sd-row > .who-dot { width: 6px; height: 6px; box-shadow: none; vertical-align: middle; position: relative; top: -1px; }      /* top -1px: 한글 글자 가운데에 맞추려고 (측정 0.75px 아래로 어긋났음) */      /* 목록(표 · 펼침 목록)의 이름 앞 점: '긴급 경고' 옆 점(.ping 6px)과 같은 크기, 바깥 고리 없음 (11/17). 상세 창 이름 앞 점은 그대로 */
    .sheet-suffix { margin-left: 4px; font-size: var(--fs-cap); font-weight: var(--fw-r); letter-spacing: 0; color: var(--fg-400); }
    .sheet-head-end { display: flex; align-items: center; gap: 8px; flex: none; }
    .sheet-sub { margin-top: 6px; text-align: center; font-size: var(--fs-cap); color: var(--fg-400); font-variant-numeric: tabular-nums; }
    .sheet-badge { margin-bottom: 10px; text-align: center; }
    .sheet-close { position: absolute; top: 14px; right: 14px; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--bg-50); color: var(--fg-500); transition: background .15s; }      /* 창 모서리(둥근 28px)와 같은 중심에 오도록 모서리에서 14px, 배경은 창과 같은 흰색 */
    .sheet-close:hover { background: var(--bg-100); color: var(--fg-700); }
    /* 정보 목록: 회색 상자를 쌓지 않고, [이름 ········ 값] 한 줄씩 가는 선 하나로 나눈 깔끔한 목록 (상자 · 배경 없음) */
    .kv-list { padding: 6px 24px 10px; }      /* 다른 칸(.sheet-sec · 사진)과 왼쪽 선을 맞춤 */
    /* 경고 상세 정보 (11/16): 큰 시각 + 종류 알약, 그 아래 선으로 나눈 위치 · 연락처 */
    .info-top { padding: 20px 0 8px; }
    .info-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .info-when { display: flex; align-items: baseline; gap: 8px; }
    .info-when b { font-size: var(--fs-title); font-weight: var(--fw-sb); letter-spacing: -.035em; line-height: 1; color: var(--fg-950); font-variant-numeric: tabular-nums; }
    .info-when span { font-size: var(--fs-body); color: var(--fg-500); }
    /* 기사 상세의 월 달력 + 고른 날의 경고 목록 (11/16) */
    .cal { padding-top: 20px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-title { font-size: var(--fs-sub); font-weight: var(--fw-sb); letter-spacing: var(--ls-sub); color: var(--fg-950); }
    .cal-title small { margin-left: 8px; font-size: var(--fs-cap); font-weight: var(--fw-r); letter-spacing: 0; color: var(--fg-500); }
    .cal-nav { display: flex; gap: 2px; margin-right: -8px; }
    .cal-nav button { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: var(--fg-500); transition: background .15s; }
    .cal-nav button:hover:not(:disabled) { background: var(--bg-100); color: var(--fg-950); }
    .cal-nav button:disabled { opacity: .3; cursor: default; }
    .cal-nav .prev svg { transform: rotate(180deg); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px; border-radius: var(--r-block); background: var(--bg-50); text-align: center; }      /* 바탕 흰색 (11/18 사용자 요청: 기사 상세 · 졸음 경고 달력 모두). 전에는 F안(11/17) 연한 회색 바탕 위에 누른 날만 흰 카드 */
    .cal-wd { padding: 4px 0 6px; font-size: var(--fs-cap); color: var(--fg-400); }
    .cal-day { position: relative; height: 44px; border: 0; border-radius: calc(var(--r-block) - 4px); background: none; font: inherit; font-size: var(--fs-body); color: var(--fg-950); font-variant-numeric: tabular-nums; cursor: pointer; transition: background .15s, color .15s; }
    .cal-day:hover:not(.sel):not(:disabled) { background: rgba(120, 124, 135, .12); }
    .cal-day:disabled { color: var(--fg-300); cursor: default; }
    .cal-day.today:not(.sel) { color: var(--pr-600); font-weight: var(--fw-sb); }
    .cal-day.sel { background: var(--bg-50); color: var(--pr-700); font-weight: var(--fw-sb); box-shadow: 0 1px 3px rgba(16, 19, 25, .14), 0 0 0 .5px rgba(16, 19, 25, .05); }
    .cal-dots { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 3px; }
    .cal-dots i { width: 5px; height: 5px; border-radius: 50%; }
    .cal.list-only { padding-top: 4px; }
    /* 졸음 경고 맨 위 날짜별 달력 (11/17): 위 기사 상세 달력과 같은 모양, 날짜를 누르면 아래 표가 그날 경고만 보임 */
    .hz-top { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 24px; align-items: stretch; }      /* 달력은 460px 그대로 두고 오른쪽 빈 자리에 요약 카드 (11/17) */
    @media (max-width: 960px) { .hz-top { grid-template-columns: minmax(0, 1fr); } }
    .hz-cal { padding: 20px 24px 22px; }      /* 가로 460px(위 grid), 기사 상세 달력과 같은 칸 · 점 크기 */
    .hz-sum { display: flex; flex-direction: column; padding: 20px 28px 24px; }
    .hz-sum .cal-head { margin-bottom: 0; min-height: 32px; }      /* 오른쪽 '지난달보다' 알약이 있든 없든 머리 높이가 같게 (있을 때만 카드가 3~4px 커지던 것 막음) */
    /* 도넛 + 범례 (11/17, A안): 통계 화면의 도넛(.donut-fig · .legend)과 같은 모양을 카드 가운데에 크게 */
    .hz-sum-body { flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px 64px; padding-top: 4px; }
    .hz-sum-body .donut-fig, .hz-sum-body .donut-fig svg { width: 172px; height: 172px; margin: 0; }
    .hz-sum-body .donut-fig { flex: none; }
    /* 글자는 홈 맨 위 4칸과 같은 규칙 (11/17): 이름 12px · 500 · 옅은 회색 / 큰 숫자 34px · 700 · 단위는 작은 12px / 목록 글자 13px · 500 */
    .hz-sum .donut-center .stat-value { margin-top: 0; font-size: var(--fs-display); color: var(--fg-950); }
    .hz-sum .donut-center .stat-value > span { margin: 0; font-size: inherit; color: inherit; }      /* 숫자를 감싼 안쪽 span 이 위의 '.donut-center span'(12px · 회색) 에 걸려 작아졌던 것 막음 */      /* 가운데는 큰 숫자 + 작은 '건' 만 (위의 '경고' 글자는 뺌, 11/17) */
    .hz-sum-body { gap: 24px 32px; }      /* 스크롤바 자리를 비워 두면서 카드가 10px 좁아져도(1500px 화면 기준 694px) 도넛과 타일이 한 줄에 들어가게 40 → 32px */
    #driverPanel > .card-head:first-child { border-bottom: 0; padding-bottom: 4px; }      /* 제목 줄과 탭 줄 사이 선은 뺌 */
    .hz-tiles { flex: 0 1 auto; max-width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }      /* 타일은 좁게(136px) 도넛 가까이에 모음 (11/17: 가로로 길게 퍼지던 것을 줄임) */
    .hz-tile { flex: none; width: 136px; display: flex; flex-direction: column; gap: 4px; padding: 13px 12px 12px; border-radius: 16px; }
    .hz-delta { flex: none; padding: 4px 10px; border-radius: var(--r-pill); font-size: var(--fs-cap); font-weight: var(--fw-m); white-space: nowrap; }
    .hz-delta.up { background: var(--rd-50); color: var(--rd-700); }
    .hz-delta.down { background: var(--ok-50); color: var(--ok-800); }
    .hz-delta.same { background: var(--bg-100); color: var(--fg-700); }
    /* B안 (11/18 사용자 요청): 세 칸 모두 같은 연회색 · 검정 숫자, 단계는 아이콘(눈 · 커피 · 경고)으로 구분하고 색은 아이콘에만. 전에는 칸마다 단계 색 바탕 + 단계 색 글자라 알록달록했음 */
    .hz-tiles { gap: 10px 0; }      /* 11/18: 칸 사이 틈 없이 세로선으로만 구분 */
    .hz-tile { width: auto; min-width: 120px; padding: 4px 24px; border-radius: 0; background: none; color: var(--fg-950); }      /* 11/18 사용자 요청: 박스(바탕 · 그림자) 없이 칸 사이를 '|' 세로선으로 구분 */
    .hz-tile + .hz-tile { border-left: 1px solid var(--sep); }
    .hz-tile .ic { display: flex; margin-bottom: 4px; }
    .hz-tile.s1 .ic { color: var(--st1); }
    .hz-tile.s2 .ic { color: var(--st2); }
    .hz-tile.s3 .ic { color: var(--rd-500); }
    .hz-tile .t { font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-500); white-space: nowrap; }
    .hz-tile .v { display: flex; align-items: baseline; gap: 2px; margin-top: 6px; font-size: var(--fs-headline); font-weight: 700; letter-spacing: var(--ls-headline); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .hz-tile .v small { font-size: var(--fs-cap); font-weight: var(--fw-m); letter-spacing: 0; }
    .hz-tile .p { font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-500); font-variant-numeric: tabular-nums; }
    .hz-cal .cal-head { min-height: 32px; }
    .hz-clear { margin-right: 8px; padding: 5px 12px; border: 0; border-radius: var(--r-pill); background: var(--bg-100); color: var(--fg-700); font: inherit; font-size: var(--fs-cap); font-weight: var(--fw-m); cursor: pointer; transition: background .15s; }
    .hz-clear:hover { background: rgba(120, 124, 135, .16); }
    .hz-tools { display: flex; align-items: center; }
    .day-list { list-style: none; }
    @keyframes dayIn { from { opacity: 0; } to { opacity: 1; } }
    .day-anim { animation: dayIn .45s var(--ease) both; }      /* 날을 옮기면 그날 경고 내역이 줄마다 조금씩 늦게 서서히 나타남 (11/17) */
    @keyframes selIn { from { opacity: .45; } to { opacity: 1; } }      /* 크기는 줄이지 않고 투명도만 (11/17: 전에는 90%로 줄었다 커졌음) */
    .cal-day.sel-in { animation: selIn .35s var(--ease) both; }
    .cal-grid + .day-list { margin-top: 14px; padding-top: 0; }      /* 달력 아래 선은 뺌 (11/17: 회색 바탕이 이미 구분해 줌) */
    .cal-grid + .day-empty { margin-top: 6px; }
    .day-ev { display: grid; grid-template-columns: 44px 3px minmax(0, 1fr); gap: 12px; align-items: stretch; padding: 8px 0; color: inherit; text-decoration: none; }
    .ev-t { padding-top: 2px; text-align: right; font-size: var(--fs-cap); color: var(--fg-500); font-variant-numeric: tabular-nums; }
    .ev-bar { border-radius: 2px; background: var(--c); }
    .ev-main b { display: block; font-weight: var(--fw-m); color: var(--fg-950); }
    .ev-main small { display: block; font-size: var(--fs-cap); color: var(--fg-400); }
    .day-ev:hover .ev-main b { text-decoration: underline; }
    .day-ev.now { border-radius: 16px; background: var(--bg-100); }      /* 높이 52px 짜리 줄이라 큰 덩어리(20px)와 같게 하면 알약처럼 보여서 16px (11/17) */      /* 지금 열어 본 경고: 왼쪽 · 오른쪽 끝이 위의 카드(사진 · AI 분석 · 퀴즈)와 똑같이 (11/17: 전에는 양쪽으로 10px 튀어나왔음) */
    .cal.list-only .day-ev { padding: 8px 17px; }      /* 카드 안 글자(테두리 1px + 안쪽 16px)와 같은 위치에 시각 · 막대 · 글자가 서게. 현재 줄 · 다른 줄 모두 같게 */
    .day-ev.now .ev-main b { font-weight: var(--fw-sb); }
    .day-empty { padding: 18px 0 4px; text-align: center; color: var(--fg-400); }
    .info-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: .5px solid var(--sep); }
    .info-row:last-child { border-bottom: 0; }
    .info-row > svg { flex: none; margin-top: 2px; color: var(--fg-500); }
    .info-row b { display: block; font-weight: var(--fw-m); color: var(--fg-950); line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
    .info-row a { display: block; margin-top: 2px; color: var(--pr-600); font-weight: var(--fw-m); text-decoration: none; }
    .info-row a:hover { text-decoration: underline; }
    .info-row .copyable { margin: -2px -6px; white-space: nowrap; word-break: keep-all; }
    /* AI 분석 결과: 남색 바탕 + 흰 글씨 카드 (앱 브랜드 남색) */
    .ai-card { padding: 22px 24px 24px; border-radius: var(--r-block); background: var(--pr-700); color: #fff; }
    .ai-card h4 { margin-bottom: 16px; font-size: var(--fs-sub); font-weight: var(--fw-sb); letter-spacing: var(--ls-sub); color: #fff; }
    .ai-card .r-label { color: rgba(255, 255, 255, .62); }
    .ai-card .r-value { color: #fff; }
    .sheet-sec { padding: 0 24px 20px; }
    .sec-box { padding: 0 16px; border: 1px solid var(--bg-200); border-radius: var(--r-block); }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0 12px; border-bottom: .5px solid var(--sep); }      /* 제목 아래 선 */
    .sec-head h4 { font-size: var(--fs-body); font-weight: var(--fw-sb); }
    .sec-head small { font-size: var(--fs-cap); color: var(--fg-400); }
    .todo { padding: 12px 14px; border-radius: var(--r-md); background: var(--pr-50); }
    .todo.urgent { background: var(--rd-50); }
    .todo p:first-child { font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--pr-700); }
    .todo.urgent p:first-child { color: var(--rd-700); }
    .todo p + p { margin-top: 4px; font-weight: var(--fw-m); color: var(--fg-800); line-height: 1.55; }
    .r-grid { display: grid; gap: 14px; }
    .r-item { min-width: 0; }
    .r-label { display: block; font-size: var(--fs-cap); color: var(--fg-400); }
    .r-value { display: block; margin-top: 2px; color: var(--fg-800); line-height: 1.6; }
    .quiz-list { display: grid; }
    .quiz-list li { padding: 14px 0; }
    .quiz-list li + li { border-top: .5px solid var(--sep); }
    .q-top { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-700); }
    .q-res { padding: 3px 10px; border-radius: var(--r-pill); font-weight: var(--fw-m); } .q-res.ok { background: var(--ok-50); color: var(--ok-800); } .q-res.fail { background: var(--rd-50); color: var(--rd-700); }
    .q-line { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-weight: var(--fw-m); color: var(--fg-950); }
    .q-line + .q-line { margin-top: 4px; font-weight: var(--fw-r); color: var(--fg-700); }
    .q-line svg { margin-top: 2px; flex: none; color: var(--pr-600); }
    .q-line + .q-line svg { color: var(--fg-500); }
    .sec-note { margin-top: 8px; font-size: var(--fs-cap); color: var(--fg-400); }
    .photo { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 10; border-radius: var(--r-md); background: var(--bg-100); color: var(--fg-500); overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .stage-line { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: var(--fs-cap); color: var(--fg-500); }
    .stage-line b { font-weight: var(--fw-m); color: var(--fg-900); }
    .stage-bar { display: flex; height: 6px; border-radius: var(--r-pill); background: var(--bg-100); overflow: hidden; }
    .stage-bar i { display: block; height: 100%; }
    .stage-bar i + i { box-shadow: inset 2px 0 0 #fff; }
    .stage-bar.mini { width: 64px; height: 4px; margin-top: 6px; }
    .sb-1 { background: var(--st1); } .sb-2 { background: var(--st2); } .sb-3 { background: var(--rd-500); }
    .copyable { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin: -2px -6px; padding: 2px 6px; border: 0; border-radius: 6px; background: none; font-weight: var(--fw-m); color: var(--fg-800); text-align: left; cursor: copy; word-break: break-all; }
    .copyable svg { opacity: .45; }
    .copyable:hover { background: rgba(255, 255, 255, .7); }
    .copyable:hover svg { opacity: 1; }
    .sheet-foot { flex: none; display: flex; gap: 8px; padding: 16px 24px; border-top: .5px solid var(--sep); background: var(--bg-50); }
    .sbtn { display: inline-flex; flex: 1; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 12px; border: 1px solid var(--bg-300); border-radius: var(--r-pill); background: transparent; color: var(--fg-900); font-size: var(--fs-body); font-weight: var(--fw-m); text-decoration: none; white-space: nowrap; transition: background .15s; }
    .sbtn:hover { background: var(--bg-100); }
    .sbtn.primary { border-color: var(--pr-700); background: var(--pr-700); color: #fff; } .sbtn.primary:hover { background: var(--pr-800); }
    .sbtn.go { border-color: var(--ok-600); background: var(--ok-600); color: #fff; } .sbtn.go:hover { background: var(--ok-700); }
    .sheet-empty { padding: 24px; color: var(--fg-500); }

    /* ── 내 정보 · 입력 · 버튼 ── */
    /* 설정: 경고 · 기사 관리와 같은 흰 카드 + 같은 입력 칸 (앱 같은 목록 모양이 아니라 웹 화면과 통일) */
    .set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    @media (max-width: 1100px) { .set-grid { grid-template-columns: minmax(0, 1fr); } }
    .set-grid .card-title { margin-bottom: 20px; }
    .field { display: grid; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: var(--fs-cap); font-weight: var(--fw-m); color: var(--fg-700); }
    .field input { width: 100%; height: 40px; padding: 0 14px; border: 1px solid transparent; border-radius: var(--r-sm); background: var(--bg-100); font-size: var(--fs-body); outline: none; transition: box-shadow .25s var(--ease), border-color .2s var(--ease), background .2s var(--ease); }
    .field input:focus { background: var(--bg-50); box-shadow: 0 0 0 3.5px rgba(112, 145, 214, .26), 0 0 0 1px rgba(112, 145, 214, .95); }      /* 애플 느낌 (11/17): 로그인 화면과 같은 한 겹. 어두운 남색 대신 밝은 푸른 빛으로 가볍게 (얇은 선 + 부드러운 빛무리) */
    .field input:disabled { color: var(--fg-400); }
    .hint { font-size: var(--fs-cap); color: var(--fg-400); text-align: right; }      /* 작은 안내 글은 오른쪽에 붙임 */
    .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: auto; padding-top: 12px; }
    .form-actions .form-msg { flex: 1; min-height: 0; margin: 0; }
    .form-actions .btn { min-width: 80px; }
    .set-grid { align-items: stretch; }
    .set-grid .card { display: flex; flex-direction: column; }
    .set-grid form { display: flex; flex: 1; flex-direction: column; }
    .rules { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; }
    .rule { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-400); transition: color .2s; }
    .rule .ck { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border: 1.5px solid var(--bg-300); border-radius: 50%; color: transparent; transition: background .2s, border-color .2s, color .2s; }
    .rule.ok { color: var(--ok-700); } .rule.ok .ck { background: var(--ok-500); border-color: var(--ok-500); color: #fff; }
    .match { min-height: 16px; font-weight: var(--fw-m); } .match.err { color: var(--rd-600); } .match.ok { color: var(--ok-700); }
    .match.idle { color: var(--fg-400); font-weight: var(--fw-r); }      /* 입력 전 안내(빈칸 저장 시 삭제)는 옅게 */
    /* 설정에서 안 쳤을 때 ↔ 쳤을 때 크기가 확 바뀌지 않게 (11/17): 칸 아래 한 줄 문구는 비었을 땐 접혀 있다가 생길 때 부드럽게 펴지고, 이메일 변경 칸도 같은 방식으로 펼쳐짐 */
    .field > .hint { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .32s var(--ease), opacity .25s ease; }
    .field > .hint:has(> .match:empty) { grid-template-rows: 0fr; opacity: 0; }
    .field > .hint > .match { min-height: 0; overflow: hidden; }
    .reveal { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .4s var(--ease), opacity .3s ease; }
    .reveal.open { grid-template-rows: 1fr; opacity: 1; }
    .reveal > .reveal-in { min-height: 0; overflow: hidden; }
    .field label.with-action { display: flex; align-items: center; justify-content: space-between; }
    .link-btn { padding: 0; border: 0; background: none; color: var(--pr-600); font: inherit; font-size: var(--fs-cap); font-weight: var(--fw-m); cursor: pointer; }
    .link-btn:hover { text-decoration: underline; }
    /* 이메일 변경 패널 (11/17, 애플 설정 앱 느낌): 연한 회색 묶음 안에 [라벨 + 입력] 줄과 가는 구분선. 선택한 줄만 흰 카드로 살짝 떠오르고, 입력칸에 테두리 · 빛무리는 없음. 큰 알약 버튼은 입력이 맞을 때만 켜짐 */
    .ec-wrap { margin: 0 0 16px; }
    .ec-pad { padding-top: 10px; }
    .ec-group { padding: 4px; border-radius: var(--r-block); background: var(--bg-100); }
    .ec-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: 16px; cursor: text; transition: background .25s var(--ease), box-shadow .25s var(--ease); }
    .ec-row + .ec-row::before { content: ''; position: absolute; left: 14px; right: 14px; top: -1px; height: .5px; background: rgba(16, 19, 25, .12); transition: opacity .2s; }
    .ec-row:focus-within { background: var(--bg-50); box-shadow: 0 1px 3px rgba(16, 19, 25, .12), 0 0 0 .5px rgba(16, 19, 25, .05); }
    .ec-row:focus-within::before, .ec-row:focus-within + .ec-row::before { opacity: 0; }
    .ec-row:has(input.bad) { background: var(--rd-50); }
    .ec-lab { flex: none; width: 86px; font-size: var(--fs-body); font-weight: var(--fw-m); color: var(--fg-800); }
    .ec-row input { flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; font: inherit; font-size: var(--fs-body); color: var(--fg-950); outline: none; }
    .ec-row input::placeholder { color: var(--fg-300); }
    .ec-row input:disabled { color: var(--fg-400); }
    .ec-note { display: grid; grid-template-rows: 1fr; padding: 0 18px; font-size: var(--fs-cap); transition: grid-template-rows .32s var(--ease), opacity .25s ease; }
    .ec-note:has(> .match:empty) { grid-template-rows: 0fr; opacity: 0; }
    .ec-note > .match { min-height: 0; overflow: hidden; padding-top: 6px; }
    .ec-primary { width: 100%; height: 44px; border-radius: 999px; font-weight: var(--fw-sb); }
    .ec-primary:disabled { opacity: .4; cursor: default; }
    .ec-actions { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; margin-top: 10px; }
    .ec-link { padding: 6px 2px; border: 0; background: none; color: var(--pr-600); font: inherit; font-size: var(--fs-cap); font-weight: var(--fw-m); cursor: pointer; }
    .ec-link:disabled { color: var(--fg-300); cursor: default; }
    .ec-wrap .form-msg { min-height: 0; max-height: 0; margin: 0; overflow: hidden; opacity: 0; transition: max-height .3s var(--ease), opacity .25s ease, margin .3s var(--ease); }
    .ec-wrap .form-msg.ok, .ec-wrap .form-msg.err { max-height: 60px; margin: 10px 0 0; opacity: 1; }
    #ecCodeMatch.idle { font-variant-numeric: tabular-nums; }
    #setPhoneMatch.ok::before { content: '✓'; margin-right: 4px; }
    .field input.bad { border-color: var(--rd-400); background: var(--rd-50); }
    .field input.bad:focus { background: var(--rd-50); box-shadow: 0 0 0 4px rgba(217, 48, 37, .14), 0 0 0 1px rgba(217, 48, 37, .5); }      /* 잘못된 칸을 선택했을 때는 빛무리도 빨강 */
    .form-msg { min-height: 20px; margin: 0 0 12px; font-size: var(--fs-cap); font-weight: var(--fw-m); }
    .form-msg.err { color: var(--rd-600); }
    .form-msg.ok { color: var(--ok-700); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 16px; border: 0; border-radius: var(--r-pill); background: var(--bg-100); color: var(--fg-900); font-size: var(--fs-cap); font-weight: var(--fw-m); text-decoration: none; white-space: nowrap; transition: background .15s; }
    .btn:hover { background: var(--bg-200); }
    .btn.brand { background: var(--pr-700); color: #fff; } .btn.brand:hover { background: var(--pr-800); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.sm { height: 28px; padding: 0 12px; }
    .btn.danger { background: none; color: var(--rd-600); } .btn.danger:hover { background: var(--rd-50); }

    /* ── 알림 · 확인 창 ── */
    #toast { position: fixed; top: 68px; right: 32px; z-index: 200; max-width: min(420px, 90vw); padding: 12px 18px; border-radius: var(--r-md); background: rgba(16, 19, 25, .92); color: #fff; font-weight: var(--fw-m); line-height: 1.5; box-shadow: 0 12px 28px rgba(16, 19, 25, .22); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .25s; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { display: flex; align-items: center; gap: 12px; background: var(--rd-600); pointer-events: auto; }
    #toast.error button { flex: none; height: 28px; padding: 0 12px; border: 1px solid #fff; border-radius: var(--r-pill); background: transparent; color: #fff; font-size: var(--fs-cap); font-weight: var(--fw-m); }
    /* 확인 창: 브라우저 <dialog> (포커스 가두기 · Esc · 뒤 화면 막기를 브라우저가 해 줌). iOS 알림처럼 아래 버튼 두 개를 선으로 나눔 */
    #confirmDlg { margin: auto; width: min(380px, 92vw); padding: 0; border: 0; border-radius: var(--r-card); color: var(--fg-950); box-shadow: 0 24px 56px rgba(16, 19, 25, .28); overflow: hidden; }
    #confirmDlg::backdrop { background: rgba(16, 19, 25, .35); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    #confirmDlg h2 { padding: 24px 24px 0; font-size: var(--fs-sub); font-weight: var(--fw-sb); letter-spacing: var(--ls-sub); text-align: center; }
    #confirmDlg p { padding: 8px 24px 24px; color: var(--fg-500); text-align: center; }
    #confirmDlg form { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--bg-200); }
    #confirmDlg form button { height: 48px; border: 0; background: none; color: var(--pr-600); font-size: var(--fs-sub); }
    #confirmDlg form button:hover { background: var(--bg-100); }
    #confirmDlg form button + button { border-left: 1px solid var(--bg-200); font-weight: var(--fw-sb); }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    /* ── 좁은 화면: 사이드바는 서랍(위쪽 아이콘으로 열기) ── */
    @media (max-width: 1023px) {

    const FILTERS = [

      ['urgent', '긴급', (e) => isOpenUrgent(e)],      // 11/17 탭을 단계로 나눔: 긴급 = 3단계 (미처리만). 옛 '휴게 미준수' · '음성 응답 없음' · '위험 3단계' 탭은 뺌 (표의 종류 칸에는 그대로 보임, 조치완료된 3단계는 '전체' 에서)

    // ── 아이콘: 고정 SVG 경로만 (서버 글이 들어가지 않는다) ─────────

    //    단계별 · 종류별 그래프는 달력으로 대신함. 고른 날 · 보는 달은 10초 갱신에도 그대로 (기사가 바뀌면 오늘로)
    let calState = { uid: null, y: 0, m: 0, sel: '' };

      const minIdx = Math.min(nowIdx, isNaN(old) ? nowIdx : old.getFullYear() * 12 + old.getMonth());   // 가장 오래된 경고의 달까지만 거슬러 갈 수 있음
      const monthCount = [...byDay.entries()].filter(([k]) => k.startsWith(monthKey)).reduce((a, [, v]) => a + v.length, 0);

    // ── 기사 상세 패널: 서버 API 를 더하지 않고 이미 받은 경고 · 기사 목록으로 계산 ─────
    // 이름은 '이정자 기사님', 상태 배지는 맨 오른쪽. 연락처 · 이메일 + 월 달력(경고 있는 날에 단계 색 점) + 고른 날의 경고 목록 (11/16)

      // 경고 상세와 같은 모양 (11/16): 선으로 나눈 연락처 · 이메일. 오늘 · 누적 · 마지막 경고 숫자는 아래 달력이 보여 주므로 두지 않음

        h('div', { class: 'info-row' }, icon('car', 18), u.vehicle_no ? h('div', null, h('b', null, u.vehicle_no)) : unsetText()),      // 차량번호 (11/17): 맨 위. 없으면 '미등록'

    // 확인 창 (브라우저 기본 confirm 은 화면을 멈춰서 10초 갱신 · 긴급 알림까지 막음). 처음 포커스는 안전한 [취소]
    function askConfirm(title, body, yesLabel) {

      $('confirmTitle').textContent = title;
      $('confirmBody').textContent = body;
      $('confirmYes').textContent = yesLabel;

    // 지금 보는 화면의 제목(h1)으로 포커스 (경고 상세는 #pageTitle, 대시보드 · 목록은 화면 제목)
    function focusTitle() { const t = $('pageTitle') || document.querySelector('.view.active h1'); if (t) t.focus({ preventScroll: true }); }
    // 경고 상세 머리 · 대시보드 '지금 긴급' 영역 · 경고 표의 긴급 줄이 모두 이 함수를 쓴다 (서버: PATCH /events/{id}/status)
    async function changeStatus(e, status) {
      if (busy || $('confirmDlg').open) return;
      const who = honor(e.user_name);
      if (status === '조치완료' && !(await askConfirm('경고 조치완료',
        who + ' — ' + (e.stage === 3 ? '조치완료로 바꾸면 기사 앱의 위험 경고가 해제됩니다.' : '이 경고를 조치완료로 바꿀까요?'), '조치완료'))) return;
      closeToastError();
      busy = true;
      try {
        const res = await updateEventStatus(e.id, status);
        // 서버가 받아 줬으면 그 줄은 바로 긴급 목록에서 뺀다 (10초 갱신을 기다리지 않고). 이어서 서버 값으로 다시 맞춤
        const now = events.find((x) => x.id === e.id); if (now) now.status = status;
        renderAll(true);
        await refreshAll(true);
        focusTitle();                                     // 누른 버튼은 사라졌을 수 있어서 제목으로
        toast(status === '확인' ? '확인한 경고로 표시했어요.'
          : res.stage_reset ? who + ' ' + (stageNum(e.stage) ? stageNum(e.stage) + '단계 ' + STAGE_WORD[stageNum(e.stage)] : '경고') + ' 해제됨 · 기사 앱은 2초 안팎에 정상 화면이 돼요'
          : '조치완료로 바꿨어요.');
      } catch (err) { toastError(status + ' 실패: ' + err.message + (status === '조치완료' ? ' — 기사 앱의 경고가 풀리지 않았을 수 있어요.' : '')); }
      finally { busy = false; }
    }

    // ── 탭 (제목 아래 둥근 분할 막대에서 보고 싶은 것만 골라 봄): defs = [키, 글, 개수, 빨갛게?] ──────────
    function renderTabs(box, panelId, defs, current, onPick) {
      fill(box, ...defs.map(([key, label, count, alert]) =>
        h('button', { class: 'seg-btn', type: 'button', role: 'tab', id: panelId + '-tab-' + key, 'data-key': 'tab-' + panelId + '-' + key, 'aria-selected': String(current === key),
          'aria-controls': panelId, 'aria-label': label + ', ' + count, tabindex: current === key ? '0' : '-1', onclick: () => onPick(key) },
          label)));      // 탭 이름 뒤의 건수 숫자는 뺌 (11/17). 화면 낭독기에는 aria-label 로 숫자를 알려 줌
      $(panelId).setAttribute('aria-labelledby', panelId + '-tab-' + current);
      slideMark(box, box.querySelector('[aria-selected="true"]'), 'seg-thumb');
    }
    // 옆으로 미끄러지는 선택 표시 (탭의 흰 조각 · 홈 4칸의 파란 테두리). 화면을 다시 그려도 이전 자리를 기억해 두었다가, 거기서 새 자리까지 부드럽게 움직인다.
    // box = 표시가 들어갈 틀(position: relative, 고유 id 필요), target = 골라진 칸 (없으면 그 자리에서 서서히 사라짐)
    const markPos = new Map();
    function slideMark(box, target, cls) {
      const old = box.querySelector(':scope > .' + cls); if (old) old.remove();
      const prev = markPos.get(box.id);
      const mark = document.createElement('i');
      mark.className = cls; mark.setAttribute('aria-hidden', 'true');
      const put = (p) => { mark.style.width = p.w + 'px'; mark.style.height = p.hh + 'px'; mark.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)'; };
      if (!target) {                                              // 고른 칸이 없어짐: 있던 자리에서 서서히 사라진 뒤 지움
        markPos.delete(box.id);
        if (!prev) return;
        box.prepend(mark); mark.style.transition = 'none'; put(prev); mark.getBoundingClientRect(); mark.style.transition = ''; mark.style.opacity = '0';
        setTimeout(() => mark.remove(), 400);
        return;
      }
      if (!target.offsetWidth) return;                           // 숨겨진 화면이면 건너뜀
      const to = { x: target.offsetLeft, y: target.offsetTop, w: target.offsetWidth, hh: target.offsetHeight };
      box.prepend(mark);
      mark.style.transition = 'none';
      put(prev || to);                                            // 이전 자리에서 출발 (처음이면 제자리에서 서서히 나타남)
      if (!prev) mark.style.opacity = '0';
      mark.getBoundingClientRect();
      mark.style.transition = ''; mark.style.opacity = '';
      put(to);
      markPos.set(box.id, to);
    }

    // ── 내 정보 (오른쪽 위 프로필 메뉴에서): 이름 · 전화번호 수정 · 비밀번호 변경 ──────────────────
    let me = null;                                      // 로그인한 관리자 (GET /users/me)
    // 위쪽 막대 오른쪽의 관리자 프로필 (이름) + 누르면 열리는 메뉴(이메일 · 내 정보 · 알림음 · 로그아웃). 내 정보를 못 불러와도 [로그아웃] 은 쓸 수 있게 늘 보인다
    // 관리자 프로필 사진 (11/17): 서버에 저장 (users.photo_url · POST/GET/DELETE /users/me/photo) → 다른 브라우저에서 로그인해도 그대로 보임.
    //   예전에는 서버에 사진 칸이 없다고 보고 이 브라우저(localStorage)에만 저장했음. 서버에 칸이 생겼으니 옮김:
    //   옛 저장본(이 브라우저)이 있고 서버에 사진이 없으면 처음 한 번 서버로 올리고 옛 것은 지움. 올리기 전에 가운데를 정사각형 256px 로 줄임.
    let myPhotoUrl = '';                                // 서버에서 받은 사진의 임시 주소(blob:), 사진이 없으면 ''
    const photoKey = () => 'adminPhoto:' + ((me && me.email) || 'admin');      // 옛 저장 위치 (옮기기용으로만 읽음)
    function getMyPhoto() { return myPhotoUrl; }
    async function loadMyPhoto() {
      try {
        let url = await fetchMyPhotoUrl();
        if (!url) {
          let old = ''; try { old = localStorage.getItem(photoKey()) || ''; } catch (e) { old = ''; }
          if (old) { try { await uploadMyPhoto(await (await fetch(old)).blob()); localStorage.removeItem(photoKey()); url = await fetchMyPhotoUrl(); } catch (e) { /* 못 옮기면 다음에 다시 */ } }
        }
        if (myPhotoUrl) URL.revokeObjectURL(myPhotoUrl);
        myPhotoUrl = url || '';
      } catch (err) { /* 못 불러와도 화면은 계속: 이니셜로 보임 */ }
      renderSidebarUser();
    }
    function paintAvatar(node, name) {
      if (!node) return;
      const p = getMyPhoto();
      node.textContent = p ? '' : (name.trim().charAt(0) || '관');
      node.style.backgroundImage = p ? 'url("' + p + '")' : '';
      node.classList.toggle('has-photo', !!p);
    }
    function setMyPhotoFromFile(file) {
      if (!file || !/^image\//.test(file.type)) { toast('사진 파일을 골라 주세요.'); return; }
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);   // 가운데를 정사각형으로 잘라서
        URL.revokeObjectURL(url);
        c.toBlob(async (blob) => {
          if (!blob) { toast('사진을 처리하지 못했어요. 다른 사진을 골라 주세요.'); return; }
          try { await uploadMyPhoto(blob); await loadMyPhoto(); toast('프로필 사진을 바꿨어요.'); }
          catch (err) { toast(err.message || '사진을 올리지 못했어요.'); }
        }, 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'); };
      img.src = url;
    }
    async function clearMyPhoto() {
      try { await deleteMyPhoto(); if (myPhotoUrl) URL.revokeObjectURL(myPhotoUrl); myPhotoUrl = ''; renderSidebarUser(); toast('프로필 사진을 지웠어요.'); }
      catch (err) { toast(err.message || '사진을 지우지 못했어요.'); }
    }
    function renderSidebarUser() {
      const name = (me && me.name) || '관리자';
      paintAvatar($('profileAvatar'), name);
      paintAvatar($('setAvatar'), name);
      const del = $('setPhotoDel'); if (del) del.hidden = !getMyPhoto();
      $('profileName').textContent = name;
      $('menuName').textContent = name;
      $('menuEmail').textContent = (me && me.email) || '';
      $('profileBtn').setAttribute('aria-label', name + ' 계정 메뉴');
    }
    async function loadMe() {
      try { me = scrub(await fetchMe()); } catch (err) { /* 못 불러와도 화면은 계속 쓴다 */ }
      renderSidebarUser();
      loadMyPhoto();                                   // 서버에 저장된 내 사진을 받아 이니셜 대신 보여 줌
      if (view === 'profile' && !document.querySelector('#profilePage form input:focus')) renderProfilePage();   // 내 정보로 바로 들어왔으면 이름 · 전화번호를 채워서 다시 그림
    }
    function setMsg(node, text, isError) { node.textContent = text; node.className = 'form-msg ' + (isError ? 'err' : 'ok'); }
    // 설정 입력 칸 (라벨 위 · 입력 아래 · 작은 설명). 다른 화면과 같은 카드 안에 들어감
    function setRow(id, label, attrs, hint) {
      return h('div', { class: 'field' }, h('label', { for: id }, label), h('input', Object.assign({ id }, attrs, hint ? { 'aria-describedby': id + 'Hint' } : {})), hint ? h('span', { class: 'hint', id: id + 'Hint' }, hint) : null);
    }
    const PW_RULES = [['대문자', /[A-Z]/], ['소문자', /[a-z]/], ['숫자', /[0-9]/], ['특수문자', /[^A-Za-z0-9]/], ['8자 이상', /^[\s\S]{8,}$/]];
    const pwRulesOk = (v) => PW_RULES.every(([, re]) => re.test(v));
    function setCurError(on) {      // 지금 비밀번호 칸: 서버가 '맞지 않아요' 하면 칸 아래에 빨간 '비밀번호 불일치'
      const m = $('pwCurMatch');
      m.textContent = on ? '비밀번호 불일치' : ''; m.className = 'match' + (on ? ' err' : '');
      $('pwCur').classList.toggle('bad', on);
    }
    function updatePwChecks() {
      const nw = $('pwNew').value, nw2 = $('pwNew2').value;
      document.querySelectorAll('#pwRules .rule').forEach((el, i) => el.classList.toggle('ok', PW_RULES[i][1].test(nw)));
      const m = $('pwMatch'), bad = !!nw2 && nw !== nw2;
      m.textContent = !nw2 ? '' : bad ? '비밀번호 불일치' : '비밀번호 일치';
      m.className = 'match ' + (!nw2 ? '' : bad ? 'err' : 'ok');
      $('pwNew2').classList.toggle('bad', bad);
    }
    // 프로필 입력 검사 (11/17): 이름은 비면 빨강 '이름을 입력해 주세요', 전화번호는 숫자 9~11자리면 초록 '사용할 수 있는 번호예요' · 아니면 빨강 · 비우면 원래 안내('빈칸 저장 시 삭제').
    //   typed = 사용자가 쓰는 중일 때만 true. 처음 그릴 때는 이미 저장된 값에 초록 문구를 띄우지 않고 안내만 보여 줌.
    const phoneDigitsOk = (v) => { const d = digitsOf(v); return d.length >= 9 && d.length <= 11; };
    function updateProfileChecks(typed) {
      const nameEl = $('setName'), phoneEl = $('setPhone'), nm = $('setNameMatch'), pm = $('setPhoneMatch');
      if (!nameEl || !phoneEl || !nm || !pm) return;
      const name = nameEl.value.trim(), phone = phoneEl.value.trim();
      const badName = typed && !name;
      nm.textContent = badName ? '이름을 입력해 주세요' : ''; nm.className = 'match' + (badName ? ' err' : '');
      nameEl.classList.toggle('bad', badName);
      const badPhone = !!phone && !phoneDigitsOk(phone);
      if (!phone) { pm.textContent = '빈칸 저장 시 삭제'; pm.className = 'match idle'; }
      else if (badPhone) { pm.textContent = '숫자 9~11자리로 입력해 주세요'; pm.className = 'match err'; }
      else if (typed) { pm.textContent = '사용할 수 있는 번호예요'; pm.className = 'match ok'; }
      else { pm.textContent = '빈칸 저장 시 삭제'; pm.className = 'match idle'; }
