<!--
═══════════════════════════════════════════════════════════════
static/admin.html — 관리자 웹 (대시보드 · 졸음 경고 · 기사 관리)
담당: D   |   우선: P0
수업 원본: road_hazard_api/static/admin.html (🟡 수정)
화면 모양: 「관리자 (2).html」 확정본 (사이드바 · 통계 카드 · 차트 · 경고 표) — 상세는 모달이 아니라 주소가 있는 페이지(11/05 변경)

[이 파일이 하는 일]
  - 대시보드: 오늘 전체 경고(어제와 비교) · 긴급(조치 필요: 3단계 + 음성 응답 없음, 미처리) · 등록된 기사(조치 필요 · 확인 필요 · 이상 없음 수) · 휴게 미준수(오늘) 카드 (누르면 목록으로)
    → 지금 처리할 일(긴급 먼저 · 미확인, 5건) → 이번 주 졸음 경고가 많은 기사 TOP 3 · 전화번호가 없는 기사 → 단계별 경고 · 시간대별 졸음 차트 (서버 /admin/stats/*)
    (모두 이미 받은 경고 · 기사 목록으로 계산. '조치까지 걸린 시간' 은 경고에 조치 시각 칸이 없어서 못 넣음)
  - 호칭: 글 속의 기사는 '이정자 기사님' (이름 + 기사님). 이름이 없으면 '기사님'. AI 글의 '기사에게 · 기사의' 도 이름으로 바꿔 보여 줌
  - 긴급 알림: 새 3단계 · "음성 응답 없음"이 생기면 빨간 배너 + 알림음(삐 3번) + 탭 제목 깜빡임. [알림음 켜짐] 버튼으로 끌 수 있음
    (브라우저는 화면을 한 번 누르기 전에는 소리를 막아서, 그때는 배너에 안내가 나옴)
  - 졸음 경고: 제목 바로 아래 탭(전체 · 미확인 · 긴급 · 3단계 · 휴게 미준수 · 음성 응답 없음, 탭마다 건수) + 표. 좌우 화살표로 탭 이동
    · 3단계 / "음성 응답 없음"(reason no_response) 미처리 줄은 연한 빨강으로 표시
    · 검색칸: 기사 이름 · 주소 · 종류 · 번호. 줄을 누르면 상세로 (번호는 진짜 링크라 새 탭으로도 열림). 따로 [상세 보기] 버튼은 두지 않음 (11/09)
    · 경고 상세 페이지 #event/번호 — 왼쪽: 지금 할 일 → AI 분석 결과(무슨 일 · 왜 이 단계 · 법규 · 안내 · 퀴즈 · 휴식 기록), 오른쪽: 사진 · 위치 · 기사 연락처
      (눈 측정값 · 좌표 숫자는 보여 주지 않음. LLM · RAG · Agent 같은 용어는 쓰지 않고 시험용 모의 값이 섞였을 때만 안내)
    · 상세를 열면 미확인 → 확인 으로 자동으로 바뀜 (화면이 보일 때만. 서버는 '확인'을 미확인일 때만 받음 → 조치완료를 되돌리지 않음, 11/09)
    · 머리의 [조치완료] → PATCH /events/{id}/status → 3단계 해제 (페이지에 그대로 머묾)
  - 기사 관리: 탭(전체 · 조치 필요 · 확인 필요 · 이상 없음 · 전화번호 미등록, 건수 표시) + 표(이름 · 차량번호 · 전화번호 · 상태 · 오늘 경고 · 누적 경고(단계 색 막대) · 마지막 경고) + 검색
    · [기사 추가] (11/09): 창에서 이름 · 이메일 · 전화번호 · 차량번호(선택) · 개인정보 동의 확인 → POST /admin/users
      → 같은 창에 로그인 정보 + 임시 비밀번호(서버가 만듦, 이때 한 번만 보임, 누르면 복사)
    · 기사 상세 페이지 #driver/번호 — 경고 현황(오늘 · 누적 · 조치 필요 + 1 · 2 · 3단계 색 칸) · 최근 경고 10건(줄을 누르면 경고 상세로), 오른쪽에 연락처. 서버 API 추가 없이 이미 받은 경고 · 기사 목록으로 계산
  - 내 정보 #profile: 왼쪽 아래 프로필(이름 · 이메일)을 누르면 열림 (따로 '설정' 메뉴 없음, 옛 주소 #settings 도 여기로, 11/09)
    이름 · 전화번호 수정(이메일은 고정) → PATCH /users/me · 비밀번호 변경 → PUT /users/me/password(지금 비밀번호 확인, 가입과 같은 규칙)
    알림음 켜고 끄기는 위쪽 [알림음] 버튼 하나로. 새로고침은 10초 자동 갱신 + 브라우저 새로고침으로 충분해서 버튼을 두지 않음 (끊겼을 때만 배너에 [다시 시도])
    로고는 img/logo.png (팀 확정 올빼미), 탭 아이콘 img/favicon.png
  - AI 처리 표시: 보고서의 report.is_real(llm · rag · agent)로 '모의'로 대체된 단계가 있으면 카드 아래에 한 줄로 알려 줌

[기사 연락 (전화번호 · 차량번호)]
  - 팀장 결정(10/29)으로 users 에 phone · vehicle_no 추가 → 기사가 앱 '내 정보'에서 직접 적음. 안 적었으면 '미등록'
  - 연락처 칸(경고 상세 · 기사 상세 오른쪽): 번호 · 이메일을 바로 보여 주고, 번호 · 이메일을 누르면 복사 (11/09). 아래에 [전화 걸기](tel:) · [문자](sms:) (번호가 없으면 [이메일 보내기])

[확정본과 다른 점 — 서버(DB)에 없는 값은 만들지 않았다]
  - '운행 중 기사' 카드는 '등록된 기사'로, 기사 상태는 경고 처리 상황으로 계산 (운행 중 여부는 서버 메모리라 API 가 없음)
  - 카카오맵 자리는 도로명 주소 글자로 (지도 API 연결 전). 좌표 숫자는 보여 주지 않음
  - 차트는 Chart.js(외부 CDN) 대신 SVG · CSS 로 직접 그림 (인터넷 없이도 시연되게)

[접근성 · 가독성 약속]
  - 글자 14px 이상, 색 대비 4.5:1 이상 (노랑 · 주황 바탕은 어두운 글자, 초록 · 빨강 바탕만 흰 글자 + 진한 색)
  - 색만으로 구분하지 않음: 단계는 아이콘 + 글자, 상태는 글자
  - 페이지가 바뀌면 제목(h1)으로 포커스 이동, 목록 · 상세는 진짜 링크(키보드 Enter · 새 탭 · 뒤로 가기)
  - 10초마다 새로 불러와도 바뀐 게 없으면 다시 그리지 않고, 그릴 때도 포커스 유지. 알림은 aria-live
  - 서버가 끊기면 빨간 배너 + 몇 초 전 데이터인지 + 탭 제목 표시 (옛 목록을 최신처럼 보이지 않게). 일부만 실패하면 주황 배너
  - 오류 알림은 사라지지 않고 닫을 때까지 남음 (조치완료 실패를 놓치지 않게, Esc 로도 닫힘)
  - 주소를 못 찾으면 좌표와 지도 링크를 보여 줌 (긴급 때 기사 위치를 잃지 않게)
  - 주소 # (dashboard · hazards · drivers · profile · event/번호 · driver/번호) 로 화면을 기억해 뒤로 가기가 됨

[주의]
  - 서버가 보낸 글(LLM 요약 · 보고서 · 이름)은 항상 textContent 로만 넣는다 (innerHTML 금지)
  - 글자가 화면에 그려지는 곳은 모두 h() 를 거치고, h() 가 'null' · 'None' 같은 값 없음 글자를 지운다 (clean)
  - 아이콘(SVG)은 아래 ICONS 의 고정 값만 쓴다

-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>졸음 가드 관리자</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --brand: #1E40AF; --brand-dark: #1E3A8A; --brand-light: #DBEAFE;
      --bg: #F8FAFC; --surface: #FFFFFF; --text-main: #1E293B; --text-sub: #55617A; --border: #E2E8F0;
      --control-border: #64748B;   /* 버튼 · 입력 칸 테두리 (바탕과 3:1 이상, --border 는 장식용 선) */
      /* 단계 색 (확정본 값). 흰 글자를 올릴 때는 -solid 를, 글자색으로는 -text 를 쓴다 (모두 4.5:1 이상) */
      --stage-0: #1D9E75; --stage-0-solid: #0F7B5A;
      --stage-1: #E8AE1E; --stage-2: #EF7D27;
      --stage-3: #E24B4A; --stage-3-solid: #C62828; --stage-3-text: #B3261E;
      --alert-bg: #FEF2F2; --alert-border: #FCA5A5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    svg { display: block; flex: none; }
    button { font-family: inherit; font-size: inherit; color: inherit; }
    :focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
    body { word-break: keep-all; overflow-wrap: anywhere; }   /* 한글 낱말 중간에서 줄이 바뀌지 않게 */
    body { display: flex; height: 100vh; height: 100dvh; background: var(--bg); color: var(--text-main); overflow: hidden; font-size: 16px; line-height: 1.5; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: 12px; top: -60px; background: #fff; color: var(--brand); padding: 10px 16px; border-radius: 8px; font-weight: 800; z-index: 300; }
    .skip:focus { top: 12px; }

    /* ── 사이드바 ── */
    .sidebar { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 18px 22px; font-size: 18px; font-weight: 800; color: var(--brand); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .menu { flex: 1; padding: 16px 0; }
    .menu-item { width: 100%; border: none; background: none; text-align: left; padding: 10px 22px; min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; color: var(--text-sub); cursor: pointer; border-right: 4px solid transparent; text-decoration: none; }
    .menu-item:hover, .menu-item[aria-current="page"] { background: var(--brand-light); color: var(--brand); font-weight: 700; border-right-color: var(--brand); }
    .menu-badge { margin-left: auto; background: var(--stage-3-solid); color: #fff; font-size: 14px; font-weight: 700; min-width: 24px; height: 24px; border-radius: 12px; display: none; align-items: center; justify-content: center; padding: 0 7px; }
    .brand-logo { width: 34px; height: 34px; flex: none; }
    /* 왼쪽 아래 프로필: 누르면 내 정보(#profile) */
    .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 12px 16px 12px 22px; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.4; min-width: 0; color: inherit; text-decoration: none; border-right: 4px solid transparent; }
    .sidebar-user[hidden] { display: none; }
    .sidebar-user:hover, .sidebar-user[aria-current="page"] { background: var(--brand-light); }
    .sidebar-user[aria-current="page"] { border-right-color: var(--brand); }
    .sidebar-user .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-light); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
    .sidebar-user:hover .avatar, .sidebar-user[aria-current="page"] .avatar { background: var(--brand); color: #fff; }
    .sidebar-user .who { display: grid; min-width: 0; flex: 1; }
    .sidebar-user b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-user small { color: var(--text-sub); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-user .chev { font-size: 20px; }
    .sidebar-footer { width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--border); padding: 12px 22px; min-height: 48px; cursor: pointer; color: var(--text-sub); font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 12px; }
    .sidebar-footer:hover { color: var(--text-main); background: var(--bg); }

    /* ── 본문 ── */
    .main-content { flex: 1; overflow-y: auto; padding: 28px 40px 48px; min-width: 0; }
    .main-content:focus { outline: none; }
    .topbar { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 14px; color: var(--text-sub); }
    .topbar button { white-space: nowrap; border: 1px solid var(--control-border); background: var(--surface); border-radius: 8px; min-height: 34px; padding: 0 14px; font-weight: 700; color: var(--text-sub); cursor: pointer; }
    .topbar button:hover { border-color: var(--brand); color: var(--brand); }
    /* 긴급 알림 배너: 새 3단계 · 음성 응답 없음이 생기면 위에 붙어서 보인다 */
    .urgent-banner { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--stage-3-solid); color: #fff; padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; font-size: 15px; font-weight: 700; box-shadow: 0 4px 14px rgba(198,40,40,.35); }
    .urgent-banner[hidden] { display: none; }
    .banners { position: sticky; top: 0; z-index: 60; }            /* 긴급 · 연결 배너가 겹치지 않게 함께 붙음 */
    .banners .urgent-banner { position: static; }
    .urgent-banner.warn { background: #8A4500; }
    .urgent-banner .ub-text { flex: 1 1 240px; line-height: 1.5; }
    .urgent-banner .ub-text small { display: block; font-weight: 500; opacity: .92; }
    .urgent-banner button { min-height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid #fff; background: transparent; color: #fff; font-weight: 700; cursor: pointer; }
    .urgent-banner button.primary { background: #fff; color: var(--stage-3-text); }
    .urgent-banner button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .view { display: none; max-width: 1320px; margin: 0 auto; }
    .view.active { display: block; }
    .page-title { font-size: 24px; font-weight: 800; margin-bottom: 18px; }
    .page-title:focus { outline: none; }
    .page-title:focus-visible { outline: 3px solid #2563EB; outline-offset: 4px; }

    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); padding: 16px 20px; border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; text-align: left; cursor: pointer; text-decoration: none; color: inherit; transition: border-color .15s; }
    .stat-card:hover { border-color: var(--brand); }
    .stat-card.alert { background: var(--alert-bg); border-color: var(--alert-border); }
    .stat-card.alert .stat-title, .stat-card.alert .stat-value { color: var(--stage-3-text); }
    .stat-title { font-size: 15px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .stat-sub { margin-top: 4px; font-size: 14px; color: var(--text-sub); }
    .stat-card.alert .stat-sub { color: var(--stage-3-text); }
    .dash-block { margin-bottom: 16px; }
    .dash-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .todo-list { display: grid; margin-top: 10px; }
    .todo-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--border); color: inherit; text-decoration: none; }
    .todo-row:hover { background: #F1F5F9; }
    .todo-row.urgent { background: var(--alert-bg); box-shadow: inset 5px 0 0 var(--stage-3); }
    .todo-main { display: grid; min-width: 0; line-height: 1.4; }
    .todo-main span { font-size: 14px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .todo-time { font-size: 14px; color: var(--text-sub); white-space: nowrap; }
    .chev { font-size: 22px; color: #94A3B8; }
    .empty-note { color: var(--text-sub); font-size: 15px; padding: 4px 0 8px; }
    .card.flush .empty-note { padding: 14px 20px 20px; }
    .rank-list { list-style: none; display: grid; gap: 12px; }
    .rank-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr) 90px auto; align-items: center; gap: 12px; font-size: 15px; }
    .rank-list a, .name-list a { color: var(--brand); font-weight: 700; text-decoration: none; }
    .rank-list a:hover, .name-list a:hover { text-decoration: underline; }
    .rank-no { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-light); color: var(--brand); font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
    .rank-bar { height: 8px; border-radius: 4px; background: #E2E8F0; overflow: hidden; }
    .rank-bar i { display: block; height: 100%; background: var(--stage-2); border-radius: 4px; }
    .name-list { list-style: none; display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 10px; font-size: 15px; }
    .stat-value { font-size: 30px; font-weight: 800; line-height: 1.2; }
    .stat-value small { font-size: 17px; font-weight: 500; color: var(--text-sub); margin-left: 2px; }
    .stat-card.alert .stat-value small { color: var(--stage-3-text); }

    .chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-card { background: var(--surface); padding: 20px 22px; border-radius: 10px; border: 1px solid var(--border); }
    .chart-card h3 { font-size: 17px; margin-bottom: 4px; }
    .chart-card .hint { font-size: 14px; color: var(--text-sub); margin-bottom: 14px; }
    .bars { display: flex; align-items: flex-end; justify-content: space-around; gap: 14px; height: 200px; padding: 22px 8px 0; border-bottom: 2px solid var(--border); }
    .bcol { flex: 1; max-width: 90px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .bcol .v { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .bcol .b { width: 100%; border-radius: 8px 8px 0 0; min-height: 4px; }
    .blabels { display: flex; justify-content: space-around; gap: 14px; padding: 8px 8px 0; font-size: 14px; font-weight: 700; color: var(--text-sub); text-align: center; }
    .blabels span { flex: 1; max-width: 90px; }
    .linechart { width: 100%; height: auto; }
    .linechart text { font-size: 14px; fill: var(--text-sub); font-family: inherit; }
    .linechart .val { font-size: 14px; font-weight: 800; fill: var(--text-main); }

    /* ── 표 ── */
    .table-section { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
    /* 탭: 제목 바로 아래에서 보고 싶은 것만 골라 봄 */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; overflow-y: hidden; padding-bottom: 1px; }
    .tab { background: none; border: none; padding: 10px 14px; font-size: 15px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
    .tab:hover { color: var(--brand); }
    .tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 800; }
    .tab-count { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: #E2E8F0; color: var(--text-sub); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .tab[aria-selected="true"] .tab-count { background: var(--brand); color: #fff; }
    .tab-count.alert { background: var(--stage-3-solid); color: #fff; }
    .table-toolbar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .result-count { font-size: 14px; color: var(--text-sub); }
    .search-box { padding: 0 14px; min-height: 36px; border: 1px solid var(--control-border); border-radius: 8px; font-size: 15px; width: 280px; max-width: 100%; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; text-align: left; }   /* 좁은 화면은 표만 가로로 스크롤 */
    td.loc { min-width: 200px; }
    td.kind { white-space: nowrap; }
    th { padding: 10px 14px; font-size: 14px; font-weight: 700; color: var(--text-sub); background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td, .stat-value, #updated { font-variant-numeric: tabular-nums; }
    td { padding: 11px 14px; font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:hover { background: #F1F5F9; }
    tr.row-link { cursor: pointer; }
    /* 버튼 대신 줄 전체가 링크: 마우스를 올리면(키보드는 번호에 포커스) 줄이 밝아지고 번호 · 이름에 밑줄 */
    tr.row-link:hover a.row-id, tr.row-link:focus-within a.row-id { text-decoration: underline; }
    tr.row-link:focus-within { background: #F1F5F9; }
    a.row-id { color: var(--brand); font-weight: 700; text-decoration: none; }
    a.row-id:hover { text-decoration: underline; }
    tr.row-alert, tr.row-alert:focus-within { background: var(--alert-bg); }
    tr.row-alert:hover { background: #FDE6E4; }
    tr.row-alert td:first-child { box-shadow: inset 5px 0 0 var(--stage-3); }
    .empty-row td { text-align: center; color: var(--text-sub); padding: 40px; }
    td .sub { display: block; font-size: 14px; color: var(--text-sub); font-weight: 400; }
    .nowrap { white-space: nowrap; }
    .unset { color: var(--text-sub); font-weight: 400; }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px 4px 8px; border-radius: 8px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .b-1 { background: var(--stage-1); color: var(--text-main); }
    .b-2 { background: var(--stage-2); color: var(--text-main); }
    .b-3 { background: var(--stage-3-solid); color: #fff; }
    .b-0 { background: var(--stage-0-solid); color: #fff; }
    .b-gray { background: var(--text-sub); color: #fff; }
    .st { font-weight: 800; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .st-urgent { color: var(--stage-3-text); } .st-wait { color: #8A4500; } .st-ok { color: var(--stage-0-solid); } .st-info { color: var(--brand); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 14px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
    .tag.noreply { background: #fff; color: var(--stage-3-text); border: 1px solid var(--stage-3-text); }
    .tag.mock { background: #FFE8C9; color: #8A4500; border: 1px solid #E0A35A; }


    /* ── 상세 페이지 (경고 · 기사): 모달이 아니라 주소(#event/3 · #driver/2)가 있는 페이지 ── */
    .crumbs { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-sub); margin-bottom: 12px; flex-wrap: wrap; }
    .crumbs a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }
    .crumbs [aria-hidden] { color: #94A3B8; }
    .page-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 20px; margin-bottom: 20px; background: var(--hb, var(--brand-light)); border: 1px solid var(--border); border-left: 6px solid var(--hc, var(--brand)); border-radius: 10px; }
    .page-head.s1 { --hc: var(--stage-1); --hb: #FFF4D6; --hi: var(--text-main); }
    .page-head.s2 { --hc: var(--stage-2); --hb: #FFE8C9; --hi: var(--text-main); }
    .page-head.s3 { --hc: var(--stage-3-solid); --hb: #FDE6E4; --hi: #fff; }
    .page-head.s0 { --hc: var(--stage-0-solid); --hb: #E3F4EA; --hi: #fff; }
    .page-head.brand { --hc: var(--brand); --hb: var(--brand-light); --hi: #fff; }
    .ph-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .page-head .hico { width: 44px; height: 44px; border-radius: 50%; background: var(--hc); color: var(--hi, #fff); display: flex; align-items: center; justify-content: center; flex: none; }
    .page-head .page-title { margin: 0; font-size: 22px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .page-title small { font-size: 15px; font-weight: 500; color: var(--text-sub); }
    .ph-meta { margin-top: 2px; font-size: 15px; color: var(--text-sub); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ph-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
    .detail-main, .detail-side { display: grid; gap: 20px; min-width: 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .card h3 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--brand); }
    .card h3 small { font-size: 14px; font-weight: 500; color: var(--text-sub); margin-left: auto; }
    .card h3 small a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .card h3 small a:hover { text-decoration: underline; }
    .card.flush { padding: 0; overflow: hidden; }
    .card.flush h3 { padding: 16px 20px 0; }
    .empty-page { text-align: center; padding: 48px 20px; display: grid; gap: 12px; justify-items: center; }
    .empty-page .page-title { margin: 0; }

    /* 지금 할 일 */
    .r-todo { border: 2px solid var(--brand); background: var(--brand-light); border-radius: 10px; padding: 14px 18px; }
    .r-todo.urgent { border-color: var(--stage-3-text); background: var(--alert-bg); }
    .r-todo .k { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--brand); margin-bottom: 4px; }
    .r-todo.urgent .k { color: var(--stage-3-text); }
    .r-todo .v { display: block; font-size: 18px; font-weight: 800; line-height: 1.5; }

    /* AI 분석 결과: 2단 격자로 한 화면에 */
    .r-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; }
    .r-item { min-width: 0; }
    .r-item.wide { grid-column: 1 / -1; }
    .r-label { font-size: 14px; font-weight: 700; color: var(--text-sub); margin-bottom: 2px; display: block; }
    .r-value { font-size: 16px; font-weight: 500; line-height: 1.6; display: block; }
    .r-list { list-style: none; display: grid; gap: 6px; }
    .q-ok { color: var(--stage-0-solid); font-weight: 800; } .q-fail { color: var(--stage-3-text); font-weight: 800; }
    .r-note { font-weight: 400; color: var(--text-sub); font-size: 14px; display: block; margin-top: 6px; }
    .r-mock { grid-column: 1 / -1; font-size: 14px; color: #8A4500; background: #FFE8C9; border-radius: 8px; padding: 8px 12px; line-height: 1.5; }

    /* 오른쪽 칸: 사진 · 위치 · 기사 연락처 */
    .photo { background: #E2E8F0; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo.empty { aspect-ratio: auto; min-height: 110px; flex-direction: column; gap: 6px; color: var(--text-sub); font-weight: 700; text-align: center; padding: 16px; }
    .place { padding: 14px 20px; display: grid; gap: 2px; line-height: 1.5; }
    .place b { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-sub); }
    .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 15px; }
    .kv dt { color: var(--text-sub); }
    .kv dd { font-weight: 600; word-break: break-all; }
    .kv a { color: var(--brand); text-decoration: none; }
    .kv a:hover { text-decoration: underline; }
    /* 누르면 복사되는 번호 · 이메일 (따로 [복사] 버튼 없이) */
    .copyable { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: none; background: none; padding: 2px 6px; margin: -2px -6px; border-radius: 6px; color: var(--brand); font-weight: 600; text-align: left; cursor: copy; word-break: break-all; }
    .copyable svg { opacity: .55; }
    .copyable:hover { background: var(--brand-light); }
    .copyable:hover svg { opacity: 1; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    .btn { min-height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--control-border); background: #fff; font-weight: 700; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--text-main); }
    .btn:hover { background: #F1F5F9; }
    .btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.brand:hover { background: var(--brand-dark); }

    /* 기사 상세 */
    .d-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .d-stat { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: var(--bg); }
    .d-stat .k { display: block; font-size: 14px; color: var(--text-sub); }
    .d-stat .v { font-size: 24px; font-weight: 800; }
    .d-stat .v small { font-size: 14px; font-weight: 500; color: var(--text-sub); margin-left: 2px; }
    .d-stat.alert { border-color: var(--stage-3-text); background: var(--alert-bg); }
    .d-stat.alert .v, .d-stat.alert .k { color: var(--stage-3-text); }
    /* 단계별 경고: 색은 앱 · 배지와 같은 단계 색 3개만 (그 밖은 회색) */
    .d-sub { font-size: 14px; font-weight: 700; color: var(--text-sub); margin: 18px 0 8px; }
    .stage-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stage-tile { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--border); border-left: 6px solid var(--sc); border-radius: 8px; background: var(--surface); }
    .stage-tile.s1 { --sc: var(--stage-1); --si: var(--text-main); }
    .stage-tile.s2 { --sc: var(--stage-2); --si: var(--text-main); }
    .stage-tile.s3 { --sc: var(--stage-3-solid); --si: #fff; }
    .stage-tile .ic { grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; background: var(--sc); color: var(--si); display: flex; align-items: center; justify-content: center; }
    .stage-tile .k { font-size: 14px; font-weight: 700; color: var(--text-sub); }
    .stage-tile .v { font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stage-tile .v small { font-size: 14px; font-weight: 500; color: var(--text-sub); margin-left: 2px; }
    .stage-tile.zero { border-left-color: #CBD5E1; }
    .stage-tile.zero .ic { background: #E2E8F0; color: var(--text-sub); }
    .stage-tile.zero .v { color: var(--text-sub); }
    .stage-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #E2E8F0; margin-top: 12px; }
    .stage-bar i { display: block; height: 100%; }
    .stage-bar i + i { box-shadow: inset 2px 0 0 #fff; }
    .stage-bar.mini { width: 72px; height: 8px; margin: 4px 0 0; }
    .sb-1 { background: var(--stage-1); } .sb-2 { background: var(--stage-2); } .sb-3 { background: var(--stage-3-solid); }
    .d-etc { margin-top: 10px; font-size: 14px; color: var(--text-sub); }
    .d-etc b { color: var(--text-main); }
    .card.flush table { min-width: 560px; }
    .d-more { padding: 10px 20px 14px; font-size: 14px; color: var(--text-sub); }

    /* 내 정보 */
    .profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; max-width: 960px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 14px; font-weight: 700; }
    .field input { min-height: 40px; padding: 0 12px; border: 1px solid var(--control-border); border-radius: 8px; font-size: 15px; background: #fff; width: 100%; }
    .field input:disabled { background: var(--bg); color: var(--text-sub); border-color: var(--border); }
    .field .hint { font-size: 14px; color: var(--text-sub); }
    .form-msg { min-height: 22px; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    .form-msg.err { color: var(--stage-3-text); }
    .form-msg.ok { color: var(--stage-0-solid); }

    /* ── 알림 ── */
    #toast { position: fixed; top: 20px; right: 24px; transform: translateY(-12px); background: rgba(15,23,42,.96); color: #fff; padding: 14px 22px; border-radius: 12px; font-size: 15px; font-weight: 700; max-width: min(420px, 90vw); text-align: left; line-height: 1.5; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 200; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: var(--stage-3-solid); pointer-events: auto; display: flex; align-items: center; gap: 12px; }
    #toast.error button { flex: none; min-height: 36px; padding: 0 14px; border-radius: 8px; border: 2px solid #fff; background: transparent; color: #fff; font-weight: 700; cursor: pointer; }
    /* 확인 창: 브라우저 <dialog> (포커스 가두기 · Esc · 뒤 화면 막기를 브라우저가 해 줌) */
    #confirmDlg { margin: auto; border: 0; border-radius: 14px; padding: 0; width: min(440px, 92vw); color: var(--text-main); box-shadow: 0 24px 48px rgba(0,0,0,.25); }
    #confirmDlg::backdrop { background: rgba(15, 23, 42, .55); }
    #confirmDlg h2 { padding: 18px 22px 0; font-size: 19px; font-weight: 800; }
    #confirmDlg p { padding: 10px 22px 20px; font-size: 16px; line-height: 1.6; }
    #confirmDlg form { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); background: var(--bg); }
    /* 기사 추가 창 */
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .title-row .page-title { margin-bottom: 0; }
    #driverDlg { margin: auto; border: 0; border-radius: 14px; padding: 0; width: min(480px, 94vw); max-height: 92vh; color: var(--text-main); box-shadow: 0 24px 48px rgba(0,0,0,.25); }
    #driverDlg::backdrop { background: rgba(15, 23, 42, .55); }
    #driverDlg .dlg-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px 4px; }
    #driverDlg h2 { font-size: 19px; font-weight: 800; flex: 1; }
    #driverDlg .dlg-x { width: 36px; height: 36px; border: none; background: none; border-radius: 8px; cursor: pointer; color: var(--text-sub); display: flex; align-items: center; justify-content: center; }
    #driverDlg .dlg-x:hover { background: #F1F5F9; color: var(--text-main); }
    #driverDlg .dlg-body { padding: 10px 22px 6px; }
    #driverDlg .dlg-lead { font-size: 15px; color: var(--text-sub); margin-bottom: 14px; }
    #driverDlg .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); background: var(--bg); }
    .req { color: var(--stage-3-text); margin-left: 2px; }
    .opt { font-weight: 500; color: var(--text-sub); margin-left: 4px; }
    .check { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.5; cursor: pointer; margin: 4px 0 12px; }
    .check input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--brand); }
    .done-box { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 14px 16px; }
    .done-box .kv { font-size: 16px; }
    .pw { font-family: Consolas, 'Courier New', monospace; font-size: 20px; letter-spacing: 1px; }
    .warn-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 14px; line-height: 1.5; color: #8A4500; background: #FFF4D6; border-radius: 8px; padding: 10px 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    @media (max-width: 900px) { .profile-grid { grid-template-columns: 1fr; } }
    @media (max-width: 1100px) { .stage-tiles { grid-template-columns: 1fr; } }
    @media (max-width: 1100px) { .dash-two { grid-template-columns: 1fr; } .summary-grid { grid-template-columns: repeat(2, 1fr); } .chart-section { grid-template-columns: 1fr; } .detail-grid { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      .r-grid { grid-template-columns: 1fr; }
      .sidebar { width: 76px; }
      .sidebar-header span.t, .menu-item span.t, .sidebar-footer span.t, .sidebar-user .who, .sidebar-user .chev { display: none; }
      .sidebar-header, .menu-item, .sidebar-footer, .sidebar-user { justify-content: center; padding-left: 0; padding-right: 0; position: relative; }
      .menu-badge { position: absolute; top: 6px; right: 8px; margin: 0; }
      .main-content { padding: 20px 16px 40px; }
    }
    @media (max-width: 600px) { .summary-grid { grid-template-columns: 1fr; } .search-box { width: 100%; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="visually-hidden" id="live" role="status" aria-live="polite"></div>

  <aside class="sidebar">
    <div class="sidebar-header"><img class="brand-logo" src="img/logo.png" alt="" width="34" height="34"><span class="t">졸음 가드 관리자</span></div>
    <nav class="menu" aria-label="주 메뉴">
      <a class="menu-item" href="#dashboard" data-view="dashboard" aria-label="대시보드" title="대시보드"><span data-icon="pie" data-size="22" aria-hidden="true"></span><span class="t">대시보드</span></a>
      <a class="menu-item" href="#hazards" data-view="hazards" aria-label="졸음 경고" title="졸음 경고"><span data-icon="warning" data-size="22" aria-hidden="true"></span><span class="t">졸음 경고</span><b class="menu-badge" id="menuBadge"></b></a>
      <a class="menu-item" href="#drivers" data-view="drivers" aria-label="기사 관리" title="기사 관리"><span data-icon="people" data-size="22" aria-hidden="true"></span><span class="t">기사 관리</span></a>
    </nav>
    <a class="sidebar-user" id="sidebarUser" href="#profile" title="내 정보 · 비밀번호 변경" hidden></a>
    <button class="sidebar-footer" type="button" id="logoutBtn" aria-label="로그아웃" title="로그아웃"><span data-icon="logout" data-size="22" aria-hidden="true"></span><span class="t">로그아웃</span></button>

    const NULLISH = /(?<![\w@./-])(?:null|none|undefined|nan)(?![\w@./-])/gi;   // 이메일 · 파일 이름 속 'none' 은 건드리지 않음

    }

    // ── 화면 전환 (주소 # 로 기억): #dashboard · #hazards · #drivers · #event/번호 · #driver/번호 ──
    function parseHash() {

      return { name: VIEWS.includes(name) ? name : 'dashboard', id: num };
    }
    function showView(focusTitle) {

      view = route.name; routeId = route.id;
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + view));
      const nav = NAV_OF[view] || view;
      document.querySelectorAll('.menu-item').forEach((b) => { if (b.dataset.view === nav) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
      if (view === 'profile') $('sidebarUser').setAttribute('aria-current', 'page'); else $('sidebarUser').removeAttribute('aria-current');
      $('main').scrollTop = 0;
      updateTitle();
      renderAll(true);
      if (view === 'profile') renderProfilePage();            // 입력 중인 칸이 10초 갱신에 지워지지 않게 여기서만 그림
      if (focusTitle) { const t = document.querySelector('.view.active h1'); if (t) t.focus({ preventScroll: true }); }

    // 호칭: 이름이 있으면 '이정자 기사님', 없으면 '기사님' ('기사 3' 같은 번호 호칭은 쓰지 않는다)
    const honor = (n) => (n && String(n).trim() ? String(n).trim() + ' 기사님' : '기사님');
    // 서버(AI)가 쓴 글 속의 '기사에게 · 기사님께 · 기사의' 를 '이정자 기사님께 · 이정자 기사님의' 로
    function personal(text, name) {
      if (typeof text !== 'string' || !name || !String(name).trim()) return text;
      const who = honor(name);
      return text.replace(/(?<![가-힣])기사(?:님)?(?:에게|께)/g, who + '께').replace(/(?<![가-힣])기사(?:님)?의/g, who + '의');
    }

    function renderSummary() {

      const diff = today - yesterday;

      drivers().forEach((u) => { states[driverState(u)[2]]++; });

    // 대시보드 아래쪽 목록 셋: 지금 처리할 일 · 이번 주 졸음이 잦은 기사 · 연락처 미등록 기사
    function renderDashLists() {
      // ① 지금 처리할 일: 긴급(미처리) 먼저, 그다음 미확인. 최근 5건

            h('span', { class: 'todo-time' }, fmtTime(e.created_at)),
            h('span', { class: 'chev', 'aria-hidden': 'true' }, '›'))))
          : h('p', { class: 'empty-note' }, '지금 처리할 경고가 없어요.'));

      // ② 최근 7일 졸음 경고가 많은 기사 TOP 3
      const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000, count = new Map();
      events.forEach((e) => { if (e.user_id != null && new Date(e.created_at).getTime() >= weekAgo) count.set(e.user_id, (count.get(e.user_id) || 0) + 1); });
      const top = [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3), max = top.length ? top[0][1] : 1;
      fill($('topCard'),
        h('h3', null, icon('people', 20), '이번 주 졸음 경고가 많은 기사', h('small', null, '최근 7일')),
        top.length ? h('ol', { class: 'rank-list' }, top.map(([id, c], i) => {
          const u = users.find((x) => x.id === id), ev = events.find((x) => x.user_id === id);
          return h('li', null, h('span', { class: 'rank-no' }, String(i + 1)),
            h('a', { href: '#driver/' + id }, honor(u ? u.name : ev && ev.user_name)),
            h('span', { class: 'rank-bar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + Math.round((c / max) * 100) + '%' })),

      // ③ 연락처(전화번호) 미등록 기사: 경고가 나도 전화할 수 없다

    function renderStageChart() {
      const max = Math.max(1, ...stageStats.map((s) => s.count));

    function renderTimeChart() {
      const buckets = Array.from({ length: 8 }, (_, i) => hourStats.filter((x) => x.hour >= i * 3 && x.hour < i * 3 + 3).reduce((a, x) => a + x.count, 0));
      const peak = Math.max(...buckets);
      const top = Math.max(2, Math.ceil(peak / 2) * 2);                  // 세로 눈금은 짝수로
      const W = 420, H = 230, L = 34, R = 14, T = 16, B = 34;
      const x = (i) => L + (i * (W - L - R)) / 7, y = (v) => T + (1 - v / top) * (H - T - B);
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'linechart'); svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', '시간대별 경고 수: ' + buckets.map((v, i) => String(i * 3).padStart(2, '0') + '시대 ' + v + '건').join(', '));
      const add = (name, attrs, text) => { const n = document.createElementNS(SVG_NS, name); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; svg.appendChild(n); return n; };
      [0, top / 2, top].forEach((v) => {
        add('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: '#E2E8F0', 'stroke-width': 1 });
        add('text', { x: L - 8, y: y(v) + 4, 'text-anchor': 'end' }, String(v));
      });
      const pts = buckets.map((v, i) => x(i) + ',' + y(v)).join(' ');
      add('polygon', { points: L + ',' + y(0) + ' ' + pts + ' ' + x(7) + ',' + y(0), fill: 'rgba(30, 64, 175, .12)' });
      add('polyline', { points: pts, fill: 'none', stroke: '#1E40AF', 'stroke-width': 3, 'stroke-linejoin': 'round' });
      buckets.forEach((v, i) => {
        add('circle', { cx: x(i), cy: y(v), r: 4.5, fill: '#fff', stroke: '#1E40AF', 'stroke-width': 3 });
        if (v > 0) add('text', { x: x(i), y: y(v) - 10, 'text-anchor': 'middle', class: 'val' }, String(v));
        add('text', { x: x(i), y: H - 10, 'text-anchor': 'middle' }, String(i * 3).padStart(2, '0'));
      });
      fill($('timeChart'), svg);
    }

    const stageCounts = (list) => [1, 2, 3].map((n) => list.filter((e) => stageNum(e.stage) === n).length);

    // ── 사이드바 배지 · 안내 ──────────────────────────────────
    function renderChrome() {
      const openUrgent = events.filter(isOpenUrgent);

      badge.setAttribute('aria-label', '긴급 ' + urgent + '건');
      lastUrgent = urgent;
      updateTitle();
      // 새로 생긴 긴급 경고(번호로 구분)만 알린다. 첫 불러오기 전에는 비교하지 않음 (처음 열자마자 '새 경고' 알림이 뜨지 않게)
      const fresh = loaded ? openUrgent.filter((e) => !seenUrgent.has(e.id)) : [];
      openUrgent.forEach((e) => seenUrgent.add(e.id));
      if (fresh.length) raiseAlert(fresh, urgent);
    }

    // ── 긴급 알림: 새 3단계 · "음성 응답 없음" → 알림음 · 탭 제목 깜빡임 · 빨간 배너 ──────
    const seenUrgent = new Set();
    let blinkTimer = null, blinkOn = false, soundOn = true, audioCtx = null;
    try { soundOn = localStorage.getItem('adminSound') !== 'off'; } catch (e) { /* 저장소를 못 쓰면 켜 둔다 */ }
    function updateTitle() { document.title = blinkOn ? '🚨 새 긴급 경고! · 졸음 가드' : (connLost ? '⚠️ 연결 끊김 · ' : '') + (lastUrgent ? '(' + lastUrgent + ') ' : '') + (view === 'event' ? '경고 #' + routeId + ' · ' : view === 'driver' ? '기사 상세 · ' : view === 'profile' ? '내 정보 · ' : '') + '졸음 가드 관리자'; }
    function stopBlink() { clearInterval(blinkTimer); blinkTimer = null; blinkOn = false; updateTitle(); }
    function startBlink() { if (blinkTimer) return; blinkOn = true; updateTitle(); blinkTimer = setInterval(() => { blinkOn = !blinkOn; updateTitle(); }, 1000); }
    function dismissAlert() { $('urgentBanner').hidden = true; stopBlink(); }
    // 브라우저는 화면을 한 번 누르기 전에는 소리를 막는다 → 첫 클릭 · 키 입력 때 소리를 열어 둔다
    function unlockAudio() {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, unlockAudio));
    function beep() {                                  // 삐-삐-삐 (높은 음 3번). 소리가 막혀 있으면 false
      if (!soundOn) return true;
      if (!audioCtx || audioCtx.state !== 'running') return false;
      [0, 0.28, 0.56].forEach((offset) => {
        const t = audioCtx.currentTime + offset;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t); gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.22);
      });
      return true;
    }
    function raiseAlert(fresh, total) {
      const s3 = fresh.filter((e) => e.stage === 3).length, nr = fresh.filter((e) => e.reason === 'no_response').length;
      const names = [...new Set(fresh.map((e) => honor(e.user_name)))].slice(0, 3).join(' · ');

      const audible = beep();

      const box = $('ubText'); box.textContent = msg;
      if (!audible) box.append(h('small', null, '소리가 나려면 화면을 한 번 눌러 주세요. 지금 처리할 긴급 경고는 모두 ' + total + '건이에요.'));

    // 복사: 먼저 clipboard API. 없거나(다른 PC 에서 http://IP 로 열 때) 브라우저가 막으면 옛 방식(숨긴 칸 선택 → 복사)으로 한 번 더

            h('section', { class: 'card' }, h('h3', null, icon('robot', 20), 'AI 분석 결과', h('small', null, '자동 분석 · 참고용')),

    // 상세를 열면 미확인 → 확인 (11/09). 화면이 실제로 보일 때만 (새 탭으로 열어 두기만 한 경고는 그대로 미확인).

    async function autoAck() {

                h('caption', { class: 'visually-hidden' }, honor(u.name) + '의 최근 경고'),

                h('tbody', null, rows))),
              mine.length > recent.length ? h('p', { class: 'd-more' }, '최근 ' + recent.length + '건만 보여요 (전체 ' + mine.length + '건)') : null)),
          h('div', { class: 'detail-side' },
            h('section', { class: 'card' }, h('h3', null, icon('phone', 20), '연락처'),

    // 확인 창 (브라우저 기본 confirm 은 화면을 멈춰서 10초 갱신 · 긴급 알림까지 막음). 처음 포커스는 안전한 [취소]
    function askConfirm(title, body, yesLabel) {

      $('confirmBody').textContent = body;

      dlg.returnValue = '';

        dlg.addEventListener('close', () => {
          // 10초 갱신으로 누른 버튼이 다시 그려졌으면 포커스가 사라지므로 제목으로

    async function changeStatus(e, status) {

      closeToastError();
      busy = true;
      try {
        const res = await updateEventStatus(e.id, status);
        await refreshAll(true);
        const t = $('pageTitle'); if (t) t.focus({ preventScroll: true });   // 누른 버튼은 사라졌을 수 있어서 제목으로
        toast(status === '확인' ? '확인한 경고로 표시했어요.' : res.stage_reset ? '조치완료로 바꿨어요. 3단계가 해제되며 기사 앱은 다음 갱신(약 30초 안)에 정상 화면이 돼요.' : '조치완료로 바꿨어요.');
      } catch (err) { toastError(status + ' 실패: ' + err.message + (status === '조치완료' ? ' — 기사 앱의 단계가 풀리지 않았을 수 있어요.' : '')); }
      finally { busy = false; }
    }

    // ── 탭 (제목 바로 아래에서 보고 싶은 것만 골라 봄): defs = [키, 글, 개수, 빨갛게?] ──────────
    function renderTabs(box, panelId, defs, current, onPick) {
      fill(box, ...defs.map(([key, label, count, alert]) =>
        h('button', { class: 'tab', type: 'button', role: 'tab', id: panelId + '-tab-' + key, 'data-key': 'tab-' + key, 'aria-selected': String(current === key),
          'aria-controls': panelId, tabindex: current === key ? '0' : '-1', onclick: () => onPick(key) },
          label, h('span', { class: 'tab-count' + (alert && count > 0 ? ' alert' : '') }, String(count)))));
      $(panelId).setAttribute('aria-labelledby', panelId + '-tab-' + current);
    }

    // ── 내 정보 (왼쪽 아래 프로필을 누르면): 이름 · 전화번호 수정 · 비밀번호 변경 ──────────────────
    let me = null;                                      // 로그인한 관리자 (GET /users/me)
    function renderSidebarUser() {
      const box = $('sidebarUser');
      if (!me) { box.hidden = true; return; }
      box.hidden = false;
      box.setAttribute('aria-label', (me.name || '관리자') + ' ' + (me.email || '') + ', 내 정보 · 비밀번호 변경');
      fill(box, h('span', { class: 'avatar', 'aria-hidden': 'true' }, icon('person', 20)),
        h('span', { class: 'who' }, h('b', null, me.name || '관리자'), h('small', null, me.email)),
        h('span', { class: 'chev', 'aria-hidden': 'true' }, '›'));
    }
    async function loadMe() {
      try { me = scrub(await fetchMe()); } catch (err) { /* 못 불러와도 화면은 계속 쓴다 */ }
      renderSidebarUser();
      if (view === 'profile' && !document.querySelector('#profilePage form input:focus')) renderProfilePage();   // 내 정보로 바로 들어왔으면 이름 · 전화번호를 채워서 다시 그림
    }
    function setMsg(node, text, isError) { node.textContent = text; node.className = 'form-msg ' + (isError ? 'err' : 'ok'); }
    function field(id, label, attrs, hint) {
      return h('div', { class: 'field' }, h('label', { for: id }, label), h('input', Object.assign({ id }, attrs)), hint ? h('span', { class: 'hint', id: id + 'Hint' }, hint) : null);
    }
    function renderProfilePage() {
      const box = $('profilePage');
      const profileForm = h('form', { id: 'profileForm', novalidate: true },
        field('setName', '이름', { type: 'text', value: (me && me.name) || '', maxlength: '50', autocomplete: 'name', required: true }),
        field('setPhone', '전화번호', { type: 'tel', value: (me && me.phone) || '', placeholder: '010-1234-5678', autocomplete: 'tel', 'aria-describedby': 'setPhoneHint' }, '비워 두고 저장하면 지워져요.'),
        field('setEmail', '이메일', { type: 'email', value: (me && me.email) || '', disabled: true, 'aria-describedby': 'setEmailHint' }, '이메일은 로그인 아이디라서 바꿀 수 없어요.'),
        h('p', { class: 'form-msg', id: 'profileMsg', role: 'alert' }),
        h('button', { class: 'btn brand', type: 'submit', id: 'profileSave' }, '저장'));
      profileForm.addEventListener('submit', saveProfile);

      const pwForm = h('form', { id: 'pwForm', novalidate: true },
        field('pwCur', '지금 비밀번호', { type: 'password', autocomplete: 'current-password', required: true }),
        field('pwNew', '새 비밀번호', { type: 'password', autocomplete: 'new-password', required: true, 'aria-describedby': 'pwNewHint' }, '대문자 · 소문자 · 숫자 · 특수문자를 모두 넣어 8자리 이상으로 만들어 주세요.'),
        field('pwNew2', '새 비밀번호 확인', { type: 'password', autocomplete: 'new-password', required: true }),
        h('p', { class: 'form-msg', id: 'pwMsg', role: 'alert' }),
        h('button', { class: 'btn brand', type: 'submit', id: 'pwSave' }, '비밀번호 변경'));

      fill(box, h('div', { class: 'profile-grid' },
        h('section', { class: 'card' }, h('h3', null, icon('person', 20), '프로필'), profileForm),
        h('section', { class: 'card' }, h('h3', null, icon('shield', 20), '비밀번호 변경'), pwForm)));
    }
    async function saveProfile(ev) {
      ev.preventDefault();
      const msg = $('profileMsg'), btn = $('profileSave');
      const name = $('setName').value.trim(), phone = $('setPhone').value.trim();
      if (!name) { setMsg(msg, '이름을 입력해 주세요.', true); $('setName').focus(); return; }
      btn.disabled = true; msg.textContent = '';
      try {
        me = scrub(await updateMe({ name, phone }));
        renderSidebarUser();
        $('setName').value = me.name || ''; $('setPhone').value = me.phone || '';
        setMsg(msg, '저장했어요.', false);
        toast('내 정보를 저장했어요.');
      } catch (err) { setMsg(msg, err.message, true); }
      finally { btn.disabled = false; }
    }
    async function savePassword(ev) {
      ev.preventDefault();
      const msg = $('pwMsg'), btn = $('pwSave');
      const cur = $('pwCur').value, nw = $('pwNew').value, nw2 = $('pwNew2').value;
      if (!cur || !nw) { setMsg(msg, '지금 비밀번호와 새 비밀번호를 입력해 주세요.', true); return; }
      if (nw !== nw2) { setMsg(msg, '새 비밀번호가 서로 달라요.', true); $('pwNew2').focus(); return; }
      if (nw === cur) { setMsg(msg, '지금과 다른 비밀번호로 바꿔 주세요.', true); $('pwNew').focus(); return; }
      btn.disabled = true; msg.textContent = '';
      try {
        await changeMyPassword(cur, nw);
        ['pwCur', 'pwNew', 'pwNew2'].forEach((id) => { $(id).value = ''; });
        setMsg(msg, '비밀번호를 바꿨어요. 다음 로그인부터 새 비밀번호를 써 주세요.', false);
        toast('비밀번호를 바꿨어요.');
      } catch (err) { setMsg(msg, err.message, true); }
      finally { btn.disabled = false; }
    }

    // ── 불러오기 (10초마다) ───────────────────────────────────
    // 연결 상태 표시: 경고 조회 실패 = 빨강 (새 긴급 경고가 안 보일 수 있음), 나머지 일부 실패 = 주황
    function showConn(eventsFailed, partial) {
      const banner = $('connBanner');
      connLost = eventsFailed;
      updateTitle();
      if (!eventsFailed && !partial.length) { banner.hidden = true; return; }
      banner.classList.toggle('warn', !eventsFailed);
      const text = eventsFailed ? '서버에 연결할 수 없어요. 새 긴급 경고가 보이지 않을 수 있어요.'
        : partial.join(' · ') + '을(를) 불러오지 못했어요. 경고 목록은 최신이에요.';
      if ($('connText').textContent !== text) $('connText').textContent = text;   // 같은 말을 10초마다 다시 읽지 않게
      const sec = lastOkAt ? Math.round((Date.now() - lastOkAt) / 1000) : null;
      $('connAgo').textContent = !eventsFailed ? '' : sec === null ? '아직 받은 데이터가 없어요.' : '화면은 ' + sec + '초 전 데이터예요.';
      banner.hidden = false;
    }
    async function refreshAll(force) {
      if (refreshing) return;
      refreshing = true;
      try {
        const [ev, us, st, hr] = await Promise.allSettled([fetchAdminEvents({}), fetchAdminUsers(), fetchStageStats(), fetchHourlyStats()]);
        const partial = [];
        if (us.status === 'fulfilled') users = scrub(us.value); else partial.push('기사 목록');
        if (st.status === 'fulfilled') stageStats = st.value; else partial.push('단계별 통계');
        if (hr.status === 'fulfilled') hourStats = hr.value; else partial.push('시간대별 통계');
        if (ev.status !== 'fulfilled') {
          showConn(true, partial);
          $('updated').textContent = lastOkAt ? '갱신 실패 · 마지막 성공 ' + new Date(lastOkAt).toLocaleTimeString('ko-KR') : '불러오지 못했어요';
          return;
        }
        events = scrub(ev.value);
        lastOkAt = Date.now();
        showConn(false, partial);
        $('updated').textContent = (partial.length ? '일부 갱신 ' : '마지막 갱신 ') + new Date().toLocaleTimeString('ko-KR');
        renderAll(!!force);
        loaded = true;
      } finally {
        refreshing = false;
      }
    }

    if (!getToken()) location.href = 'admin_login.html';
    fillIcons();
    // 건너뛰기: 주소 # 는 화면 전환에 쓰여서 (#main 이면 대시보드로 감) 포커스만 옮긴다
    document.querySelector('.skip').addEventListener('click', (ev) => { ev.preventDefault(); $('main').focus(); });
    $('connRetry').addEventListener('click', () => refreshAll(true));
    document.querySelectorAll('.menu-item').forEach((b) => b.addEventListener('click', (ev) => {
      if (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;       // 새 탭으로 열기는 브라우저에 맡김
      ev.preventDefault(); go(b.dataset.view);
    }));
    $('addDriverBtn').addEventListener('click', openDriverDlg);
    $('ubView').addEventListener('click', () => { dismissAlert(); goHazards('urgent'); });
    $('ubClose').addEventListener('click', dismissAlert);
    $('soundBtn').addEventListener('click', () => {
      soundOn = !soundOn;
      try { localStorage.setItem('adminSound', soundOn ? 'on' : 'off'); } catch (e) { /* 저장 못 해도 이번 화면에서는 적용 */ }
      syncSoundBtn();
      if (soundOn) beep();                             // 켤 때 한 번 들려 줘서 소리가 나는지 알 수 있게
    });
    syncSoundBtn();
    $('logoutBtn').addEventListener('click', () => { clearToken(); location.href = 'admin_login.html'; });
    $('driverSearch').addEventListener('input', (ev) => { driverQuery = ev.target.value; renderAll(true); });
    $('hazardSearch').addEventListener('input', (ev) => { hazardQuery = ev.target.value; renderAll(true); });
    document.querySelectorAll('.tabs').forEach((box) => box.addEventListener('keydown', (ev) => {   // 탭: 좌우 화살표 · Home · End
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) return;
      const tabs = [...box.querySelectorAll('[role="tab"]')], i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      ev.preventDefault();
      const next = tabs[ev.key === 'Home' ? 0 : ev.key === 'End' ? tabs.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
      next.click();
      const again = box.querySelector('[data-key="' + next.dataset.key + '"]'); if (again) again.focus();
    }));
    showView(false);
    refreshAll(true);
    loadMe();
