<!--
═══════════════════════════════════════════════════════════════
static/admin.html — 관리자 웹 (대시보드 · 졸음 경고 · 기사 관리)
담당: D   |   우선: P0
수업 원본: road_hazard_api/static/admin.html (🟡 수정)
화면 모양: 「관리자 (2).html」 확정본 (사이드바 · 통계 카드 · 차트 · 경고 표 · 상세 모달 · 기사 연락 모달)

[이 파일이 하는 일]
  - 대시보드: 오늘 전체 경고 · 3단계 긴급(조치 필요) · 등록된 기사 · 휴게 미준수(오늘) 카드 (누르면 목록으로),
    단계별 경고 · 시간대별 졸음 차트 (서버 /admin/stats/*)
  - 졸음 경고: 표 + 필터 칩(전체 · 미확인 · 3단계 · 휴게 미준수 · 음성 응답 없음)
    · 3단계 / "음성 응답 없음"(reason no_response) 미처리 줄은 연한 빨강으로 표시
    · [상세 보기 및 조치] → 모달: 사진 · 위치 · Agent 보고서(상황 · 단계 이유 · 법규 · 권장 조치) · 운전 중 퀴즈 · 휴식 기록
    · [확인했어요] / [조치완료] → PATCH /events/{id}/status → 3단계 해제
  - 기사 관리: 기사 목록(이름 · 이메일 · 상태 · 오늘 경고 · 누적 경고 · 마지막 경고) + 검색 + 연락 모달
  - AI 처리 표시: 보고서의 report.is_real(llm · rag · agent)로 '모의'로 대체된 단계를 태그로 알려 줌

[기사 연락 (전화번호 · 차량번호)]
  - 팀장 결정(10/29)으로 users 에 phone · vehicle_no 추가 → 기사가 앱 '내 정보'에서 직접 적음. 안 적었으면 '미등록'
  - 연락 모달: 문자(sms:) · 전화(tel:) 링크 (번호가 없으면 이메일 보내기). 기사 목록은 이름 · 차량번호 · 전화번호 · 상태 …

[확정본과 다른 점 — 서버(DB)에 없는 값은 만들지 않았다]
  - '운행 중 기사' 카드는 '등록된 기사'로, 기사 상태는 경고 처리 상황으로 계산 (운행 중 여부는 서버 메모리라 API 가 없음)
  - 카카오맵 자리는 도로명 주소 · 좌표 글자로 (지도 API 연결 전)
  - 차트는 Chart.js(외부 CDN) 대신 SVG · CSS 로 직접 그림 (인터넷 없이도 시연되게)

[접근성 · 가독성 약속]
  - 글자 14px 이상, 색 대비 4.5:1 이상 (노랑 · 주황 바탕은 어두운 글자, 초록 · 빨강 바탕만 흰 글자 + 진한 색)
  - 색만으로 구분하지 않음: 단계는 아이콘 + 글자, 상태는 글자
  - 모달: role=dialog · Esc 로 닫기 · 포커스 가두기 · 닫으면 눌렀던 버튼으로 포커스 복귀 · 뒤 화면 inert
  - 10초마다 새로 불러와도 바뀐 게 없으면 다시 그리지 않고, 그릴 때도 포커스 유지. 알림은 aria-live
  - 주소 # (dashboard · hazards · drivers) 로 화면을 기억해 뒤로 가기가 됨

[주의]
  - 서버가 보낸 글(LLM 요약 · 보고서 · 이름)은 항상 textContent 로만 넣는다 (innerHTML 금지)
  - 아이콘(SVG)은 아래 ICONS 의 고정 값만 쓴다
═══════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>졸음 가드 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --brand: #1E40AF; --brand-dark: #1E3A8A; --brand-light: #DBEAFE;
      --bg: #F8FAFC; --surface: #FFFFFF; --text-main: #1E293B; --text-sub: #55617A; --border: #E2E8F0;
      /* 단계 색 (확정본 값). 흰 글자를 올릴 때는 -solid 를, 글자색으로는 -text 를 쓴다 (모두 4.5:1 이상) */
      --stage-0: #1D9E75; --stage-0-solid: #0F7B5A;
      --stage-1: #E8AE1E; --stage-2: #EF7D27;
      --stage-3: #E24B4A; --stage-3-solid: #C62828; --stage-3-text: #B3261E;
      --alert-bg: #FEF2F2; --alert-border: #FCA5A5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    svg { display: block; flex: none; }
    button { font-family: inherit; font-size: inherit; color: inherit; }
    :focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
    body { display: flex; height: 100vh; background: var(--bg); color: var(--text-main); overflow: hidden; font-size: 16px; line-height: 1.5; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: 12px; top: -60px; background: #fff; color: var(--brand); padding: 10px 16px; border-radius: 8px; font-weight: 800; z-index: 300; }
    .skip:focus { top: 12px; }

    /* ── 사이드바 ── */
    .sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 22px 24px; font-size: 20px; font-weight: 800; color: var(--brand); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .menu { flex: 1; padding: 16px 0; }
    .menu-item { width: 100%; border: none; background: none; text-align: left; padding: 15px 24px; min-height: 52px; display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500; color: var(--text-sub); cursor: pointer; border-right: 4px solid transparent; }
    .menu-item:hover, .menu-item[aria-current="page"] { background: var(--brand-light); color: var(--brand); font-weight: 700; border-right-color: var(--brand); }
    .menu-badge { margin-left: auto; background: var(--stage-3-solid); color: #fff; font-size: 14px; font-weight: 700; min-width: 24px; height: 24px; border-radius: 12px; display: none; align-items: center; justify-content: center; padding: 0 7px; }
    .sidebar-footer { width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--border); padding: 18px 24px; min-height: 56px; cursor: pointer; color: var(--text-sub); font-weight: 500; font-size: 16px; display: flex; align-items: center; gap: 12px; }
    .sidebar-footer:hover { color: var(--text-main); background: var(--bg); }

    /* ── 본문 ── */
    .main-content { flex: 1; overflow-y: auto; padding: 28px 40px 48px; min-width: 0; }
    .main-content:focus { outline: none; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 14px; color: var(--text-sub); }
    .topbar button { border: 1px solid var(--border); background: var(--surface); border-radius: 20px; min-height: 40px; padding: 0 16px; font-weight: 700; color: var(--text-sub); cursor: pointer; }
    .topbar button:hover { border-color: var(--brand); color: var(--brand); }
    .view { display: none; }
    .view.active { display: block; }
    .page-title { font-size: 26px; font-weight: 800; margin-bottom: 22px; }
    .page-title:focus { outline: none; }
    .page-title:focus-visible { outline: 3px solid #2563EB; outline-offset: 4px; }

    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
    .stat-card { background: var(--surface); padding: 22px 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,.03); display: flex; flex-direction: column; text-align: left; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 14px rgba(0,0,0,.07); }
    .stat-card.alert { background: var(--alert-bg); border-color: var(--alert-border); }
    .stat-card.alert .stat-title, .stat-card.alert .stat-value { color: var(--stage-3-text); }
    .stat-title { font-size: 15px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .stat-value { font-size: 34px; font-weight: 800; line-height: 1.2; }
    .stat-value small { font-size: 17px; font-weight: 500; color: var(--text-sub); margin-left: 2px; }
    .stat-card.alert .stat-value small { color: var(--stage-3-text); }

    .chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chart-card { background: var(--surface); padding: 22px 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,.03); }
    .chart-card h3 { font-size: 17px; margin-bottom: 4px; }
    .chart-card .hint { font-size: 14px; color: var(--text-sub); margin-bottom: 14px; }
    .bars { display: flex; align-items: flex-end; justify-content: space-around; gap: 14px; height: 200px; padding: 22px 8px 0; border-bottom: 2px solid var(--border); }
    .bcol { flex: 1; max-width: 90px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .bcol .v { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .bcol .b { width: 100%; border-radius: 8px 8px 0 0; min-height: 4px; }
    .blabels { display: flex; justify-content: space-around; gap: 14px; padding: 8px 8px 0; font-size: 14px; font-weight: 700; color: var(--text-sub); text-align: center; }
    .blabels span { flex: 1; max-width: 90px; }
    .linechart { width: 100%; height: auto; }
    .linechart text { font-size: 12px; fill: var(--text-sub); font-family: inherit; }
    .linechart .val { font-size: 12px; font-weight: 800; fill: var(--text-main); }

    /* ── 표 ── */
    .table-section { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,.03); overflow: hidden; }
    .table-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
    .table-header h3 { font-size: 19px; font-weight: 800; }
    .table-header h3 small { font-size: 15px; color: var(--text-sub); font-weight: 500; margin-left: 4px; }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 0 16px; min-height: 40px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); color: var(--text-sub); background: var(--surface); }
    .chip:hover { border-color: var(--brand); color: var(--brand); }
    .chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
    .search-box { padding: 0 16px; min-height: 44px; border: 1px solid #94A3B8; border-radius: 22px; font-size: 15px; width: 280px; max-width: 100%; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; text-align: left; }   /* 좁은 화면은 표만 가로로 스크롤 */
    td.loc { min-width: 200px; }
    td.kind { white-space: nowrap; }
    th { padding: 14px 14px; font-size: 14px; font-weight: 700; color: var(--text-sub); background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 14px 14px; font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:hover { background: #F1F5F9; }
    tr.row-alert, tr.row-alert:hover { background: var(--alert-bg); }
    tr.row-alert td:first-child { box-shadow: inset 5px 0 0 var(--stage-3); }
    .empty-row td { text-align: center; color: var(--text-sub); padding: 40px; }
    td .sub { display: block; font-size: 14px; color: var(--text-sub); font-weight: 400; }
    .nowrap { white-space: nowrap; }
    .unset { color: var(--text-sub); font-weight: 400; }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px 4px 8px; border-radius: 8px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .b-1 { background: var(--stage-1); color: var(--text-main); }
    .b-2 { background: var(--stage-2); color: var(--text-main); }
    .b-3 { background: var(--stage-3-solid); color: #fff; }
    .b-0 { background: var(--stage-0-solid); color: #fff; }
    .b-gray { background: var(--text-sub); color: #fff; }
    .st { font-weight: 800; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .st-urgent { color: var(--stage-3-text); } .st-wait { color: #8A4500; } .st-ok { color: var(--stage-0-solid); } .st-info { color: var(--brand); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 14px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
    .tag.noreply { background: #fff; color: var(--stage-3-text); border: 1px solid var(--stage-3-text); }
    .tag.mock { background: #FFE8C9; color: #8A4500; border: 1px solid #E0A35A; }

    .btn-action { padding: 0 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--brand); background: var(--brand); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-action:hover { background: var(--brand-dark); }
    .btn-action.outline { background: #fff; color: var(--brand); }
    .btn-action.outline:hover { background: var(--brand-light); }

    /* ── 모달 ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .6); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); width: 860px; max-width: 94vw; max-height: 94vh; overflow-y: auto; border-radius: 20px; box-shadow: 0 24px 48px rgba(0,0,0,.2); }
    .modal.small { width: 440px; }
    .modal-header { padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 6px solid var(--hc, var(--brand)); background: var(--hb, var(--brand-light)); }
    .modal-header h2 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .modal-header h2 .hico { width: 40px; height: 40px; border-radius: 50%; background: var(--hc); color: var(--hi, #fff); display: flex; align-items: center; justify-content: center; }
    .modal-header h2 small { font-size: 15px; font-weight: 500; }
    .modal-close { background: none; border: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: rgba(0,0,0,.08); }
    .modal-header.s1 { --hc: var(--stage-1); --hb: #FFF4D6; --hi: var(--text-main); }
    .modal-header.s2 { --hc: var(--stage-2); --hb: #FFE8C9; --hi: var(--text-main); }
    .modal-header.s3 { --hc: var(--stage-3-solid); --hb: #FDE6E4; --hi: #fff; }
    .modal-header.s0 { --hc: var(--stage-0-solid); --hb: #E3F4EA; --hi: #fff; }
    .modal-header.brand { --hc: var(--brand); --hb: var(--brand-light); --hi: #fff; }
    .modal-body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .modal-img { width: 100%; min-height: 180px; background: #E2E8F0; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center; color: var(--text-sub); font-weight: 700; margin-bottom: 12px; padding: 12px; line-height: 1.6; overflow: hidden; }
    .modal-img img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; }
    .modal-img.place { background: #F1F5F9; min-height: 0; align-items: flex-start; text-align: left; font-weight: 500; color: var(--text-main); }
    .modal-img.place b { display: flex; align-items: center; gap: 6px; }
    .report-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .report-card h3 { font-size: 17px; font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; color: var(--brand); }
    .report-row { margin-bottom: 16px; }
    .report-row:last-child { margin-bottom: 0; }
    .r-label { font-size: 14px; font-weight: 700; color: var(--text-sub); margin-bottom: 3px; display: block; }
    .r-value { font-size: 16px; font-weight: 700; line-height: 1.55; display: block; }
    .r-value.action { border: 2px solid var(--brand); background: #fff; border-radius: 10px; padding: 8px 12px; }
    .r-ai { display: inline-block; color: var(--brand); background: var(--brand-light); padding: 1px 7px; border-radius: 4px; font-size: 14px; margin-right: 6px; font-weight: 700; }
    .r-ai.mock { color: #8A4500; background: #FFE8C9; }
    .q-ok { color: var(--stage-0-solid); } .q-fail { color: var(--stage-3-text); }
    .r-note { font-weight: 500; color: var(--text-sub); font-size: 14px; display: block; margin-top: 4px; }
    .modal-footer { padding: 18px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: var(--bg); flex-wrap: wrap; }
    .btn { min-height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--text-main); }
    .btn:hover { background: #F1F5F9; }
    .btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.brand:hover { background: var(--brand-dark); }
    .contact-body { padding: 28px 24px; text-align: center; }
    .contact-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--brand-light); color: var(--brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .contact-body h3 { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
    .contact-body .sub { font-size: 16px; color: var(--text-sub); margin-bottom: 10px; }
    .contact-body .phone { font-size: 26px; font-weight: 800; color: var(--brand); letter-spacing: 1px; }
    .contact-body .mail { margin-top: 8px; font-size: 16px; font-weight: 700; color: var(--text-sub); word-break: break-all; }
    .contact-body .note { margin-top: 12px; font-size: 15px; color: var(--text-sub); }

    /* ── 알림 ── */
    #toast { position: fixed; bottom: 32px; left: 50%; transform: translate(-50%, 12px); background: rgba(15,23,42,.96); color: #fff; padding: 14px 22px; border-radius: 12px; font-size: 15px; font-weight: 700; max-width: 90vw; text-align: center; line-height: 1.5; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 200; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    @media (max-width: 1100px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } .chart-section { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      .modal-body { grid-template-columns: 1fr; }
      .sidebar { width: 76px; }
      .sidebar-header span.t, .menu-item span.t, .sidebar-footer span.t { display: none; }
      .sidebar-header, .menu-item, .sidebar-footer { justify-content: center; padding-left: 0; padding-right: 0; position: relative; }
      .menu-badge { position: absolute; top: 6px; right: 8px; margin: 0; }
      .main-content { padding: 20px 16px 40px; }
    }
    @media (max-width: 600px) { .summary-grid { grid-template-columns: 1fr; } .search-box { width: 100%; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="visually-hidden" id="live" role="status" aria-live="polite"></div>

  <aside class="sidebar">
    <div class="sidebar-header"><span data-icon="shield" data-size="26" aria-hidden="true"></span><span class="t">졸음 가드 관리자</span></div>
    <nav class="menu" aria-label="주 메뉴">
      <button class="menu-item" type="button" data-view="dashboard" aria-label="대시보드"><span data-icon="pie" data-size="22" aria-hidden="true"></span><span class="t">대시보드</span></button>

          <table>
            <caption class="visually-hidden">기사 목록</caption>
            <thead><tr><th scope="col">이름</th><th scope="col">차량번호</th><th scope="col">전화번호</th><th scope="col">상태</th><th scope="col">오늘 경고</th><th scope="col">누적 경고</th><th scope="col">마지막 경고</th><th scope="col">관리</th></tr></thead>

  <!-- 모달: 경고 상세 -->
  <div class="modal-overlay" id="hazardModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">

  <div id="toast" aria-hidden="true"></div>

  <script src="js/api.js"></script>
  <script>
    const REASON_LABEL = { microsleep: '미세수면', perclos: '피로 누적', rest_overdue: '휴게 미준수', no_response: '음성 응답 없음' };
    const QUIZ_LABEL = { repeat: '따라 말하기', add: '덧셈', reverse: '거꾸로 말하기' };
    const STAGE_ICON = ['check', 'eye', 'coffee', 'warning'];
    const STAGE_NAME = ['정상', '주의', '휴식 권고', '긴급'];
    const FILTERS = [
      ['all', '전체', () => true],
      ['unchecked', '미확인', (e) => e.status === '미확인'],
      ['s3', '3단계', (e) => e.stage === 3],
      ['rest', '휴게 미준수', (e) => e.reason === 'rest_overdue'],
      ['noreply', '음성 응답 없음', (e) => e.reason === 'no_response'],
    ];
    const VIEWS = ['dashboard', 'hazards', 'drivers'];

    // ── 아이콘: 고정 SVG 경로만 (서버 글이 들어가지 않는다) ─────────
    const ICONS = {
      check: 'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
      eye: 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
      coffee: 'M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z',
      warning: 'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
      camera: 'M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z',
      shield: 'M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z',
      pie: 'M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z',
      people: 'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z',
      logout: 'M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z',
      close: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
      person: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
      robot: 'M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-1-4c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z',
      pin: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z',
      phone: 'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z',
      mail: 'M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z',
      alert: 'M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z',
    };
    const SVG_NS = 'http://www.w3.org/2000/svg';
    function icon(name, size) {
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', size || 20);
      svg.setAttribute('height', size || 20);
      svg.setAttribute('fill', 'currentColor');
      svg.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', ICONS[name] || ICONS.check);
      svg.appendChild(path);
      return svg;
    }
    function fillIcons(root) {
      (root || document).querySelectorAll('[data-icon]').forEach((node) => { node.replaceChildren(icon(node.dataset.icon, Number(node.dataset.size) || 20)); });
    }

    // ── 작은 도우미: 글은 전부 textContent(= 텍스트 노드)로만 ─────────
    function h(tag, attrs, ...kids) {
      const node = document.createElement(tag);
      if (attrs) for (const [k, v] of Object.entries(attrs)) {
        if (v === false || v == null) continue;
        if (k === 'class') node.className = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      }
      kids.flat().forEach((c) => { if (c != null && c !== false) node.append(c.nodeType ? c : document.createTextNode(String(c))); });
      return node;
    }
    function fmtTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso || '';
      const p = (n) => String(n).padStart(2, '0');
      return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    const stageNum = (s) => { const n = Number(s); return n >= 0 && n <= 3 ? n : 0; };
    const isDone = (e) => e.status === '조치완료' || e.status === '휴식완료';
    const isOpenUrgent = (e) => !!e.urgent && e.status !== '조치완료';
    const isToday = (iso) => new Date(iso).toDateString() === new Date().toDateString();
    const where = (e) => e.address || (e.latitude != null ? Number(e.latitude).toFixed(4) + ', ' + Number(e.longitude).toFixed(4) : '위치 없음');
    const byPriority = (a, b) => (isOpenUrgent(b) - isOpenUrgent(a)) || (new Date(b.created_at) - new Date(a.created_at));

    // ── 상태 ─────────────────────────────────────────────────
    let events = [], users = [], stageStats = [], hourStats = [];
    let view = 'dashboard', filter = 'all', driverQuery = '';
    let modalId = null, contactCtx = null, lastFocus = null, contactFocus = null, busy = false, lastUrgent = null, loaded = false;
    const sig = {};

    const $ = (id) => document.getElementById(id);
    function sayLive(msg) { const live = $('live'); if (live.textContent !== msg) live.textContent = msg; }
    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      sayLive(msg);
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
    }

    // ── 화면 전환 (주소 # 로 기억) ─────────────────────────────
    function showView(name, focusTitle) {
      view = VIEWS.includes(name) ? name : 'dashboard';
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + view));
      document.querySelectorAll('.menu-item').forEach((b) => { if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
      $('main').scrollTop = 0;
      document.title = (lastUrgent ? '(' + lastUrgent + ') ' : '') + '졸음 가드 관리자';
      if (focusTitle) $('t-' + view).focus({ preventScroll: true });
      renderAll(true);
    }
    function go(name) { if (location.hash === '#' + name) showView(name, true); else location.hash = name; }
    window.addEventListener('hashchange', () => showView(location.hash.slice(1), true));
    function goHazards(f) { filter = f; go('hazards'); }

    // ── 대시보드 ──────────────────────────────────────────────
    const drivers = () => users.filter((u) => u.role !== 'admin');
    function renderSummary() {
      const urgent = events.filter(isOpenUrgent).length;
      const cards = [
        ['오늘 전체 경고', events.filter((e) => isToday(e.created_at)).length, '건', false, null, () => goHazards('all')],
        ['3단계 긴급 (조치 필요)', urgent, '건', urgent > 0, 'alert', () => goHazards('s3')],
        ['등록된 기사', drivers().length, '명', false, null, () => go('drivers')],
        ['휴게 미준수 (오늘)', events.filter((e) => e.reason === 'rest_overdue' && isToday(e.created_at)).length, '건', false, null, () => goHazards('rest')],
      ];
      $('summary').replaceChildren(...cards.map(([title, value, unit, alert, ic, fn]) =>
        h('button', { class: 'stat-card' + (alert ? ' alert' : ''), type: 'button', onclick: fn },
          h('span', { class: 'stat-title' }, ic ? icon(ic, 18) : null, title),
          h('span', { class: 'stat-value' }, String(value), h('small', null, unit)))));
    }

    function renderStageChart() {
      const max = Math.max(1, ...stageStats.map((s) => s.count));
      const colors = { 1: 'var(--stage-1)', 2: 'var(--stage-2)', 3: 'var(--stage-3)' };
      const box = $('stageChart');
      box.replaceChildren(
        h('div', { class: 'bars', role: 'img', 'aria-label': '단계별 경고 수: ' + stageStats.map((s) => stageNum(s.stage) + '단계 ' + s.count + '건').join(', ') },
          stageStats.map((s) => h('div', { class: 'bcol' }, h('span', { class: 'v' }, String(s.count)),
            h('div', { class: 'b', style: 'height:' + Math.max(2, (s.count / max) * 80) + '%; background:' + (colors[stageNum(s.stage)] || 'var(--stage-0)') })))),
        h('div', { class: 'blabels', 'aria-hidden': 'true' }, stageStats.map((s) => h('span', null, stageNum(s.stage) + '단계 (' + (s.label || STAGE_NAME[stageNum(s.stage)]) + ')'))));
    }

    function renderTimeChart() {
      const buckets = Array.from({ length: 8 }, (_, i) => hourStats.filter((x) => x.hour >= i * 3 && x.hour < i * 3 + 3).reduce((a, x) => a + x.count, 0));
      const peak = Math.max(...buckets);
      const top = Math.max(2, Math.ceil(peak / 2) * 2);                  // 세로 눈금은 짝수로
      const W = 420, H = 230, L = 34, R = 14, T = 16, B = 34;
      const x = (i) => L + (i * (W - L - R)) / 7, y = (v) => T + (1 - v / top) * (H - T - B);
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'linechart'); svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', '시간대별 경고 수: ' + buckets.map((v, i) => String(i * 3).padStart(2, '0') + '시대 ' + v + '건').join(', '));
      const add = (name, attrs, text) => { const n = document.createElementNS(SVG_NS, name); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; svg.appendChild(n); return n; };
      [0, top / 2, top].forEach((v) => {
        add('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: '#E2E8F0', 'stroke-width': 1 });
        add('text', { x: L - 8, y: y(v) + 4, 'text-anchor': 'end' }, String(v));
      });
      const pts = buckets.map((v, i) => x(i) + ',' + y(v)).join(' ');
      add('polygon', { points: L + ',' + y(0) + ' ' + pts + ' ' + x(7) + ',' + y(0), fill: 'rgba(30, 64, 175, .12)' });
      add('polyline', { points: pts, fill: 'none', stroke: '#1E40AF', 'stroke-width': 3, 'stroke-linejoin': 'round' });
      buckets.forEach((v, i) => {
        add('circle', { cx: x(i), cy: y(v), r: 4.5, fill: '#fff', stroke: '#1E40AF', 'stroke-width': 3 });
        if (v > 0) add('text', { x: x(i), y: y(v) - 10, 'text-anchor': 'middle', class: 'val' }, String(v));
        add('text', { x: x(i), y: H - 10, 'text-anchor': 'middle' }, String(i * 3).padStart(2, '0'));
      });
      $('timeChart').replaceChildren(svg);
    }

    // ── 경고 표 ───────────────────────────────────────────────
    function stageBadge(e) {
      const n = stageNum(e.stage);
      if (!n) return h('span', { class: 'badge b-gray' }, '표시 없음');
      return h('span', { class: 'badge b-' + n }, icon(STAGE_ICON[n], 16), n + '단계 ' + (e.stage_label || STAGE_NAME[n]));
    }
    function statusCell(e) {
      const map = { '미확인': [e.urgent ? 'st-urgent' : 'st-wait', e.urgent ? 'warning' : 'eye'], '확인': ['st-wait', 'eye'], '조치완료': ['st-ok', 'check'], '휴식완료': ['st-info', 'coffee'] };
      const [cls, ic] = map[e.status] || ['st-wait', 'eye'];
      return h('span', { class: 'st ' + cls }, icon(ic, 16), e.status);
    }
    function hasMock(report) { const real = report && report.is_real; return !!real && typeof real === 'object' && Object.values(real).some((v) => v !== true); }

    function renderHazards() {
      const active = document.activeElement;
      const keepKey = active && active.dataset ? active.dataset.key : null;
      const test = FILTERS.find((f) => f[0] === filter)[2];
      const list = events.filter(test).sort(byPriority);
      const body = $('hazardBody');
      body.replaceChildren(...(list.length ? list.map((e) => {
        const alert = isOpenUrgent(e);
        const act = alert ? ['상세 보기 및 조치', ''] : ['상세 보기', ' outline'];
        const kind = h('td', { class: 'kind' }, REASON_LABEL[e.reason] || e.reason,
          e.reason === 'no_response' ? h('span', { class: 'tag noreply' }, '긴급') : null,
          hasMock(e.report) ? h('span', { class: 'tag mock' }, '모의 포함') : null);
        return h('tr', { class: alert ? 'row-alert' : '' },
          h('td', { class: 'nowrap' }, '#' + e.id),
          h('td', { class: 'nowrap' }, h('strong', null, e.user_name || ('기사 ' + e.user_id))),
          h('td', null, stageBadge(e)), kind, h('td', { class: 'loc' }, where(e)),
          h('td', { class: 'nowrap' }, fmtTime(e.created_at)), h('td', null, statusCell(e)),
          h('td', null, h('button', { class: 'btn-action' + act[1], type: 'button', 'data-key': 'ev' + e.id, onclick: () => openModal(e.id),
            'aria-label': '경고 #' + e.id + ' ' + act[0] }, act[0])));
      }) : [h('tr', { class: 'empty-row' }, h('td', { colspan: 8 }, events.length ? '해당하는 경고가 없어요' : '아직 들어온 경고가 없어요'))]));
      $('hazardCount').textContent = list.length + '건';
      $('filterChips').replaceChildren(...FILTERS.map(([key, label]) =>
        h('button', { class: 'chip', type: 'button', 'aria-pressed': filter === key ? 'true' : 'false', 'data-key': 'f-' + key, onclick: () => { filter = key; renderAll(true); } }, label)));
      if (keepKey) { const again = document.querySelector('[data-key="' + keepKey + '"]'); if (again) again.focus({ preventScroll: true }); }
    }

    // ── 기사 표 ───────────────────────────────────────────────
    function driverState(u) {
      const mine = events.filter((e) => e.user_id === u.id);
      if (mine.some(isOpenUrgent)) return ['st-urgent', 'warning', '조치 필요'];
      if (mine.some((e) => !isDone(e))) return ['st-wait', 'eye', '확인 필요'];
      return ['st-ok', 'check', '이상 없음'];
    }
    function renderDrivers() {
      const active = document.activeElement;
      const keepKey = active && active.dataset ? active.dataset.key : null;
      const q = driverQuery.trim().toLowerCase(), qDigits = digitsOf(q);
      const list = drivers().filter((u) => !q || (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)
        || (u.vehicle_no || '').replace(/\s/g, '').toLowerCase().includes(q.replace(/\s/g, '')) || (qDigits.length >= 3 && digitsOf(u.phone).includes(qDigits)));
      $('driverBody').replaceChildren(...(list.length ? list.map((u) => {
        const [cls, ic, text] = driverState(u);
        const today = events.filter((e) => e.user_id === u.id && isToday(e.created_at)).length;
        const unset = (v) => v ? v : h('span', { class: 'unset' }, '미등록');
        return h('tr', null, h('td', { class: 'nowrap' }, h('strong', null, u.name)), h('td', { class: 'nowrap' }, unset(u.vehicle_no)), h('td', { class: 'nowrap' }, unset(u.phone)),
          h('td', null, h('span', { class: 'st ' + cls }, icon(ic, 16), text)),
          h('td', { class: 'nowrap' }, today + '건'), h('td', { class: 'nowrap' }, (u.event_count || 0) + '건'),
          h('td', { class: 'nowrap' }, u.last_event_at ? fmtTime(u.last_event_at) : '없음'),
          h('td', null, h('button', { class: 'btn-action', type: 'button', 'data-key': 'dr' + u.id, onclick: () => openContact({ name: u.name, email: u.email, phone: u.phone, vehicle: u.vehicle_no }), 'aria-label': u.name + ' 기사 연락하기' }, '연락하기')));
      }) : [h('tr', { class: 'empty-row' }, h('td', { colspan: 8 }, q ? '검색 결과가 없어요' : '등록된 기사가 없어요'))]));
      $('driverCount').textContent = list.length + '명';
      if (keepKey) { const again = document.querySelector('[data-key="' + keepKey + '"]'); if (again) again.focus({ preventScroll: true }); }
    }

    // ── 사이드바 배지 · 안내 ──────────────────────────────────
    function renderChrome() {
      const urgent = events.filter(isOpenUrgent).length;
      const badge = $('menuBadge');
      badge.textContent = String(urgent);
      badge.style.display = urgent > 0 ? 'inline-flex' : 'none';
      badge.setAttribute('aria-label', '긴급 ' + urgent + '건');
      document.title = (urgent ? '(' + urgent + ') ' : '') + '졸음 가드 관리자';
      if (!loaded) return;                             // 첫 불러오기 전에는 비교하지 않음 (처음 열자마자 '새 경고' 알림이 뜨지 않게)
      if (lastUrgent !== null && urgent > lastUrgent) toast('새 긴급 경고가 들어왔어요. 지금 ' + urgent + '건이에요.');
      lastUrgent = urgent;
    }

    // 바뀐 것만 다시 그림 (10초마다 불러와도 포커스 · 스크롤 유지)
    function renderAll(force) {
      renderChrome();
      const data = JSON.stringify([events, users, stageStats, hourStats, view, filter, driverQuery]);
      if (!force && data === sig.all) return;
      sig.all = data;
      if (view === 'dashboard') { renderSummary(); renderStageChart(); renderTimeChart(); }
      else if (view === 'hazards') renderHazards();
      else renderDrivers();
      if (modalId !== null) refreshModal();
    }

    // ── 모달 공통: 포커스 가두기 · Esc · 뒤 화면 inert ─────────
    function setBackground(inert) { [document.querySelector('.sidebar'), $('main')].forEach((n) => { n.inert = inert; }); }
    function openOverlay(overlay, firstFocus) {
      lastFocus = document.activeElement;
      overlay.classList.add('open'); setBackground(true);
      firstFocus.focus();
    }
    function closeOverlay(overlay) {
      overlay.classList.remove('open'); setBackground(false);
      const key = lastFocus && lastFocus.dataset ? lastFocus.dataset.key : null;
      const again = key ? document.querySelector('[data-key="' + key + '"]') : null;
      (again || lastFocus || $('main')).focus({ preventScroll: true });
    }
    document.addEventListener('keydown', (ev) => {
      const open = document.querySelectorAll('.modal-overlay.open');
      const overlay = open[open.length - 1];           // 겹쳐 열렸으면 맨 위(나중에 열린) 모달
      if (!overlay) return;
      if (ev.key === 'Escape') { overlay.id === 'contactModal' ? closeContact() : closeModal(); return; }
      if (ev.key !== 'Tab') return;
      const items = [...overlay.querySelectorAll('button, a[href]')].filter((n) => !n.disabled && n.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    });
    ['hazardModal', 'contactModal'].forEach((id) => $(id).addEventListener('click', (ev) => { if (ev.target === ev.currentTarget) (id === 'contactModal' ? closeContact : closeModal)(); }));

    // ── 경고 상세 모달 ────────────────────────────────────────
    function reportRow(label, value, tag, extraClass) {
      if (value === undefined || value === null || value === '') return null;
      return h('div', { class: 'report-row' }, h('span', { class: 'r-label' }, label),
        h('span', { class: 'r-value' + (extraClass ? ' ' + extraClass : '') }, tag, value));
    }
    function aiTag(report, key, label) {
      const real = report && report.is_real;
      if (!real || typeof real !== 'object' || !(key in real)) return label ? h('span', { class: 'r-ai' }, label) : null;
      return real[key] === true ? h('span', { class: 'r-ai' }, label) : h('span', { class: 'r-ai mock' }, label + ' · 모의');
    }
    // '김기사 (차량번호 경기 34나 7890 · 전화 010-…)' — 둘 다 없으면 이메일로 대신
    function driverNote(e) {
      const parts = [e.user_vehicle_no ? '차량번호 ' + e.user_vehicle_no : '', e.user_phone ? '전화 ' + e.user_phone : ''].filter(Boolean);
      if (!parts.length && e.user_email) parts.push(e.user_email);
      return parts.length ? ' (' + parts.join(' · ') + ')' : '';
    }
    function fillModal(e) {
      const r = e.report || {}, n = stageNum(e.stage);
      const header = $('mHeader'); header.className = 'modal-header s' + n;
      $('mTitle').replaceChildren(h('span', { class: 'hico' }, icon(STAGE_ICON[n], 22)),
        (n ? n + '단계 ' + (e.stage_label || STAGE_NAME[n]) : '경고') + ' 알람 상세', h('small', null, '#' + e.id));

      const photo = e.photo_url
        ? h('div', { class: 'modal-img' }, h('img', { src: e.photo_url, alt: '졸음 순간 캡처 사진', onerror: (ev) => { ev.target.replaceWith(h('span', null, '사진을 불러올 수 없어요')); } }))
        : h('div', { class: 'modal-img' }, icon('camera', 28), e.reason === 'rest_overdue' ? '캡처 사진 없음 (휴게 미준수 이벤트)' : '캡처 사진 없음');
      const place = h('div', { class: 'modal-img place' }, h('b', null, icon('pin', 18), '위치'), where(e) + (e.address && e.latitude != null ? ' (' + Number(e.latitude).toFixed(5) + ', ' + Number(e.longitude).toFixed(5) + ')' : ''));

      const quiz = Array.isArray(r.driving_quiz) ? r.driving_quiz : [];
      const quizNode = quiz.length ? h('div', { class: 'report-row' }, h('span', { class: 'r-label' }, '운전 중 음성 퀴즈'),
        h('span', { class: 'r-value' }, quiz.map((q) => h('span', { style: 'display:block' },
          (QUIZ_LABEL[q.type] || q.type) + ' · “' + q.asked + '” → ' + (q.heard ? q.heard : '(응답 없음)') + ' ',
          h('span', { class: q.passed ? 'q-ok' : 'q-fail' }, (q.passed ? '통과' : '실패') + (q.answer_sec != null ? ' (' + q.answer_sec + '초)' : '')))),
          h('span', { class: 'r-note' }, '※ 운전 중 퀴즈는 단계를 내리지 않습니다 (통과해도 그대로, 2번 실패 시 +1)'))) : null;
      const rest = r.rest;
      const restText = rest && rest.started ? rest.started + ' 정차 → ' + (rest.resumed ? rest.resumed + ' 운행 재개' : '휴식 중') + ' (' + rest.minutes + '분 휴식)' : '';
      const eye = r.eye || {}, eyeParts = [];
      if (eye.closed_sec != null) eyeParts.push('눈 감김 ' + eye.closed_sec + '초');
      if (eye.perclos != null) eyeParts.push('PERCLOS ' + Math.round(eye.perclos * 100) + '%');
      if (eye.eye_open_prob != null) eyeParts.push('눈 뜸 확률 ' + eye.eye_open_prob);
      if (eye.ear != null || e.ear != null) eyeParts.push('EAR ' + (eye.ear != null ? eye.ear : e.ear));

      $('mBody').replaceChildren(
        h('div', null, photo, place),
        h('div', { class: 'report-card' }, h('h3', null, icon('robot', 22), 'Agent 자동 분석 보고서'),
          reportRow('발생 기사', (e.user_name || '기사 ' + e.user_id) + driverNote(e)),
          reportRow('상황 요약', r.situation || e.summary, aiTag(r, 'llm', 'LLM')),
          reportRow('단계 판정 이유', r.stage_reason, aiTag(null, '', '규칙')),
          reportRow('관련 법규 근거', r.regulation, aiTag(r, 'rag', 'RAG')),
          reportRow(isOpenUrgent(e) ? '지금 해야 할 일 (Agent 권장 조치)' : 'Agent 권장 조치', r.recommended_action, aiTag(r, 'agent', 'Agent'), isOpenUrgent(e) ? 'action' : ''),
          reportRow('기사 안내문', e.guidance),
          quizNode, reportRow('휴식 기록', restText), reportRow('앱 눈 숫자', eyeParts.join(' · '))));

      const footer = [h('button', { class: 'btn', type: 'button', 'data-act': 'close', onclick: closeModal }, '닫기'),
        h('button', { class: 'btn', type: 'button', 'data-act': 'contact', onclick: () => openContact({ name: e.user_name || '기사 ' + e.user_id, email: e.user_email, phone: e.user_phone, vehicle: e.user_vehicle_no }) }, icon('phone', 18), '기사에게 연락')];
      if (e.status === '미확인') footer.push(h('button', { class: 'btn', type: 'button', 'data-act': 'ack', onclick: () => changeStatus(e, '확인') }, icon('eye', 18), '확인했어요'));
      if (e.urgent && e.status !== '조치완료') footer.push(h('button', { class: 'btn brand', type: 'button', 'data-act': 'resolve', onclick: () => changeStatus(e, '조치완료') }, icon('check', 18), e.stage === 3 ? '조치완료 (기사 앱 해제)' : '조치완료'));
      $('mFooter').replaceChildren(...footer);
    }
    function openModal(id) {
      const e = events.find((x) => x.id === id);
      if (!e) return;
      modalId = id; sig.modal = JSON.stringify(e);
      fillModal(e);
      openOverlay($('hazardModal'), $('mClose'));
    }
    function refreshModal() {                          // 모달이 열려 있는 동안 서버 값이 바뀌었을 때만 다시 채움
      const e = events.find((x) => x.id === modalId);
      if (!e) { closeModal(); return; }
      const s = JSON.stringify(e);
      if (s === sig.modal) return;
      sig.modal = s;
      const act = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.act : null;
      fillModal(e);
      const again = act ? $('mFooter').querySelector('[data-act="' + act + '"]') : null;
      (again || $('mClose')).focus();
    }
    function closeModal() { if (modalId === null) return; modalId = null; closeOverlay($('hazardModal')); }
    $('mClose').addEventListener('click', closeModal);

    async function changeStatus(e, status) {
      if (busy) return;
      if (status === '조치완료' && !confirm('#' + e.id + ' 경고를 조치완료로 바꿀까요?' + (e.stage === 3 ? '\n기사 앱의 3단계가 해제됩니다.' : ''))) return;
      busy = true;
      try {
        const res = await updateEventStatus(e.id, status);
        closeModal();
        await refreshAll(true);
        toast(status === '확인' ? '확인한 경고로 표시했어요.' : res.stage_reset ? '조치완료로 바꿨어요. 3단계가 해제되며 기사 앱은 다음 갱신(약 30초 안)에 정상 화면이 돼요.' : '조치완료로 바꿨어요.');
      } catch (err) { toast(err.message); }
      finally { busy = false; }
    }

    // ── 기사 연락 모달: 전화번호 · 차량번호는 기사가 앱 프로필에서 직접 적은 값 (안 적었으면 '미등록') ─────
    const digitsOf = (s) => String(s || '').replace(/\D/g, '');
    function openContact(ctx) {
      contactCtx = ctx;
      const validMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ctx.email || '');
      const phoneDigits = digitsOf(ctx.phone);
      const validPhone = phoneDigits.length >= 9 && phoneDigits.length <= 11;      // tel: · sms: 링크에는 숫자만 넣는다
      $('cBody').replaceChildren(h('div', { class: 'contact-avatar' }, icon('person', 34)),
        h('h3', null, ctx.name + ' 기사님'),
        h('p', { class: 'sub' }, ctx.vehicle ? '차량번호 ' + ctx.vehicle : '차량번호 미등록'),
        validPhone ? h('p', { class: 'phone' }, ctx.phone) : h('p', { class: 'note' }, '전화번호가 아직 등록되지 않았어요. 기사가 앱의 내 정보에서 적으면 여기에 나와요.'),
        validMail ? h('p', { class: 'mail' }, ctx.email) : null);
      $('cFooter').replaceChildren(h('button', { class: 'btn', type: 'button', onclick: closeContact }, '닫기'),
        validPhone ? h('a', { class: 'btn', href: 'sms:' + phoneDigits }, icon('mail', 18), '문자 보내기') : null,
        validPhone ? h('a', { class: 'btn brand', href: 'tel:' + phoneDigits }, icon('phone', 18), '전화 걸기')
          : validMail ? h('a', { class: 'btn brand', href: 'mailto:' + ctx.email }, icon('mail', 18), '이메일 보내기') : null);
      // 경고 모달 위에 겹쳐 열릴 때는 뒤 화면 inert 를 풀지 않고, 닫을 때 경고 모달로 돌아간다
      if ($('hazardModal').classList.contains('open')) { contactFocus = document.activeElement; $('contactModal').classList.add('open'); $('mClose').closest('.modal').inert = true; $('cClose').focus(); }
      else openOverlay($('contactModal'), $('cClose'));
    }
    function closeContact() {
      const over = $('hazardModal').classList.contains('open');
      $('contactModal').classList.remove('open'); contactCtx = null;
      if (over) { $('mClose').closest('.modal').inert = false; (contactFocus && document.contains(contactFocus) ? contactFocus : $('mClose')).focus(); }
      else closeOverlay($('contactModal'));
    }
    $('cClose').addEventListener('click', closeContact);

    // ── 불러오기 (10초마다) ───────────────────────────────────
    async function refreshAll(force) {
      const [ev, us, st, hr] = await Promise.allSettled([fetchAdminEvents({}), fetchAdminUsers(), fetchStageStats(), fetchHourlyStats()]);
      if (ev.status === 'fulfilled') events = ev.value; else { $('updated').textContent = ev.reason.message; return; }
      if (us.status === 'fulfilled') users = us.value;
      if (st.status === 'fulfilled') stageStats = st.value;
      if (hr.status === 'fulfilled') hourStats = hr.value;
      $('updated').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');
      renderAll(!!force);
      loaded = true;
    }

    if (!getToken()) location.href = 'admin_login.html';
    fillIcons();
    document.querySelectorAll('.menu-item').forEach((b) => b.addEventListener('click', () => go(b.dataset.view)));
    $('refreshBtn').addEventListener('click', () => refreshAll(true));
    $('logoutBtn').addEventListener('click', () => { clearToken(); location.href = 'admin_login.html'; });
    $('driverSearch').addEventListener('input', (ev) => { driverQuery = ev.target.value; renderAll(true); });
    showView(location.hash.slice(1), false);
    refreshAll(true);
    setInterval(() => { if (!busy) refreshAll(false); }, 10000);
  </script>
</body>
</html>
